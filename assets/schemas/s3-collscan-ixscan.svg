<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">La requête find({ borough: "Bronx" }) avec et sans index. Sans index, COLLSCAN lit tous les documents de la collection : 25 359 documents examinés pour 2 338 renvoyés, les autres sont lus pour rien. Avec l'index { borough: 1 }, les clés sont triées par arrondissement (Bronx, Brooklyn, Manhattan, Queens, Staten Island, plus 51 « Missing ») : IXSCAN ne parcourt que le segment Bronx, puis FETCH lit les documents correspondants : 2 338 clés et 2 338 documents examinés pour 2 338 renvoyés. Un index est trié, mais il coûte de la place et du temps à chaque écriture.</title>
  <text x="580" y="24" font-family="monospace" font-size="19" fill="#333" text-anchor="middle">db.restaurants.find({ borough: "Bronx" })</text>
