<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">La requête db.films.find({ annee: 2001 }) exécutée de deux façons. Sans index, COLLSCAN : MongoDB lit les quatre films dans leur ordre de stockage et teste annee sur chacun ; Chihiro et Amélie (2001) sont renvoyés, Glaneurs (2000) et La Haine (1995) sont lus pour rien : 4 documents lus pour 2 renvoyés. Avec l'index { annee: 1 }, les clés sont rangées 1995, 2000, 2001, 2001 et chacune pointe vers son document ; IXSCAN saute 1995 et 2000 et lit les deux clés 2001, puis FETCH lit seulement les deux documents pointés, Chihiro et Amélie : 2 clés lues, 2 documents lus, 2 renvoyés.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00684a"/>
    </marker>
  </defs>

  <text x="580" y="24" font-family="monospace" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">db.films.find({ annee: 2001 })</text>

  <!-- Sans index -->
  <text x="10" y="64" font-size="19" font-weight="bold" fill="#c0392b">Sans index : <tspan font-family="monospace">COLLSCAN</tspan></text>
  <g font-size="18">
    <rect x="10" y="80" width="250" height="40" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="22" y="106" fill="#333"><tspan font-weight="bold">Chihiro</tspan> <tspan font-family="monospace">2001</tspan></text>
    <text x="276" y="106" fill="#00684a">lu, renvoyé</text>
    <rect x="10" y="130" width="250" height="40" rx="7" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
    <text x="22" y="156" fill="#333"><tspan font-weight="bold">Glaneurs</tspan> <tspan font-family="monospace">2000</tspan></text>
    <text x="276" y="156" fill="#c0392b">lu pour rien</text>
    <rect x="10" y="180" width="250" height="40" rx="7" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
    <text x="22" y="206" fill="#333"><tspan font-weight="bold">La Haine</tspan> <tspan font-family="monospace">1995</tspan></text>
    <text x="276" y="206" fill="#c0392b">lu pour rien</text>
    <rect x="10" y="230" width="250" height="40" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="22" y="256" fill="#333"><tspan font-weight="bold">Amélie</tspan> <tspan font-family="monospace">2001</tspan></text>
    <text x="276" y="256" fill="#00684a">lu, renvoyé</text>
  </g>
  <text x="10" y="310" font-size="19" fill="#333"><tspan font-weight="bold">4</tspan> documents lus, <tspan font-weight="bold">2</tspan> renvoyés</text>

  <line x1="470" y1="50" x2="470" y2="318" stroke="#b8c4cf" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Avec index -->
  <text x="500" y="64" font-size="19" font-weight="bold" fill="#00684a">Avec <tspan font-family="monospace">{ annee: 1 }</tspan> : <tspan font-family="monospace">IXSCAN</tspan>, puis <tspan font-family="monospace">FETCH</tspan></text>
  <g font-size="18" font-family="monospace">
    <rect x="500" y="80" width="90" height="40" rx="7" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
    <text x="545" y="106" text-anchor="middle" fill="#888">1995</text>
    <rect x="500" y="130" width="90" height="40" rx="7" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
    <text x="545" y="156" text-anchor="middle" fill="#888">2000</text>
    <rect x="500" y="180" width="90" height="40" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
    <text x="545" y="206" text-anchor="middle" fill="#333" font-weight="bold">2001</text>
    <rect x="500" y="230" width="90" height="40" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
    <text x="545" y="256" text-anchor="middle" fill="#333" font-weight="bold">2001</text>
  </g>
  <g font-size="18">
    <text x="600" y="106" fill="#888">sautée</text>
    <text x="600" y="156" fill="#888">sautée</text>
    <text x="600" y="206" fill="#00684a">lue</text>
    <text x="600" y="256" fill="#00684a">lue</text>
  </g>

  <g font-size="18">
    <rect x="890" y="80" width="260" height="40" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="902" y="106" fill="#333"><tspan font-weight="bold">Chihiro</tspan> : lu, renvoyé</text>
    <rect x="890" y="130" width="260" height="40" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="902" y="156" fill="#999">Glaneurs : jamais lu</text>
    <rect x="890" y="180" width="260" height="40" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="902" y="206" fill="#999">La Haine : jamais lu</text>
    <rect x="890" y="230" width="260" height="40" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="902" y="256" fill="#333"><tspan font-weight="bold">Amélie</tspan> : lu, renvoyé</text>
  </g>
  <path d="M640,200 C760,200 760,100 880,100" fill="none" stroke="#00684a" stroke-width="2.5" marker-end="url(#fl)"/>
  <path d="M640,250 H880" fill="none" stroke="#00684a" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="760" y="290" font-size="18" fill="#555" text-anchor="middle">clés triées → documents pointés</text>
  <text x="500" y="318" font-size="19" fill="#333"><tspan font-weight="bold">2</tspan> clés lues, <tspan font-weight="bold">2</tspan> documents lus, <tspan font-weight="bold">2</tspan> renvoyés</text>
</svg>
