<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">La requête db.films.find({ annee: 2001 }) exécutée de deux façons. Sans index, COLLSCAN : MongoDB lit les quatre films de la collection, dans leur ordre de stockage, et teste annee sur chacun ; Chihiro (2001) et Amélie (2001) sont renvoyés, Glaneurs (2000) et La Haine (1995) sont lus pour rien : 4 documents lus pour 2 renvoyés. Avec l'index { annee: 1 }, les clés sont rangées dans l'ordre 1995, 2000, 2001, 2001 et chacune pointe vers son document ; IXSCAN saute les clés 1995 et 2000 et lit les deux clés 2001, puis FETCH lit seulement les deux documents pointés, Chihiro et Amélie : 2 clés lues, 2 documents lus, 2 renvoyés.</title>
  <defs>
    <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13aa52"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="580" y="22" font-family="monospace" font-size="18" fill="#333" text-anchor="middle">db.films.find({ annee: <tspan fill="#4a90d9" font-weight="bold">2001</tspan> })</text>

  <!-- Sans index -->
  <rect x="2" y="36" width="548" height="270" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="18" y="64" font-size="18" font-weight="bold" fill="#333">Sans index : <tspan font-family="monospace" fill="#c0392b">COLLSCAN</tspan></text>
  <text x="18" y="88" font-size="15" fill="#555">MongoDB lit chaque document et teste annee = 2001</text>

  <rect x="18" y="104" width="250" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="30" y="126" font-size="16" font-weight="bold" fill="#333">Chihiro</text>
  <text x="256" y="126" font-family="monospace" font-size="15" fill="#4a90d9" text-anchor="end">annee: 2001</text>
  <line x1="272" y1="120" x2="300" y2="120" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="306" y="104" width="228" height="32" rx="16" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="420" y="125" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">2001 : renvoyé</text>

  <rect x="18" y="144" width="250" height="32" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="30" y="166" font-size="16" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="256" y="166" font-family="monospace" font-size="15" fill="#b06f00" text-anchor="end">annee: 2000</text>
  <line x1="272" y1="160" x2="300" y2="160" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="306" y="144" width="228" height="32" rx="16" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="420" y="165" font-size="15" fill="#c0392b" text-anchor="middle">2000 : lu pour rien</text>

  <rect x="18" y="184" width="250" height="32" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="30" y="206" font-size="16" font-weight="bold" fill="#333">La Haine</text>
  <text x="256" y="206" font-family="monospace" font-size="15" fill="#8e44ad" text-anchor="end">annee: 1995</text>
  <line x1="272" y1="200" x2="300" y2="200" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="306" y="184" width="228" height="32" rx="16" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="420" y="205" font-size="15" fill="#c0392b" text-anchor="middle">1995 : lu pour rien</text>

  <rect x="18" y="224" width="250" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="30" y="246" font-size="16" font-weight="bold" fill="#333">Amélie</text>
  <text x="256" y="246" font-family="monospace" font-size="15" fill="#4a90d9" text-anchor="end">annee: 2001</text>
  <line x1="272" y1="240" x2="300" y2="240" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="306" y="224" width="228" height="32" rx="16" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="420" y="245" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">2001 : renvoyé</text>

  <text x="276" y="290" font-size="17" fill="#333" text-anchor="middle"><tspan font-weight="bold" fill="#c0392b">4</tspan> documents lus → <tspan font-weight="bold" fill="#00684a">2</tspan> renvoyés</text>

  <!-- Avec index -->
  <rect x="566" y="36" width="592" height="270" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="582" y="64" font-size="18" font-weight="bold" fill="#333">Avec l'index <tspan font-family="monospace">{ annee: 1 }</tspan> : <tspan font-family="monospace" fill="#00684a">IXSCAN</tspan> puis <tspan font-family="monospace" fill="#00684a">FETCH</tspan></text>

  <text x="582" y="125" font-size="14" fill="#777">sautée</text>
  <rect x="640" y="104" width="110" height="32" rx="7" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="654" y="126" font-family="monospace" font-size="16" fill="#999">1995</text>
  <circle cx="734" cy="120" r="4" fill="#b8c4cf"/>

  <text x="582" y="165" font-size="14" fill="#777">sautée</text>
  <rect x="640" y="144" width="110" height="32" rx="7" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="654" y="166" font-family="monospace" font-size="16" fill="#999">2000</text>
  <circle cx="734" cy="160" r="4" fill="#b8c4cf"/>

  <text x="582" y="205" font-size="14" font-weight="bold" fill="#00684a">lue</text>
  <rect x="640" y="184" width="110" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="654" y="206" font-family="monospace" font-size="16" font-weight="bold" fill="#4a90d9">2001</text>
  <circle cx="734" cy="200" r="4" fill="#13aa52"/>

  <text x="582" y="245" font-size="14" font-weight="bold" fill="#00684a">lue</text>
  <rect x="640" y="224" width="110" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="654" y="246" font-family="monospace" font-size="16" font-weight="bold" fill="#4a90d9">2001</text>
  <circle cx="734" cy="240" r="4" fill="#13aa52"/>

  <line x1="738" y1="200" x2="894" y2="122" stroke="#13aa52" stroke-width="2.2" marker-end="url(#fv)"/>
  <line x1="738" y1="240" x2="894" y2="240" stroke="#13aa52" stroke-width="2.2" marker-end="url(#fv)"/>
  <text x="816" y="232" font-family="monospace" font-size="14" font-weight="bold" fill="#00684a" text-anchor="middle">FETCH</text>

  <rect x="900" y="104" width="240" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="912" y="126" font-size="16" font-weight="bold" fill="#333">Chihiro</text>
  <text x="1128" y="126" font-family="monospace" font-size="15" fill="#4a90d9" text-anchor="end">annee: 2001</text>
  <rect x="900" y="144" width="240" height="32" rx="7" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="912" y="166" font-size="16" fill="#999">Glaneurs</text>
  <text x="1128" y="166" font-size="14" fill="#999" text-anchor="end">jamais lu</text>
  <rect x="900" y="184" width="240" height="32" rx="7" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="912" y="206" font-size="16" fill="#999">La Haine</text>
  <text x="1128" y="206" font-size="14" fill="#999" text-anchor="end">jamais lu</text>
  <rect x="900" y="224" width="240" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="912" y="246" font-size="16" font-weight="bold" fill="#333">Amélie</text>
  <text x="1128" y="246" font-family="monospace" font-size="15" fill="#4a90d9" text-anchor="end">annee: 2001</text>

  <text x="695" y="90" font-size="15" fill="#555" text-anchor="middle">l'index : clés triées</text>
  <text x="1020" y="90" font-size="15" fill="#555" text-anchor="middle">la collection</text>
  <text x="862" y="290" font-size="17" fill="#333" text-anchor="middle"><tspan font-weight="bold" fill="#00684a">2</tspan> clés lues, <tspan font-weight="bold" fill="#00684a">2</tspan> documents lus → <tspan font-weight="bold" fill="#00684a">2</tspan> renvoyés</text>
</svg>
