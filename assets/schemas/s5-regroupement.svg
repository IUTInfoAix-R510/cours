  </defs>
  <text x="10" y="26" font-size="17" font-weight="bold" font-family="monospace" fill="#333">RETURN <tspan fill="#2a6db5">j.titre</tspan> AS jeu, <tspan fill="#b06f00">count(p)</tspan> AS fans, <tspan fill="#b06f00">round(avg(a.note), 1)</tspan> AS moyenne</text>
