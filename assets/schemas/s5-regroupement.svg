<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le regroupement implicite, pour RETURN j.titre AS jeu, count(p) AS fans, round(avg(a.note), 1) AS moyenne. 1, les 11 lignes du MATCH (p, j, note) : Ana Archipel 5, Ana Comète 3, Bilal Archipel 4, Bilal Marée haute 5, Camille Comète 4, Camille Sortilège 5, Dario Marée haute 4, Dario Sortilège 2, Elif Archipel 3, Elif Marée haute 4, Farah Comète 5. 2, les lignes rangées par jeu, la colonne qui n'est pas agrégée : Archipel (Ana 5, Bilal 4, Elif 3), Comète (Ana 3, Camille 4, Farah 5), Marée haute (Bilal 5, Dario 4, Elif 4), Sortilège (Camille 5, Dario 2). 3, une ligne par jeu : Archipel, 3 fans, moyenne 4.0 ; Comète, 3, 4.0 ; Marée haute, 3, 4.3 ; Sortilège, 2, 3.5.</title>
