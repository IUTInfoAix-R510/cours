<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Avec l'index { annee: 1, titre: 1, duree: 1 }, la requête find({ annee: 2001, duree: { $gt: 100 } }, projection).sort({ titre: 1 }) lit la clé (2001, Amélie Poulain, 122). À gauche, projection { _id: 0, titre: 1, duree: 1 } : titre et duree sont pris dans la clé, le résultat { titre: 'Amélie Poulain', duree: 122 } se construit sans document ; plan PROJECTION_COVERED ← IXSCAN, totalDocsExamined 0. À droite, projection { titre: 1, duree: 1 } : _id, projeté par défaut, est absent de la clé ; MongoDB lit le document (FETCH) pour le prendre ; résultat { _id: ObjectId(…), titre, duree } ; plan PROJECTION_SIMPLE ← FETCH ← IXSCAN, totalDocsExamined 2, chaque film est lu.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="flr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <text x="580" y="20" font-family="monospace" font-size="18" fill="#333" text-anchor="middle">index { annee: 1, titre: 1, duree: 1 } · find({ annee: 2001, duree: { $gt: 100 } }, <tspan font-weight="bold" fill="#b06f00">projection</tspan>)</text>

  <!-- couverte -->
  <rect x="2" y="32" width="566" height="266" rx="10" fill="#f7f9fb" stroke="#13aa52" stroke-width="2.5"/>
  <text x="16" y="60" font-size="19" font-weight="bold" fill="#00684a">Couverte : <tspan font-family="monospace" fill="#b06f00">{ _id: 0, titre: 1, duree: 1 }</tspan></text>
  <rect x="16" y="74" width="300" height="36" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="28" y="99" font-family="monospace" font-size="18" fill="#333">2001 "Amélie Poulain" 122</text>
  <text x="328" y="99" font-size="18" fill="#555">une clé</text>
  <line x1="166" y1="112" x2="166" y2="146" stroke="#13aa52" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="178" y="136" font-size="18" fill="#00684a">titre, duree : pris dans la clé</text>
  <rect x="16" y="152" width="440" height="36" rx="6" fill="#fff" stroke="#13aa52" stroke-width="2"/>
  <text x="28" y="177" font-family="monospace" font-size="18" fill="#333">{ titre: 'Amélie Poulain', duree: 122 }</text>
  <text x="16" y="232" font-size="18" fill="#555">Plan :</text>
  <rect x="78" y="210" width="210" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="183" y="232" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">PROJECTION_COVERED</text>
  <text x="300" y="233" font-size="18" fill="#555" text-anchor="middle">←</text>
  <rect x="312" y="210" width="80" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="352" y="232" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="16" y="280" font-size="18" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#00684a">totalDocsExamined: 0</tspan> : aucun document lu</text>

  <!-- non couverte -->
  <rect x="592" y="32" width="566" height="266" rx="10" fill="#f7f9fb" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="606" y="60" font-size="19" font-weight="bold" fill="#c0392b">Non couverte : <tspan font-family="monospace" fill="#b06f00">{ titre: 1, duree: 1 }</tspan></text>
  <rect x="606" y="74" width="300" height="36" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="618" y="99" font-family="monospace" font-size="18" fill="#333">2001 "Amélie Poulain" 122</text>
  <line x1="908" y1="92" x2="944" y2="92" stroke="#c0392b" stroke-width="2.2" marker-end="url(#flr)"/>
  <rect x="952" y="74" width="196" height="36" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="964" y="99" font-size="18" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#c0392b">FETCH</tspan> : le document</text>
  <text x="606" y="136" font-size="18" fill="#c0392b"><tspan font-family="monospace">_id</tspan>, projeté par défaut, n'est pas dans la clé</text>
  <rect x="606" y="152" width="540" height="36" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="618" y="177" font-family="monospace" font-size="18" fill="#333">{ _id: ObjectId(…), titre: …, duree: 122 }</text>
  <text x="606" y="232" font-size="18" fill="#555">Plan :</text>
  <rect x="668" y="210" width="196" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="766" y="232" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">PROJECTION_SIMPLE</text>
  <text x="876" y="233" font-size="18" fill="#555" text-anchor="middle">←</text>
  <rect x="888" y="210" width="74" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="925" y="232" font-family="monospace" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">FETCH</text>
  <text x="974" y="233" font-size="18" fill="#555" text-anchor="middle">←</text>
  <rect x="986" y="210" width="80" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="1026" y="232" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="606" y="280" font-size="18" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#c0392b">totalDocsExamined: 2</tspan> : chaque film est lu</text>
</svg>
