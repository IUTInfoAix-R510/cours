  <text x="766" y="153" font-size="15" fill="#00684a">titre, duree</text>
  <line x1="1052" y1="122" x2="1052" y2="171" stroke="#c0392b" stroke-width="2.2" marker-end="url(#fr)"/>
  <text x="1040" y="153" font-size="15" fill="#c0392b" text-anchor="end">_id, absent de la clé</text>
  <rect x="604" y="180" width="540" height="34" rx="7" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="616" y="202" font-family="monospace" font-size="14" fill="#333">{ <tspan fill="#c0392b" font-weight="bold">_id: ObjectId('…')</tspan>, titre: "Amélie Poulain", duree: 122 }</text>
  <text x="604" y="258" font-size="16" fill="#555">Plan :</text>
  <rect x="656" y="239" width="184" height="28" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="748" y="258" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">PROJECTION_SIMPLE</text>
  <line x1="870" y1="253" x2="849" y2="253" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="874" y="239" width="68" height="28" rx="7" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="908" y="258" font-family="monospace" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">FETCH</text>
  <line x1="972" y1="253" x2="951" y2="253" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="976" y="239" width="78" height="28" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="1015" y="258" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="604" y="290" font-size="16" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#c0392b">totalDocsExamined: 2</tspan> : les 2 films renvoyés sont lus</text>
