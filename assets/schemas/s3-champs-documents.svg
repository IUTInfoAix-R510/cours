<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 232" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux questions à se poser à chaque étape. À gauche, quels champs restent : le film Chihiro, avec ses 6 champs, passe dans $project, qui ne garde que les champs cités (titre et nb_notes), ou dans $addFields, qui garde les 6 champs et ajoute nb_notes. À droite, combien de documents restent : les 4 films passent dans $group par année, qui rend 3 documents, un par année, ou dans $setWindowFields partitionné par année, qui rend les 4 films, chacun avec un champ calculé sur son année.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Quels champs -->
  <rect x="2" y="2" width="566" height="228" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="18" y="32" font-size="21" font-weight="bold" fill="#333">Quels champs restent ?</text>
  <rect x="18" y="104" width="150" height="64" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="93" y="132" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Chihiro</text>
  <text x="93" y="157" font-size="18" fill="#555" text-anchor="middle">6 champs</text>
  <path d="M170,124 C210,124 210,84 250,84" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <path d="M170,150 C210,150 210,190 250,190" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="18" y="90" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">$project</text>
  <text x="18" y="206" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">$addFields</text>
  <rect x="258" y="58" width="296" height="52" rx="8" fill="#fff" stroke="#e8a838" stroke-width="2"/>
  <text x="272" y="91" font-size="19" fill="#333"><tspan font-family="monospace">titre, nb_notes</tspan> : <tspan font-weight="bold">2</tspan></text>
  <rect x="258" y="164" width="296" height="52" rx="8" fill="#fff" stroke="#13aa52" stroke-width="2"/>
  <text x="272" y="197" font-size="19" fill="#333">les 6 + <tspan font-family="monospace" font-weight="bold" fill="#00684a">nb_notes</tspan> : <tspan font-weight="bold">7</tspan></text>
  

  <!-- Combien de documents -->
  <rect x="590" y="2" width="568" height="228" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="606" y="32" font-size="21" font-weight="bold" fill="#333">Combien de documents restent ?</text>
  <rect x="606" y="104" width="120" height="64" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="666" y="132" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">4 films</text>
  <text x="666" y="157" font-size="18" fill="#555" text-anchor="middle">par année</text>
  <path d="M728,124 C768,124 768,84 808,84" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <path d="M728,150 C768,150 768,190 808,190" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="606" y="90" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">$group</text>
  <text x="606" y="206" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">$setWindowFields</text>
  <rect x="816" y="58" width="330" height="52" rx="8" fill="#fff" stroke="#e8a838" stroke-width="2"/>
  <text x="830" y="91" font-size="19" fill="#333"><tspan font-weight="bold">3</tspan> documents, un par année</text>
  <rect x="816" y="164" width="330" height="52" rx="8" fill="#fff" stroke="#13aa52" stroke-width="2"/>
  <text x="830" y="197" font-size="19" fill="#333"><tspan font-weight="bold">4</tspan> films, chacun + un calcul</text>
</svg>
