<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 270" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Les classes d'aide du pilote Java fabriquent le document de la requête. À gauche, le code Java Filters.and( Filters.gte("annee", 2000), Filters.gt("duree", 100) ). Au milieu, le document que chaque appel fabrique, ligne à ligne : Filters.and donne { "$and": [ ... ] }, Filters.gte("annee", 2000) donne { "annee": { "$gte": 2000 } }, Filters.gt("duree", 100) donne { "duree": { "$gt": 100 } }. Il a le même sens qu'en mongosh { annee: { $gte: 2000 }, duree: { $gt: 100 } }. À droite, MongoDB l'applique aux 4 films : Chihiro (2001, 125 min) et Amélie (2001, 122 min) sont retenus ; Glaneurs est écarté par la durée (82 ≤ 100), La Haine par l'année (1995 &lt; 2000). En bas, une classe d'aide par rôle : Filters (filtre), Projections (projection), Sorts (tri), Aggregates (étapes), Accumulators (accumulateurs).</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- en-têtes -->
  <g font-size="17" font-weight="bold" fill="#333">
    <text x="2" y="20">En Java : des appels de méthodes</text>
    <text x="462" y="20">Le document fabriqué</text>
    <text x="1158" y="20" text-anchor="end">MongoDB l'applique aux 4 films</text>
  </g>

  <!-- code Java -->
  <rect x="2" y="34" width="404" height="148" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <g font-family="monospace" font-size="16" fill="#333">
    <text x="16" y="66"><tspan fill="#00684a" font-weight="bold">Filters.and</tspan>(</text>
    <text x="35" y="98"><tspan fill="#00684a" font-weight="bold">Filters.gte</tspan>(<tspan fill="#4a90d9" font-weight="bold">"annee"</tspan>, <tspan fill="#b06f00" font-weight="bold">2000</tspan>),</text>
    <text x="35" y="130"><tspan fill="#00684a" font-weight="bold">Filters.gt</tspan>(<tspan fill="#4a90d9" font-weight="bold">"duree"</tspan>, <tspan fill="#b06f00" font-weight="bold">100</tspan>))</text>
  </g>
  <text x="16" y="168" font-size="14" fill="#555">chaque appel renvoie un morceau de document</text>

  <!-- correspondance ligne à ligne -->
  <g stroke="#555" stroke-width="2" marker-end="url(#fl)">
    <line x1="410" y1="61" x2="456" y2="61"/>
    <line x1="410" y1="93" x2="456" y2="93"/>
    <line x1="410" y1="125" x2="456" y2="125"/>
  </g>

  <!-- document fabriqué -->
  <rect x="462" y="34" width="356" height="148" rx="10" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <g font-family="monospace" font-size="16" fill="#333">
    <text x="476" y="66">{ <tspan fill="#00684a" font-weight="bold">"$and"</tspan>: [</text>
    <text x="495" y="98">{ <tspan fill="#4a90d9" font-weight="bold">"annee"</tspan>: { "$gte": <tspan fill="#b06f00" font-weight="bold">2000</tspan> } },</text>
    <text x="495" y="130">{ <tspan fill="#4a90d9" font-weight="bold">"duree"</tspan>: { <tspan fill="#00684a" font-weight="bold">"$gt"</tspan>: <tspan fill="#b06f00" font-weight="bold">100</tspan> } }</text>
    <text x="476" y="162">] }</text>
  </g>

  <line x1="818" y1="108" x2="870" y2="108" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <!-- les 4 films -->
  <g font-size="15">
    <rect x="876" y="34" width="282" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
    <text x="888" y="56" font-weight="bold" fill="#333">Chihiro</text>
    <text x="1060" y="56" font-family="monospace" font-size="14" fill="#555" text-anchor="end">2001, 125</text>
    <text x="1146" y="56" font-weight="bold" fill="#00684a" text-anchor="end">retenu</text>

    <rect x="876" y="72" width="282" height="32" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
    <text x="888" y="94" font-weight="bold" fill="#333">Amélie</text>
    <text x="1060" y="94" font-family="monospace" font-size="14" fill="#555" text-anchor="end">2001, 122</text>
    <text x="1146" y="94" font-weight="bold" fill="#00684a" text-anchor="end">retenu</text>

    <rect x="876" y="110" width="282" height="32" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
    <text x="888" y="132" font-weight="bold" fill="#333">Glaneurs</text>
    <text x="1070" y="132" font-family="monospace" font-size="14" fill="#c0392b" text-anchor="end">82 ≤ 100</text>
    <text x="1146" y="132" fill="#c0392b" text-anchor="end">écarté</text>

    <rect x="876" y="148" width="282" height="32" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
    <text x="888" y="170" font-weight="bold" fill="#333">La Haine</text>
    <text x="1070" y="170" font-family="monospace" font-size="14" fill="#c0392b" text-anchor="end">1995 &lt; 2000</text>
    <text x="1146" y="170" fill="#c0392b" text-anchor="end">écarté</text>
  </g>

  <text x="462" y="206" font-size="15" fill="#555">même sens qu'en mongosh : <tspan font-family="monospace" fill="#333">{ annee: { $gte: 2000 }, duree: { $gt: 100 } }</tspan></text>

  <!-- les cinq classes d'aide -->
  <text x="2" y="253" font-size="15" fill="#555">une classe par rôle :</text>
  <g font-size="15">
    <rect x="176" y="232" width="150" height="32" rx="7" fill="#ffffff" stroke="#13aa52" stroke-width="2"/>
    <text x="188" y="253" fill="#555"><tspan font-family="monospace" font-weight="bold" fill="#00684a">Filters</tspan> : filtre</text>
    <rect x="340" y="232" width="216" height="32" rx="7" fill="#ffffff" stroke="#13aa52" stroke-width="2"/>
    <text x="352" y="253" fill="#555"><tspan font-family="monospace" font-weight="bold" fill="#00684a">Projections</tspan> : projection</text>
    <rect x="570" y="232" width="112" height="32" rx="7" fill="#ffffff" stroke="#13aa52" stroke-width="2"/>
    <text x="582" y="253" fill="#555"><tspan font-family="monospace" font-weight="bold" fill="#00684a">Sorts</tspan> : tri</text>
    <rect x="696" y="232" width="190" height="32" rx="7" fill="#ffffff" stroke="#13aa52" stroke-width="2"/>
    <text x="708" y="253" fill="#555"><tspan font-family="monospace" font-weight="bold" fill="#00684a">Aggregates</tspan> : étapes</text>
    <rect x="900" y="232" width="258" height="32" rx="7" fill="#ffffff" stroke="#13aa52" stroke-width="2"/>
    <text x="912" y="253" fill="#555"><tspan font-family="monospace" font-weight="bold" fill="#00684a">Accumulators</tspan> : accumulateurs</text>
  </g>
</svg>
