<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le code Java Filters.and( Filters.gte("annee", 2000), Filters.gt("duree", 100) ) fabrique, appel par appel, le document { "$and": [ { "annee": { "$gte": 2000 } }, { "duree": { "$gt": 100 } } ] }, de même sens que { annee: { $gte: 2000 }, duree: { $gt: 100 } } en mongosh. MongoDB l'applique aux 4 films : Chihiro et Amélie retenus, Glaneurs écarté par la durée (82 ≤ 100), La Haine par l'année (1995 &lt; 2000). Une classe d'aide par rôle : Filters, Projections, Sorts, Aggregates, Accumulators.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <g font-size="19" font-weight="bold" fill="#333">
    <text x="2" y="22">En Java : des appels</text>
    <text x="402" y="22">Le document fabriqué</text>
    <text x="1158" y="22" text-anchor="end">MongoDB l'applique</text>
  </g>

  <rect x="2" y="36" width="370" height="150" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="14" y="70"><tspan fill="#00684a" font-weight="bold">Filters.and</tspan>(</text>
    <text x="30" y="104"><tspan fill="#00684a" font-weight="bold">Filters.gte</tspan>(<tspan fill="#2f6db0" font-weight="bold">"annee"</tspan>, <tspan fill="#b06f00" font-weight="bold">2000</tspan>),</text>
    <text x="30" y="138"><tspan fill="#00684a" font-weight="bold">Filters.gt</tspan>(<tspan fill="#2f6db0" font-weight="bold">"duree"</tspan>, <tspan fill="#b06f00" font-weight="bold">100</tspan>))</text>
  </g>
  <text x="14" y="174" font-size="18" fill="#555">un appel, un morceau</text>

  <g stroke="#555" stroke-width="2" marker-end="url(#fl)">
    <line x1="376" y1="64" x2="394" y2="64"/>
    <line x1="376" y1="98" x2="394" y2="98"/>
    <line x1="376" y1="132" x2="394" y2="132"/>
  </g>

  <rect x="402" y="36" width="420" height="150" rx="10" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="414" y="70">{ <tspan fill="#00684a" font-weight="bold">"$and"</tspan>: [</text>
    <text x="430" y="104">{ <tspan fill="#2f6db0" font-weight="bold">"annee"</tspan>: { "$gte": <tspan fill="#b06f00" font-weight="bold">2000</tspan> } },</text>
    <text x="430" y="138">{ <tspan fill="#2f6db0" font-weight="bold">"duree"</tspan>: { "$gt": <tspan fill="#b06f00" font-weight="bold">100</tspan> } }</text>
    <text x="414" y="172">] }</text>
  </g>

  <line x1="826" y1="111" x2="846" y2="111" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <g font-size="18">
    <rect x="852" y="36" width="306" height="34" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
    <text x="864" y="59" fill="#333"><tspan font-weight="bold">Chihiro</tspan> : <tspan fill="#00684a" font-weight="bold">retenu</tspan></text>
    <rect x="852" y="74" width="306" height="34" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
    <text x="864" y="97" fill="#333"><tspan font-weight="bold">Amélie</tspan> : <tspan fill="#00684a" font-weight="bold">retenu</tspan></text>
    <rect x="852" y="112" width="306" height="34" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
    <text x="864" y="135" fill="#333"><tspan font-weight="bold">Glaneurs</tspan> : <tspan font-family="monospace" fill="#c0392b">82 ≤ 100</tspan>, écarté</text>
    <rect x="852" y="150" width="306" height="34" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
    <text x="864" y="173" fill="#333"><tspan font-weight="bold">La Haine</tspan> : <tspan font-family="monospace" fill="#c0392b">1995 &lt; 2000</tspan>, écarté</text>
  </g>

  <text x="2" y="230" font-size="18" fill="#555">même sens qu'en mongosh : <tspan font-family="monospace" fill="#333">{ annee: { $gte: 2000 }, duree: { $gt: 100 } }</tspan></text>
  <text x="2" y="268" font-size="18" fill="#555">une classe par rôle : <tspan font-family="monospace" font-weight="bold" fill="#00684a">Filters</tspan> (filtre), <tspan font-family="monospace" font-weight="bold" fill="#00684a">Projections</tspan>, <tspan font-family="monospace" font-weight="bold" fill="#00684a">Sorts</tspan>, <tspan font-family="monospace" font-weight="bold" fill="#00684a">Aggregates</tspan> (étapes), <tspan font-family="monospace" font-weight="bold" fill="#00684a">Accumulators</tspan></text>
</svg>
