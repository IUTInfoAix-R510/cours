<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 250" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Sur le même film, La Haine. À gauche, un filtre classique, { duree: { $gt: 100 } }, compare une valeur du document (duree, 98) à une constante écrite dans la requête (100) : 98 > 100 est faux, le film est écarté. À droite, { $expr: { $gt: [A, B] } } compare deux valeurs du même document : A, la première note (5), et B, la dernière (2) ; 5 > 2 est vrai, le film est retenu.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="fla" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06f00"/>
    </marker>
  </defs>

  <!-- Filtre classique -->
  <rect x="2" y="2" width="420" height="246" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="18" y="32" font-size="21" font-weight="bold" fill="#333">Filtre classique</text>
  <text x="18" y="60" font-size="18" fill="#555"><tspan fill="#2f6db0" font-weight="bold">le document</tspan> contre <tspan fill="#b06f00" font-weight="bold">une constante</tspan></text>
  <text x="18" y="96" font-family="monospace" font-size="20" fill="#333">{ <tspan fill="#2f6db0" font-weight="bold">duree</tspan>: { <tspan fill="#00684a" font-weight="bold">$gt</tspan>: <tspan fill="#b06f00" font-weight="bold">100</tspan> } }</text>

  <rect x="18" y="124" width="200" height="72" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="30" y="152">"La Haine"</text>
    <text x="30" y="182">duree: <tspan fill="#2f6db0" font-weight="bold">98</tspan></text>
  </g>
  <path d="M232,104 V114 Q232,118 236,118 H316 Q320,118 320,124 V130" fill="none" stroke="#b06f00" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#fla)"/>
  <line x1="222" y1="176" x2="252" y2="176" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="260" y="138" width="120" height="66" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="320" y="164" font-family="monospace" font-size="20" font-weight="bold" fill="#00684a" text-anchor="middle">$gt</text>
  <text x="320" y="192" font-family="monospace" font-size="19" fill="#333" text-anchor="middle"><tspan fill="#2f6db0" font-weight="bold">98</tspan> &gt; <tspan fill="#b06f00" font-weight="bold">100</tspan></text>
  <text x="18" y="232" font-size="19" fill="#c0392b"><tspan font-weight="bold">faux</tspan> : La Haine est écartée</text>

  <!-- $expr -->
  <rect x="440" y="2" width="718" height="246" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="456" y="32" font-size="21" font-weight="bold" fill="#333"><tspan font-family="monospace" fill="#00684a">$expr</tspan> : <tspan fill="#2f6db0">deux valeurs du même document</tspan></text>
  <text x="456" y="66" font-family="monospace" font-size="20" fill="#333">{ <tspan fill="#00684a" font-weight="bold">$expr</tspan>: { <tspan fill="#00684a" font-weight="bold">$gt</tspan>: [ <tspan fill="#2f6db0" font-weight="bold">A</tspan>, <tspan fill="#2f6db0" font-weight="bold">B</tspan> ] } }</text>

  <rect x="456" y="86" width="300" height="134" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="470" y="114">"La Haine", notes: [</text>
    <text x="470" y="208">]</text>
  </g>
  <rect x="482" y="124" width="262" height="32" rx="7" fill="#fff" stroke="#4a90d9" stroke-width="2"/>
  <text x="492" y="147" font-family="monospace" font-size="19" fill="#333">presse, note: <tspan fill="#2f6db0" font-weight="bold">5</tspan></text>
  <rect x="482" y="162" width="262" height="32" rx="7" fill="#fff" stroke="#4a90d9" stroke-width="2"/>
  <text x="492" y="185" font-family="monospace" font-size="19" fill="#333">public, note: <tspan fill="#2f6db0" font-weight="bold">2</tspan></text>

  <line x1="748" y1="140" x2="790" y2="118" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <line x1="748" y1="178" x2="790" y2="196" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <g font-size="19" fill="#333">
    <text x="798" y="122"><tspan fill="#2f6db0" font-weight="bold">A</tspan> : la première = <tspan font-weight="bold" fill="#2f6db0">5</tspan></text>
    <text x="798" y="204"><tspan fill="#2f6db0" font-weight="bold">B</tspan> : la dernière = <tspan font-weight="bold" fill="#2f6db0">2</tspan></text>
  </g>
  <line x1="990" y1="116" x2="1030" y2="146" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <line x1="990" y1="198" x2="1030" y2="176" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="1036" y="128" width="110" height="64" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="1091" y="154" font-family="monospace" font-size="20" font-weight="bold" fill="#00684a" text-anchor="middle">$gt</text>
  <text x="1091" y="182" font-family="monospace" font-size="19" fill="#333" text-anchor="middle"><tspan fill="#2f6db0" font-weight="bold">5</tspan> &gt; <tspan fill="#2f6db0" font-weight="bold">2</tspan></text>
  <text x="1150" y="236" font-size="19" fill="#00684a" text-anchor="end"><tspan font-weight="bold">vrai</tspan> : La Haine est retenue</text>
</svg>
