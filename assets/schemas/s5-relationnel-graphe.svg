<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 816" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Traduire un schéma relationnel en graphe, ligne par ligne, avec des lignes du jeu de données. À gauche, quatre tables avec une ligne chacune : developpeur(id, pseudo, ville) avec la ligne (8, 'nora-f', 'Marseille') ; maintenance(developpeur_id, paquet_id, depuis) avec (8, 12, '2026-07-19') ; paquet(id, nom, licence, telechargements, publie_le) avec (12, 'rapporteur', 'Apache-2.0', 2055, '2023-06-03') ; faille(code, gravite, publiee_le, paquet_id) avec ('FV-2026-0073', 'critique', '2026-03-01', 12). À droite, le graphe obtenu, relié à chaque ligne par un pointillé : le nœud nora-f :Developpeur {pseudo: 'nora-f', ville: 'Marseille'} ; le nœud rapporteur :Paquet {nom: 'rapporteur', …}, ses autres colonnes étant laissées à l'exercice 1 ; le nœud FV-2026-0073 :Faille {code: 'FV-2026-0073', gravite: 'critique', publiee_le: date('2026-03-01')} ; la relation MAINTIENT {depuis: date('2026-07-19')} de nora-f vers rapporteur, et la relation TOUCHE de FV-2026-0073 vers rapporteur. Cinq règles numérotées : 1, une ligne devient un nœud et la table son label ; 2, la clé technique id disparaît, la clé métier (nom ou pseudo) identifie le nœud ; 3, une clé étrangère devient une relation (faille.paquet_id devient TOUCHE) ; 4, une table de jointure devient une relation et ses autres colonnes des propriétés de la relation (maintenance devient MAINTIENT {depuis}) ; 5, une date stockée en texte devient une vraie date.</title>
