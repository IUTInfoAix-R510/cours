<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 366" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Traduire un schéma relationnel en graphe, avec quatre vraies lignes des données du TP. À gauche, les tables : developpeur(id, pseudo, ville) avec la ligne (8, 'nora-f', 'Marseille') ; maintenance(developpeur_id, paquet_id, depuis) avec (8, 12, '2026-07-19') ; paquet(id, nom, …) avec (12, 'rapporteur', …) ; faille(code, gravite, publiee_le, paquet_id) avec ('FV-2026-0073', 'critique', '2026-03-01', 12). À droite, le graphe obtenu : le nœud :Developpeur {pseudo: 'nora-f', ville: 'Marseille'} ; le nœud :Paquet {nom: 'rapporteur', …}, ses autres colonnes étant laissées à l'exercice 1 ; le nœud :Faille {code: 'FV-2026-0073', gravite: 'critique', publiee_le: date('2026-03-01')} ; la relation MAINTIENT {depuis: date('2026-07-19')} du développeur vers le paquet, et la relation TOUCHE de la faille vers le paquet. Des pastilles renvoient aux cinq règles : 1, une ligne devient un nœud et la table son label ; 2, la clé technique id disparaît ; 3, la clé étrangère faille.paquet_id devient TOUCHE ; 4, la table de jointure maintenance devient MAINTIENT, et sa colonne depuis une propriété ; 5, une date en texte devient une date.</title>
  <defs><marker id="fl-bleu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/></marker><marker id="fl-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6400"/></marker><marker id="fl-vert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00684a"/></marker><marker id="fl-rouge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="fl-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker><marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="fl-noir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="0" y="6" width="525" height="78" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="10" y="35" font-size="18" font-weight="bold" font-family="monospace" fill="#333">developpeur(id, pseudo, ville)</text>
  <text x="10" y="67" font-size="18" font-family="monospace" fill="#555">(8, 'nora-f', 'Marseille')</text>
  <rect x="0" y="96" width="525" height="78" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="10" y="125" font-size="18" font-weight="bold" font-family="monospace" fill="#333">maintenance(developpeur_id, paquet_id, depuis)</text>
  <text x="10" y="157" font-size="18" font-family="monospace" fill="#555">(8, 12, '2026-07-19')</text>
  <rect x="0" y="186" width="525" height="78" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="10" y="215" font-size="18" font-weight="bold" font-family="monospace" fill="#333">paquet(id, nom, …)</text>
  <text x="10" y="247" font-size="18" font-family="monospace" fill="#555">(12, 'rapporteur', …)</text>
  <rect x="0" y="276" width="525" height="78" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="10" y="305" font-size="18" font-weight="bold" font-family="monospace" fill="#333">faille(code, gravite, publiee_le, paquet_id)</text>
  <text x="10" y="337" font-size="18" font-family="monospace" fill="#555">('FV-2026-0073', 'critique', '2026-03-01', 12)</text>
  <rect x="600" y="8" width="345" height="74" rx="14" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="612" y="36" font-size="18" font-weight="bold" fill="#2f6db0">:Developpeur</text>
  <text x="612" y="66" font-size="18" font-family="monospace" fill="#333">{pseudo: 'nora-f', ville: …}</text>
  <rect x="800" y="150" width="358" height="70" rx="14" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="812" y="178" font-size="18" font-weight="bold" fill="#00684a">:Paquet</text>
  <text x="812" y="206" font-size="18" font-family="monospace" fill="#333">{nom: 'rapporteur', …}</text>
  <rect x="600" y="268" width="400" height="94" rx="14" fill="#fdeeee" stroke="#c0392b" stroke-width="2.5"/>
  <text x="612" y="294" font-size="18" font-weight="bold" fill="#c0392b">:Faille</text>
  <text x="612" y="322" font-size="18" font-family="monospace" fill="#333">{code: 'FV-2026-0073', …,</text>
  <text x="612" y="348" font-size="18" font-family="monospace" fill="#333"> publiee_le: date('2026-03-01')}</text>
  <line x1="800" y1="84" x2="905" y2="144" stroke="#555" stroke-width="3" marker-end="url(#fl-noir)"/>
  <text x="606" y="116" font-size="18" font-weight="bold" font-family="monospace" fill="#333">MAINTIENT</text>
  <text x="606" y="140" font-size="18" font-family="monospace" fill="#555">{depuis: date(…)}</text>
  <line x1="870" y1="266" x2="950" y2="226" stroke="#555" stroke-width="3" marker-end="url(#fl-noir)"/>
  <text x="985" y="262" font-size="18" font-weight="bold" font-family="monospace" fill="#333">TOUCHE</text>
