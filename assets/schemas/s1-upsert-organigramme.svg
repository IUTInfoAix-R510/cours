<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Upsert : si aucun document ne correspond au filtre, un document est inséré avec les champs du filtre, du $set et du $setOnInsert ; sinon le document trouvé est mis à jour, $set s'applique et $setOnInsert est ignoré</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- question -->
  <polygon points="150,12 292,145 150,278 8,145" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <g font-size="20" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="150" y="110">Un document</text>
    <text x="150" y="135">correspond</text>
    <text x="150" y="160">au filtre ?</text>
  </g>
  <text x="150" y="192" font-family="monospace" font-size="17" fill="#555" text-anchor="middle">{ _id: "C42" }</text>

  <!-- branches -->
  <g stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#fl)">
    <path d="M222,78 L337,68"/>
    <path d="M222,212 L337,220"/>
  </g>
  <text x="262" y="62" font-size="20" font-weight="bold" fill="#13aa52">non</text>
  <text x="262" y="244" font-size="20" font-weight="bold" fill="#4a90d9">oui</text>

  <!-- non : insertion -->
  <rect x="340" y="8" width="532" height="120" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="356" y="36" font-size="19" font-weight="bold" fill="#333">insertion d'un nouveau document</text>
  <g font-family="monospace" font-size="17" fill="#333">
    <rect x="356" y="50" width="118" height="32" rx="6" fill="#f0f4f8" stroke="#4a90d9" stroke-width="2"/>
    <text x="364" y="72">_id: "C42"</text>
    <rect x="500" y="50" width="190" height="32" rx="6" fill="#ffffff" stroke="#13aa52" stroke-width="2"/>
    <text x="508" y="72">temperature: 21.5</text>
    <rect x="716" y="50" width="140" height="32" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="724" y="72">$setOnInsert</text>
  </g>
  <g font-size="22" font-weight="bold" fill="#555" text-anchor="middle">
    <text x="487" y="73">+</text>
    <text x="703" y="73">+</text>
  </g>
  <g font-size="17" fill="#555" text-anchor="middle">
    <text x="415" y="108">du filtre</text>
    <text x="595" y="108">du <tspan font-family="monospace">$set</tspan></text>
    <text x="786" y="108">s'il y en a</text>
  </g>

  <!-- oui : mise à jour -->
  <rect x="340" y="160" width="532" height="120" rx="10" fill="#f0f4f8" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="356" y="189" font-size="19" font-weight="bold" fill="#333">mise à jour du document trouvé</text>
  <text x="356" y="225" font-size="18" fill="#333"><tspan font-family="monospace" font-weight="bold">$set</tspan> : écrase <tspan font-family="monospace">temperature</tspan></text>
  <text x="356" y="259" font-size="18" fill="#333"><tspan font-family="monospace" font-weight="bold">$setOnInsert</tspan> : ignoré</text>

  <!-- résultats -->
  <g stroke="#555" stroke-width="2.5" marker-end="url(#fl)">
    <line x1="874" y1="68" x2="896" y2="68"/>
    <line x1="874" y1="220" x2="896" y2="220"/>
  </g>
  <text x="902" y="40" font-size="18" font-weight="bold" fill="#00684a">1re exécution</text>
  <g font-family="monospace" font-size="17" fill="#333">
    <text x="902" y="72">upsertedCount: 1</text>
    <text x="902" y="98">insertedId: 'C42'</text>
  </g>
  <text x="902" y="192" font-size="18" font-weight="bold" fill="#00684a">2e exécution</text>
  <g font-family="monospace" font-size="17" fill="#333">
    <text x="902" y="224">matchedCount: 1</text>
    <text x="902" y="250">modifiedCount: 0</text>
  </g>
  <text x="902" y="276" font-size="17" fill="#555">21.5 y était déjà</text>
</svg>
