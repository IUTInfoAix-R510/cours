<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 348" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Quatre étapes reçoivent les mêmes 4 films (titre, annee, duree, notes) : $project garde seulement les champs cités, titre et annee (4 documents en entrée, 4 en sortie, comme SELECT) ; $addFields garde tout et ajoute nb_notes (4 → 4, comme SELECT *, …) ; $group par annee donne un document par année, 1995, 2000 et 2001 (4 → 3, comme GROUP BY) ; $setWindowFields garde chaque film et ajoute son rang dans son année par durée décroissante, La Haine 1, Glaneurs 1, Chihiro 1, Amélie 2 (4 → 4, comme RANK() OVER (PARTITION BY …))</title>
  <text x="580" y="22" font-size="17" fill="#555" text-anchor="middle">Les quatre étapes reçoivent les mêmes 4 films <tspan font-family="monospace">{ titre, annee, duree, notes }</tspan> ; la couleur indique l'année.</text>
  <rect x="2" y="34" width="278" height="310" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="16" y="62" font-family="monospace" font-size="19" font-weight="bold" fill="#00684a">$project</text>
  <text x="266" y="62" font-size="17" font-weight="bold" fill="#333" text-anchor="end">4 → 4</text>
  <text x="16" y="86" font-size="16" fill="#555">garde seulement les champs</text>
  <text x="16" y="106" font-size="16" fill="#555">cités : titre et annee</text>
  <rect x="14" y="118" width="254" height="44" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="26" y="137" font-size="16" font-weight="bold" fill="#333">Chihiro</text>
  <text x="26" y="156" font-family="monospace" font-size="16" fill="#333">annee: 2001</text>
  <rect x="14" y="166" width="254" height="44" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="26" y="185" font-size="16" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="26" y="204" font-family="monospace" font-size="16" fill="#333">annee: 2000</text>
  <rect x="14" y="214" width="254" height="44" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="26" y="233" font-size="16" font-weight="bold" fill="#333">La Haine</text>
  <text x="26" y="252" font-family="monospace" font-size="16" fill="#333">annee: 1995</text>
  <rect x="14" y="262" width="254" height="44" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="26" y="281" font-size="16" font-weight="bold" fill="#333">Amélie</text>
  <text x="26" y="300" font-family="monospace" font-size="16" fill="#333">annee: 2001</text>
  <line x1="2" y1="310" x2="280" y2="310" stroke="#13aa52" stroke-width="1.5"/>
  <text x="141" y="332" font-family="monospace" font-size="15" fill="#777" text-anchor="middle">SELECT titre, annee</text>
  <rect x="294" y="34" width="278" height="310" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="308" y="62" font-family="monospace" font-size="19" font-weight="bold" fill="#00684a">$addFields</text>
  <text x="558" y="62" font-size="17" font-weight="bold" fill="#333" text-anchor="end">4 → 4</text>
  <text x="308" y="86" font-size="16" fill="#555">garde tout et ajoute</text>
  <text x="308" y="106" font-size="16" fill="#555">nb_notes : taille de notes</text>
  <rect x="306" y="118" width="254" height="44" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="318" y="137" font-size="16" font-weight="bold" fill="#333">Chihiro</text>
  <text x="548" y="137" font-family="monospace" font-size="16" fill="#555" text-anchor="end">2001 · 125</text>
  <text x="318" y="156" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">nb_notes: 2</text>
  <rect x="306" y="166" width="254" height="44" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="318" y="185" font-size="16" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="548" y="185" font-family="monospace" font-size="16" fill="#555" text-anchor="end">2000 · 82</text>
  <text x="318" y="204" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">nb_notes: 1</text>
  <rect x="306" y="214" width="254" height="44" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="318" y="233" font-size="16" font-weight="bold" fill="#333">La Haine</text>
  <text x="548" y="233" font-family="monospace" font-size="16" fill="#555" text-anchor="end">1995 · 98</text>
  <text x="318" y="252" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">nb_notes: 2</text>
  <rect x="306" y="262" width="254" height="44" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="318" y="281" font-size="16" font-weight="bold" fill="#333">Amélie</text>
  <text x="548" y="281" font-family="monospace" font-size="16" fill="#555" text-anchor="end">2001 · 122</text>
  <text x="318" y="300" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">nb_notes: 0</text>
  <line x1="294" y1="310" x2="572" y2="310" stroke="#13aa52" stroke-width="1.5"/>
  <text x="433" y="332" font-family="monospace" font-size="15" fill="#777" text-anchor="middle">SELECT *, …</text>
  <rect x="586" y="34" width="278" height="310" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="600" y="62" font-family="monospace" font-size="19" font-weight="bold" fill="#00684a">$group</text>
  <text x="850" y="62" font-size="17" font-weight="bold" fill="#333" text-anchor="end">4 → 3</text>
  <text x="600" y="86" font-size="16" fill="#555">un document par année :</text>
  <text x="600" y="106" font-size="16" fill="#555">les films disparaissent</text>
  <rect x="598" y="118" width="254" height="44" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="610" y="137" font-family="monospace" font-size="16" font-weight="bold" fill="#333">_id: 1995</text>
  <text x="610" y="156" font-family="monospace" font-size="16" fill="#333">nb: 1</text>
  <rect x="598" y="166" width="254" height="44" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="610" y="185" font-family="monospace" font-size="16" font-weight="bold" fill="#333">_id: 2000</text>
  <text x="610" y="204" font-family="monospace" font-size="16" fill="#333">nb: 1</text>
  <rect x="598" y="214" width="254" height="44" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="610" y="233" font-family="monospace" font-size="16" font-weight="bold" fill="#333">_id: 2001</text>
  <text x="610" y="252" font-family="monospace" font-size="16" fill="#333">nb: 2</text>
  <line x1="586" y1="310" x2="864" y2="310" stroke="#13aa52" stroke-width="1.5"/>
  <text x="725" y="332" font-family="monospace" font-size="15" fill="#777" text-anchor="middle">GROUP BY annee</text>
  <rect x="878" y="34" width="278" height="310" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="892" y="62" font-family="monospace" font-size="19" font-weight="bold" fill="#00684a">$setWindowFields</text>
  <text x="1142" y="62" font-size="17" font-weight="bold" fill="#333" text-anchor="end">4 → 4</text>
  <text x="892" y="86" font-size="16" fill="#555">garde chaque film, ajoute rang</text>
  <text x="892" y="106" font-size="16" fill="#555">par année, durée décroissante</text>
  <rect x="890" y="118" width="254" height="44" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="902" y="137" font-size="16" font-weight="bold" fill="#333">La Haine</text>
  <text x="1132" y="137" font-family="monospace" font-size="16" fill="#555" text-anchor="end">1995 · 98</text>
  <text x="902" y="156" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">rang: 1</text>
  <rect x="890" y="166" width="254" height="44" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="902" y="185" font-size="16" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="1132" y="185" font-family="monospace" font-size="16" fill="#555" text-anchor="end">2000 · 82</text>
  <text x="902" y="204" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">rang: 1</text>
  <rect x="890" y="214" width="254" height="44" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="902" y="233" font-size="16" font-weight="bold" fill="#333">Chihiro</text>
  <text x="1132" y="233" font-family="monospace" font-size="16" fill="#555" text-anchor="end">2001 · 125</text>
  <text x="902" y="252" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">rang: 1</text>
  <rect x="890" y="262" width="254" height="44" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="902" y="281" font-size="16" font-weight="bold" fill="#333">Amélie</text>
  <text x="1132" y="281" font-family="monospace" font-size="16" fill="#555" text-anchor="end">2001 · 122</text>
  <text x="902" y="300" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">rang: 2</text>
  <line x1="878" y1="310" x2="1156" y2="310" stroke="#13aa52" stroke-width="1.5"/>
  <text x="1017" y="332" font-family="monospace" font-size="15" fill="#777" text-anchor="middle">RANK() OVER (PARTITION BY …)</text>
</svg>
