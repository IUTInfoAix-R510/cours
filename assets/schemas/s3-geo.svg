<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux opérateurs, deux questions inverses. À gauche, $geoWithin répond à « quels points sont dans la zone ? » : { position: { $geoWithin: { $geometry: centre } } } sur la collection lieux ; la zone Centre est donnée dans la requête, la position est lue dans chaque document. La Mairie est dedans, retenue ; la Gare et l'IUT sont dehors, écartés ; résultat [ { nom: 'Mairie' } ]. À droite, $geoIntersects répond à « quelles zones touchent le point ? » : { contour: { $geoIntersects: { $geometry: point } } } sur la collection zones ; le point est donné dans la requête, le contour est lu dans chaque document. Point de la Mairie : [ { nom: 'Centre' } ] ; point de la Gare : []. En bleu, le champ lu dans chaque document ; en ambre, la forme donnée dans $geometry.</title>

  <!-- $geoWithin -->
  <rect x="2" y="2" width="566" height="268" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="16" y="30" font-size="19" font-weight="bold" fill="#333"><tspan font-family="monospace" fill="#00684a">$geoWithin</tspan> : quels points sont <tspan fill="#2f6db0">dans</tspan> la zone ?</text>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="16" y="60">lieux.find({ <tspan font-weight="bold" fill="#2f6db0">position</tspan>:</text>
    <text x="36" y="84">{ $geoWithin: { $geometry: <tspan font-weight="bold" fill="#b06f00">centre</tspan> } } })</text>
  </g>
  <rect x="26" y="106" width="200" height="76" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="36" y="128" font-size="18" font-weight="bold" fill="#b06f00">Centre</text>
  <circle cx="130" cy="156" r="8" fill="#4a90d9" stroke="#2f6db0" stroke-width="2"/>
  <text x="144" y="162" font-size="18" fill="#333">Mairie</text>
  <circle cx="110" cy="200" r="8" fill="#4a90d9" stroke="#2f6db0" stroke-width="2"/>
  <text x="124" y="206" font-size="18" fill="#333">Gare</text>
  <circle cx="40" cy="240" r="8" fill="#4a90d9" stroke="#2f6db0" stroke-width="2"/>
  <text x="54" y="246" font-size="18" fill="#333">IUT</text>
  <g font-size="18">
    <text x="270" y="136" fill="#333">Mairie : <tspan font-weight="bold" fill="#00684a">dedans, retenue</tspan></text>
    <text x="270" y="166" fill="#333">Gare : <tspan fill="#c0392b">dehors</tspan></text>
    <text x="270" y="196" fill="#333">IUT : <tspan fill="#c0392b">dehors</tspan></text>
  </g>
  <text x="270" y="244" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">[ { nom: 'Mairie' } ]</text>

  <!-- $geoIntersects -->
  <rect x="592" y="2" width="566" height="268" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="606" y="30" font-size="19" font-weight="bold" fill="#333"><tspan font-family="monospace" fill="#00684a">$geoIntersects</tspan> : quelles zones <tspan fill="#2f6db0">touchent</tspan> le point ?</text>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="606" y="60">zones.find({ <tspan font-weight="bold" fill="#2f6db0">contour</tspan>:</text>
    <text x="626" y="84">{ $geoIntersects: { $geometry: <tspan font-weight="bold" fill="#b06f00">point</tspan> } } })</text>
  </g>
  <rect x="616" y="106" width="200" height="76" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="626" y="128" font-size="18" font-weight="bold" fill="#2f6db0">Centre</text>
  <circle cx="720" cy="156" r="8" fill="#e8a838" stroke="#b06f00" stroke-width="2"/>
  <text x="734" y="162" font-size="18" fill="#333">Mairie</text>
  <circle cx="700" cy="200" r="8" fill="#e8a838" stroke="#b06f00" stroke-width="2"/>
  <text x="714" y="206" font-size="18" fill="#333">Gare</text>
  <g font-size="18" fill="#333">
    <text x="860" y="136"><tspan fill="#b06f00" font-weight="bold">point</tspan> de la Mairie :</text>
    <text x="880" y="162" font-family="monospace" font-weight="bold" fill="#00684a">[ { nom: 'Centre' } ]</text>
    <text x="860" y="206"><tspan fill="#b06f00" font-weight="bold">point</tspan> de la Gare :</text>
    <text x="880" y="232" font-family="monospace" font-weight="bold" fill="#c0392b">[]</text>
  </g>

  <!-- légende -->
  <g font-size="18" fill="#555">
    <rect x="16" y="278" width="18" height="18" rx="3" fill="#e3eefa" stroke="#2f6db0" stroke-width="2"/>
    <text x="42" y="294">le champ, lu dans chaque document</text>
    <rect x="606" y="278" width="18" height="18" rx="3" fill="#fdf3e0" stroke="#b06f00" stroke-width="2"/>
    <text x="632" y="294">la forme écrite dans <tspan font-family="monospace">$geometry</tspan></text>
  </g>
</svg>
