<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 326" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Carte schématique avec la longitude en abscisse et la latitude en ordonnée : le polygone Centre contient la Mairie, tandis que la Gare, juste en dessous, et l'IUT, plus bas, sont dehors ; $geoWithin renvoie les points situés dans la zone, ici la Mairie, et $geoIntersects renvoie les zones qui touchent le point de la Mairie, ici Centre ; les coordonnées s'écrivent [longitude, latitude], la longitude d'abord</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="90" y1="280" x2="520" y2="280" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <line x1="90" y1="280" x2="90" y2="30" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="104" y="30" font-size="17" fill="#555">latitude</text>
  <text x="520" y="320" font-size="17" fill="#555" text-anchor="end">longitude</text>
  <g stroke="#555" stroke-width="2">
    <line x1="170" y1="280" x2="170" y2="287"/>
    <line x1="250" y1="280" x2="250" y2="287"/>
    <line x1="330" y1="280" x2="330" y2="287"/>
    <line x1="410" y1="280" x2="410" y2="287"/>
    <line x1="83" y1="240" x2="90" y2="240"/>
    <line x1="83" y1="160" x2="90" y2="160"/>
    <line x1="83" y1="80" x2="90" y2="80"/>
  </g>
  <g font-family="monospace" font-size="15" fill="#555">
    <text x="170" y="303" text-anchor="middle">5.440</text>
    <text x="250" y="303" text-anchor="middle">5.445</text>
    <text x="330" y="303" text-anchor="middle">5.450</text>
    <text x="410" y="303" text-anchor="middle">5.455</text>
    <text x="78" y="245" text-anchor="end">43.515</text>
    <text x="78" y="165" text-anchor="end">43.525</text>
    <text x="78" y="85" text-anchor="end">43.535</text>
  </g>
  <line x1="90" y1="160" x2="170" y2="160" stroke="#b8c4cf" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="90" y1="80" x2="170" y2="80" stroke="#b8c4cf" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- zone Centre -->
  <rect x="170" y="80" width="240" height="80" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="180" y="102" font-size="18" font-weight="bold" fill="#b06f00">Centre</text>
  <text x="400" y="102" font-family="monospace" font-size="15" fill="#b06f00" text-anchor="end">"Polygon"</text>

  <!-- lieux -->
  <circle cx="288" cy="122" r="7" fill="#13aa52" stroke="#00684a" stroke-width="2"/>
  <text x="300" y="128" font-size="17" font-weight="bold" fill="#00684a">Mairie</text>
  <circle cx="263" cy="171" r="7" fill="#fdeeee" stroke="#c0392b" stroke-width="2.2"/>
  <text x="276" y="177" font-size="17" fill="#555">Gare</text>
  <circle cx="172" cy="247" r="7" fill="#fdeeee" stroke="#c0392b" stroke-width="2.2"/>
  <text x="185" y="253" font-size="17" fill="#555">IUT</text>

  <!-- $geoWithin -->
  <rect x="590" y="30" width="568" height="100" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="606" y="58" font-family="monospace" font-size="19" font-weight="bold" fill="#00684a">$geoWithin</text>
  <text x="606" y="86" font-size="17" fill="#333">les points <tspan font-weight="bold">DANS</tspan> la zone Centre</text>
  <text x="606" y="116" font-family="monospace" font-size="17" fill="#333">→ [ { nom: "Mairie" } ]</text>

  <!-- $geoIntersects -->
  <rect x="590" y="146" width="568" height="100" rx="10" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="606" y="174" font-family="monospace" font-size="19" font-weight="bold" fill="#b06f00">$geoIntersects</text>
  <text x="606" y="202" font-size="17" fill="#333">les zones qui <tspan font-weight="bold">TOUCHENT</tspan> le point de la Mairie</text>
  <text x="606" y="232" font-family="monospace" font-size="17" fill="#333">→ [ { nom: "Centre" } ]</text>

  <!-- rappel -->
  <rect x="590" y="262" width="568" height="42" rx="7" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="606" y="289" font-size="17" font-weight="bold" fill="#333"><tspan font-family="monospace">coordinates: [longitude, latitude]</tspan>, la longitude d'abord</text>
</svg>
