<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 304" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux opérateurs, deux questions inverses, sur les lieux inventés d'Aix-en-Provence. À gauche, $geoWithin répond à « quels points sont dans la zone ? » : le filtre { position: { $geoWithin: { $geometry: centre } } } porte sur la collection lieux ; la zone Centre est donnée dans la requête, la position est lue dans chaque document. La Mairie est dedans, elle est retenue ; la Gare, juste au sud, et l'IUT, plus bas, sont dehors, ils sont écartés ; résultat [ { nom: "Mairie" } ]. À droite, $geoIntersects répond à « quelles zones touchent le point ? » : le filtre { contour: { $geoIntersects: { $geometry: point } } } porte sur la collection zones ; le point est donné dans la requête, le contour est lu dans chaque document. Avec le point de la Mairie, la zone Centre le touche : [ { nom: "Centre" } ] ; avec le point de la Gare, aucune zone : []. En bleu, le champ lu dans chaque document ; en ambre, la forme donnée dans $geometry.</title>

  <!-- ===== $geoWithin ===== -->
  <rect x="2" y="2" width="572" height="268" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="18" y="30" font-size="19" font-weight="bold" fill="#333"><tspan font-family="monospace" fill="#00684a">$geoWithin</tspan> : quels points sont <tspan fill="#00684a">DANS</tspan> la zone ?</text>
  <text x="18" y="58" font-family="monospace" font-size="16" fill="#333">{ <tspan fill="#4a90d9" font-weight="bold">position</tspan>: { <tspan fill="#00684a" font-weight="bold">$geoWithin</tspan>: { $geometry: <tspan fill="#b06f00" font-weight="bold">centre</tspan> } } }</text>
  <text x="18" y="82" font-size="14" fill="#555">sur la collection <tspan font-family="monospace">lieux</tspan> ; <tspan fill="#b06f00" font-weight="bold">centre</tspan> : le contour de la zone Centre</text>

  <!-- carte -->
  <rect x="60" y="100" width="200" height="60" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="68" y="119" font-size="15" font-weight="bold" fill="#b06f00">Centre</text>
  <circle cx="159" cy="132" r="7" fill="#4a90d9" stroke="#1f5f9e" stroke-width="2"/>
  <text x="171" y="137" font-size="15" font-weight="bold" fill="#333">Mairie</text>
  <circle cx="137" cy="168" r="7" fill="#4a90d9" stroke="#1f5f9e" stroke-width="2"/>
  <text x="149" y="181" font-size="15" font-weight="bold" fill="#333">Gare</text>
  <circle cx="61" cy="225" r="7" fill="#4a90d9" stroke="#1f5f9e" stroke-width="2"/>
  <text x="73" y="231" font-size="15" font-weight="bold" fill="#333">IUT</text>

  <!-- verdicts -->
  <line x1="290" y1="100" x2="290" y2="256" stroke="#b8c4cf" stroke-width="1.5"/>
  <g font-size="16">
    <circle cx="314" cy="117" r="6" fill="#4a90d9"/>
    <text x="328" y="123" font-weight="bold" fill="#333">Mairie</text>
    <text x="420" y="123" font-weight="bold" fill="#00684a">dedans : retenu</text>
    <circle cx="314" cy="151" r="6" fill="#4a90d9"/>
    <text x="328" y="157" font-weight="bold" fill="#333">Gare</text>
    <text x="420" y="157" fill="#c0392b">dehors : écarté</text>
    <circle cx="314" cy="185" r="6" fill="#4a90d9"/>
    <text x="328" y="191" font-weight="bold" fill="#333">IUT</text>
    <text x="420" y="191" fill="#c0392b">dehors : écarté</text>
  </g>
  <rect x="306" y="214" width="252" height="40" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="318" y="240" font-family="monospace" font-size="16" fill="#333">→ [ { nom: "Mairie" } ]</text>

  <!-- ===== $geoIntersects ===== -->
  <rect x="586" y="2" width="572" height="268" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="602" y="30" font-size="19" font-weight="bold" fill="#333"><tspan font-family="monospace" fill="#00684a">$geoIntersects</tspan> : quelles zones <tspan fill="#00684a">TOUCHENT</tspan> le point ?</text>
  <text x="602" y="58" font-family="monospace" font-size="16" fill="#333">{ <tspan fill="#4a90d9" font-weight="bold">contour</tspan>: { <tspan fill="#00684a" font-weight="bold">$geoIntersects</tspan>: { $geometry: <tspan fill="#b06f00" font-weight="bold">point</tspan> } } }</text>
  <text x="602" y="82" font-size="14" fill="#555">sur la collection <tspan font-family="monospace">zones</tspan> ; <tspan fill="#b06f00" font-weight="bold">point</tspan> : un point écrit dans la requête</text>

  <!-- carte -->
  <rect x="644" y="100" width="200" height="60" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="652" y="119" font-size="15" font-weight="bold" fill="#333">Centre</text>
  <circle cx="743" cy="132" r="7" fill="#e8a838" stroke="#b06f00" stroke-width="2"/>
  <text x="755" y="137" font-size="15" font-weight="bold" fill="#b06f00">Mairie</text>
  <circle cx="721" cy="168" r="7" fill="#e8a838" stroke="#b06f00" stroke-width="2"/>
  <text x="733" y="181" font-size="15" font-weight="bold" fill="#b06f00">Gare</text>

  <!-- verdicts -->
  <line x1="874" y1="100" x2="874" y2="256" stroke="#b8c4cf" stroke-width="1.5"/>
  <g font-size="16">
    <circle cx="898" cy="117" r="6" fill="#e8a838"/>
    <text x="912" y="123"><tspan font-weight="bold" fill="#333">requête 1 :</tspan> <tspan font-weight="bold" fill="#b06f00">point Mairie</tspan></text>
    <text x="898" y="152" font-family="monospace" fill="#333">→ [ { nom: "Centre" } ]</text>
    <circle cx="898" cy="193" r="6" fill="#e8a838"/>
    <text x="912" y="199"><tspan font-weight="bold" fill="#333">requête 2 :</tspan> <tspan font-weight="bold" fill="#b06f00">point Gare</tspan></text>
    <text x="898" y="228" font-family="monospace" fill="#333">→ []</text>
  </g>
  <text x="946" y="228" font-size="14" fill="#555">aucune zone ne le touche</text>

  <!-- légende -->
  <rect x="18" y="284" width="16" height="16" rx="3" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="42" y="298" font-size="15" fill="#555">le champ filtré, lu dans chaque document</text>
  <rect x="380" y="284" width="16" height="16" rx="3" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="404" y="298" font-size="15" fill="#555">la forme donnée dans <tspan font-family="monospace">$geometry</tspan>, la même pour tous les documents</text>
</svg>
