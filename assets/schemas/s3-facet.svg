<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Mécanisme de $facet sur les 4 films. Le $facet donne une copie des 4 films (La Haine, Les Glaneurs et la Glaneuse, Amélie Poulain, Le Voyage de Chihiro) à chacune de ses deux facettes. par_annee applique $group par année puis $sort ; plus_long applique $sort par durée décroissante, $limit 1, puis $project du titre. En sortie, un seul document, un champ par facette, chacun un tableau : par_annee vaut [ { _id: 1995, nb: 1 }, { _id: 2000, nb: 1 }, { _id: 2001, nb: 2 } ] et plus_long vaut [ { titre: 'Le Voyage de Chihiro' } ].</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- en-têtes -->
  <g font-size="18" fill="#555" text-anchor="middle">
    <text x="105" y="22">collection <tspan font-family="monospace">films</tspan></text>
    <text x="470" y="22">chaque facette reçoit <tspan font-weight="bold" fill="#333">les 4 films</tspan></text>
    <text x="945" y="22"><tspan font-weight="bold" fill="#333">un seul</tspan> document</text>
  </g>

  <!-- films -->
  <rect x="2" y="64" width="206" height="186" rx="10" fill="#f0f4f8" stroke="#8e44ad" stroke-width="2"/>
  <g font-size="18" fill="#333">
    <text x="14" y="102">La Haine</text>
    <text x="14" y="142">Les Glaneurs…</text>
    <text x="14" y="182">Amélie Poulain</text>
    <text x="14" y="222">Le Voyage de Chihiro</text>
  </g>

  <!-- $facet -->
  <rect x="246" y="40" width="458" height="246" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="260" y="66" font-family="monospace" font-size="20" font-weight="bold" fill="#00684a">$facet</text>
  <path d="M208,157 H226 V122 H252" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <path d="M226,157 V228 H252" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <g font-family="monospace" font-size="18">
    <!-- par_annee -->
    <rect x="260" y="80" width="430" height="88" rx="8" fill="#fff" stroke="#b8c4cf" stroke-width="2"/>
    <text x="272" y="106" font-weight="bold" fill="#00684a">par_annee</text>
    <rect x="272" y="120" width="190" height="36" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.8"/>
    <text x="367" y="144" text-anchor="middle" fill="#333">$group année</text>
    <line x1="466" y1="138" x2="484" y2="138" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
    <rect x="490" y="120" width="88" height="36" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.8"/>
    <text x="534" y="144" text-anchor="middle" fill="#333">$sort</text>

    <!-- plus_long -->
    <rect x="260" y="186" width="430" height="88" rx="8" fill="#fff" stroke="#b8c4cf" stroke-width="2"/>
    <text x="272" y="212" font-weight="bold" fill="#00684a">plus_long</text>
    <rect x="272" y="226" width="122" height="36" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.8"/>
    <text x="333" y="250" text-anchor="middle" fill="#333">$sort ↓</text>
    <line x1="398" y1="244" x2="414" y2="244" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
    <rect x="420" y="226" width="110" height="36" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.8"/>
    <text x="475" y="250" text-anchor="middle" fill="#333">$limit 1</text>
    <line x1="534" y1="244" x2="550" y2="244" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
    <rect x="556" y="226" width="118" height="36" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.8"/>
    <text x="615" y="250" text-anchor="middle" fill="#333">$project</text>
  </g>

  <!-- sortie -->
  <line x1="704" y1="163" x2="726" y2="163" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="734" y="40" width="424" height="246" rx="10" fill="#fff" stroke="#4a90d9" stroke-width="2.5"/>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="746" y="74">{ <tspan font-weight="bold" fill="#00684a">par_annee</tspan>: [</text>
    <text x="766" y="104">{ _id: 1995, nb: 1 },</text>
    <text x="766" y="134">{ _id: 2000, nb: 1 },</text>
    <text x="766" y="164">{ _id: 2001, nb: 2 } ],</text>
    <text x="756" y="202"><tspan font-weight="bold" fill="#00684a">plus_long</tspan>: [</text>
    <text x="766" y="232">{ titre: 'Le Voyage de</text>
    <text x="766" y="262">  Chihiro' } ] }</text>
  </g>
</svg>
