<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Suivre un lien, en relationnel et dans un graphe. À gauche, en relationnel : la table suit(source, cible) avec les lignes (1, 2), (1, 3), (2, 4), (3, 4), (4, 5), (5, 6), et la table personne(id, nom) avec 1 Ana, 2 Bilal, 3 Camille, 4 Dario, 5 Elif, 6 Farah, chacune avec son index en arbre B. Étape 1 : chercher Ana (1) dans l'index de suit, qui donne les lignes (1, 2) et (1, 3), Ana vers Bilal et Ana vers Camille. Étape 2 : chercher 2 (Bilal) puis 3 (Camille) dans l'index de personne. Chaque saut repasse par un index. À droite, dans un graphe : le nœud Ana a deux relations SUIT qui pointent directement vers Bilal et Camille ; un index ne sert qu'à trouver Ana, le départ. Un saut = suivre une relation.</title>
