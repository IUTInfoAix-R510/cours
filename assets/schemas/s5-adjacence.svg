<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 372" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Suivre un lien, en relationnel et dans un graphe. À gauche, en relationnel : la table suit(source, cible), avec les lignes (Ana, Bilal), (Ana, Camille), (Bilal, Dario), (Camille, Dario), (Dario, Elif), (Elif, Farah), et un index en arbre B sur la colonne source. Saut 1 : chercher Ana dans l'index, qui donne les lignes (Ana, Bilal) et (Ana, Camille). Saut 2 : chercher Bilal, puis Camille, dans le même index. Chaque saut repasse par l'index : c'est une jointure. À droite, dans un graphe : le nœud Ana garde ses deux relations SUIT, qui pointent directement vers Bilal et Camille, qui pointent vers Dario ; l'index ne sert qu'à trouver Ana, le départ. Un saut, c'est suivre une relation.</title>
  <defs><marker id="fl-bleu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/></marker><marker id="fl-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6400"/></marker><marker id="fl-vert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00684a"/></marker><marker id="fl-rouge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="fl-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker><marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="fl-noir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="0" y="0" width="640" height="370" rx="8" fill="#f7fafd" stroke="#b8c4cf" stroke-width="2"/>
  <text x="16" y="30" font-size="20" font-weight="bold" fill="#333">En relationnel : chaque saut est une jointure</text>
  <rect x="16" y="60" width="170" height="160" rx="10" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="101" y="86" font-size="18" fill="#8e44ad" text-anchor="middle">index sur</text>
  <text x="101" y="108" font-size="18" font-weight="bold" font-family="monospace" fill="#8e44ad" text-anchor="middle">suit.source</text>
  <rect x="76" y="122" width="50" height="26" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <rect x="30" y="178" width="40" height="26" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <line x1="101" y1="148" x2="50" y2="178" stroke="#9aa5b1" stroke-width="2"/>
  <rect x="82" y="178" width="40" height="26" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <line x1="101" y1="148" x2="102" y2="178" stroke="#9aa5b1" stroke-width="2"/>
  <rect x="134" y="178" width="40" height="26" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <line x1="101" y1="148" x2="154" y2="178" stroke="#9aa5b1" stroke-width="2"/>
  <text x="250" y="74" font-size="19" font-weight="bold" font-family="monospace" fill="#333">suit(source, cible)</text>
  <rect x="250" y="86" width="250" height="28" rx="4" fill="#e3eefa" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="262" y="107" font-size="18" font-family="monospace" fill="#333">'Ana'</text>
  <text x="380" y="107" font-size="18" font-family="monospace" fill="#333">'Bilal'</text>
  <text x="512" y="107" font-size="18" font-weight="bold" fill="#4a90d9">saut 1</text>
  <rect x="250" y="118" width="250" height="28" rx="4" fill="#e3eefa" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="262" y="139" font-size="18" font-family="monospace" fill="#333">'Ana'</text>
  <text x="380" y="139" font-size="18" font-family="monospace" fill="#333">'Camille'</text>
  <text x="512" y="139" font-size="18" font-weight="bold" fill="#4a90d9">saut 1</text>
  <rect x="250" y="150" width="250" height="28" rx="4" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="262" y="171" font-size="18" font-family="monospace" fill="#333">'Bilal'</text>
  <text x="380" y="171" font-size="18" font-family="monospace" fill="#333">'Dario'</text>
  <text x="512" y="171" font-size="18" font-weight="bold" fill="#8e44ad">saut 2</text>
  <rect x="250" y="182" width="250" height="28" rx="4" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="262" y="203" font-size="18" font-family="monospace" fill="#333">'Camille'</text>
  <text x="380" y="203" font-size="18" font-family="monospace" fill="#333">'Dario'</text>
  <text x="512" y="203" font-size="18" font-weight="bold" fill="#8e44ad">saut 2</text>
  <rect x="250" y="214" width="250" height="28" rx="4" fill="#ffffff" stroke="#b8c4cf" stroke-width="1.5"/>
  <text x="262" y="235" font-size="18" font-family="monospace" fill="#333">'Dario'</text>
  <text x="380" y="235" font-size="18" font-family="monospace" fill="#333">'Elif'</text>
  <rect x="250" y="246" width="250" height="28" rx="4" fill="#ffffff" stroke="#b8c4cf" stroke-width="1.5"/>
  <text x="262" y="267" font-size="18" font-family="monospace" fill="#333">'Elif'</text>
  <text x="380" y="267" font-size="18" font-family="monospace" fill="#333">'Farah'</text>
  <line x1="188" y1="135" x2="244" y2="112" stroke="#2f6db0" stroke-width="2.5" marker-end="url(#fl-bleu)"/>
  <line x1="188" y1="190" x2="244" y2="176" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#fl-violet)"/>
  <text x="16" y="304" font-size="18" font-weight="bold" fill="#2f6db0">Saut 1 : chercher 'Ana' dans l'index.</text>
  <text x="16" y="330" font-size="18" font-weight="bold" fill="#8e44ad">Saut 2 : chercher 'Bilal', puis 'Camille'.</text>
  <text x="16" y="356" font-size="18" fill="#555">Chaque saut repaie une recherche dans l'index.</text>
  <rect x="660" y="0" width="500" height="370" rx="8" fill="#fffaf2" stroke="#b8c4cf" stroke-width="2"/>
  <text x="676" y="30" font-size="20" font-weight="bold" fill="#333">Dans un graphe : suivre une relation</text>
  <rect x="685" y="147" width="110" height="46" rx="23.0" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="740" y="176.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Ana</text>
  <rect x="855" y="82" width="110" height="46" rx="23.0" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="910" y="111.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Bilal</text>
  <rect x="855" y="212" width="110" height="46" rx="23.0" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="910" y="241.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Camille</text>
  <rect x="1020" y="147" width="110" height="46" rx="23.0" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="1075" y="176.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Dario</text>
  <line x1="799" y1="147.441" x2="848" y2="128.706" stroke="#2f6db0" stroke-width="3" marker-end="url(#fl-bleu)"/>
  <line x1="799" y1="192.559" x2="848" y2="211.294" stroke="#2f6db0" stroke-width="3" marker-end="url(#fl-bleu)"/>
  <line x1="969" y1="128.242" x2="1013" y2="145.576" stroke="#2f6db0" stroke-width="3" marker-end="url(#fl-bleu)"/>
  <line x1="969" y1="211.758" x2="1013" y2="194.424" stroke="#2f6db0" stroke-width="3" marker-end="url(#fl-bleu)"/>
  <rect x="680" y="60" width="120" height="34" rx="6" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="740" y="83" font-size="18" font-weight="bold" fill="#8e44ad" text-anchor="middle">index : Ana</text>
  <line x1="740" y1="94" x2="740" y2="140" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#fl-violet)"/>
  <text x="676" y="330" font-size="18" fill="#555">L'index ne sert qu'au départ ;</text>
  <text x="676" y="356" font-size="18" fill="#555">chaque nœud garde ses relations.</text>
</svg>
