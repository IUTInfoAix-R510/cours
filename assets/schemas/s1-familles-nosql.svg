<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="sans-serif">
  <title>Six familles NoSQL</title>
  <defs>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- ===== 1. Clé-valeur ===== -->
  <g transform="translate(0,0)">
    <rect width="350" height="230" rx="12" fill="#f0f4f8"/>
    <rect width="7" height="230" fill="#4a90d9"/>
    <rect x="70" y="18" width="90" height="30" rx="5" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="115" y="39" text-anchor="middle" font-size="17" fill="#4a90d9" font-weight="bold">clé</text>
    <line x1="166" y1="33" x2="196" y2="33" stroke="#4a90d9" stroke-width="3" marker-end="url(#fb)"/>
    <rect x="204" y="18" width="80" height="30" rx="5" fill="#8a96a3"/>
    <rect x="70" y="58" width="90" height="30" rx="5" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="115" y="79" text-anchor="middle" font-size="17" fill="#4a90d9" font-weight="bold">clé</text>
    <line x1="166" y1="73" x2="196" y2="73" stroke="#4a90d9" stroke-width="3" marker-end="url(#fb)"/>
    <rect x="204" y="58" width="80" height="30" rx="5" fill="#8a96a3"/>
    <text x="175" y="136" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Clé-valeur</text>
    <text x="175" y="164" text-anchor="middle" font-size="18">valeur opaque :</text>
    <text x="175" y="187" text-anchor="middle" font-size="18">cache, sessions</text>
    <text x="175" y="215" text-anchor="middle" font-size="17" fill="#555">Redis</text>
  </g>

  <!-- ===== 2. Document ===== -->
  <g transform="translate(375,0)">
    <rect width="350" height="230" rx="12" fill="#e6f4ee"/>
    <rect width="7" height="230" fill="#13aa52"/>
    <path d="M125,12 h80 l20,20 v74 h-100 z" fill="#ffffff" stroke="#13aa52" stroke-width="3"/>
    <text x="135" y="36" font-size="18" font-weight="bold" fill="#13aa52">{</text>
    <line x1="140" y1="48" x2="200" y2="48" stroke="#13aa52" stroke-width="3"/>
    <rect x="140" y="58" width="68" height="26" rx="3" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <line x1="148" y1="71" x2="198" y2="71" stroke="#13aa52" stroke-width="2"/>
    <text x="135" y="101" font-size="18" font-weight="bold" fill="#13aa52">}</text>
    <text x="175" y="136" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Document</text>
    <text x="175" y="164" text-anchor="middle" font-size="18">documents structurés,</text>
    <text x="175" y="187" text-anchor="middle" font-size="18">interrogés champ par champ</text>
    <text x="175" y="215" text-anchor="middle" font-size="17" fill="#555">MongoDB, CouchDB · TP1 à TP3, projet</text>
  </g>

  <!-- ===== 3. Colonnes ===== -->
  <g transform="translate(750,0)">
    <rect width="350" height="230" rx="12" fill="#f0f4f8"/>
    <rect width="7" height="230" fill="#e8a838"/>
    <!-- en-têtes des deux familles -->
    <rect x="70" y="14" width="120" height="20" fill="#e8a838"/>
    <rect x="194" y="14" width="86" height="20" fill="#b9771a"/>
    <!-- ligne 1 : 4 colonnes -->
    <rect x="70" y="40" width="38" height="24" fill="#fff4dc" stroke="#e8a838" stroke-width="2"/>
    <rect x="111" y="40" width="38" height="24" fill="#fff4dc" stroke="#e8a838" stroke-width="2"/>
    <rect x="152" y="40" width="38" height="24" fill="#fff4dc" stroke="#e8a838" stroke-width="2"/>
    <rect x="194" y="40" width="40" height="24" fill="#f6e2bf" stroke="#b9771a" stroke-width="2"/>
    <!-- ligne 2 : 2 colonnes + 2 -->
    <rect x="70" y="70" width="38" height="24" fill="#fff4dc" stroke="#e8a838" stroke-width="2"/>
    <rect x="194" y="70" width="40" height="24" fill="#f6e2bf" stroke="#b9771a" stroke-width="2"/>
    <rect x="237" y="70" width="43" height="24" fill="#f6e2bf" stroke="#b9771a" stroke-width="2"/>
    <text x="175" y="136" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Colonnes (wide-column)</text>
    <text x="175" y="164" text-anchor="middle" font-size="18">colonnes variables, en familles,</text>
    <text x="175" y="187" text-anchor="middle" font-size="18">sur de nombreuses machines</text>
    <text x="175" y="215" text-anchor="middle" font-size="17" fill="#555">Cassandra, HBase</text>
  </g>

  <!-- ===== 4. Graphe ===== -->
  <g transform="translate(0,250)">
    <rect width="350" height="230" rx="12" fill="#f0f4f8"/>
    <rect width="7" height="230" fill="#8e44ad"/>
    <line x1="95" y1="70" x2="150" y2="30" stroke="#8e44ad" stroke-width="4"/>
    <line x1="150" y1="30" x2="215" y2="55" stroke="#8e44ad" stroke-width="4"/>
    <line x1="215" y1="55" x2="265" y2="25" stroke="#8e44ad" stroke-width="4"/>
    <line x1="95" y1="70" x2="175" y2="92" stroke="#c9a6db" stroke-width="3"/>
    <line x1="175" y1="92" x2="215" y2="55" stroke="#c9a6db" stroke-width="3"/>
    <line x1="175" y1="92" x2="255" y2="90" stroke="#c9a6db" stroke-width="3"/>
    <circle cx="95" cy="70" r="13" fill="#8e44ad"/>
    <circle cx="150" cy="30" r="13" fill="#8e44ad"/>
    <circle cx="215" cy="55" r="13" fill="#8e44ad"/>
    <circle cx="265" cy="25" r="13" fill="#8e44ad"/>
    <circle cx="175" cy="92" r="11" fill="#c9a6db"/>
    <circle cx="255" cy="90" r="11" fill="#c9a6db"/>
    <text x="175" y="136" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Graphe</text>
    <text x="175" y="164" text-anchor="middle" font-size="18">nœuds et relations,</text>
    <text x="175" y="187" text-anchor="middle" font-size="18">pour parcourir des chemins</text>
    <text x="175" y="215" text-anchor="middle" font-size="17" fill="#555">Neo4j · TP4</text>
  </g>

  <!-- ===== 5. Vectoriel ===== -->
  <g transform="translate(375,250)">
    <rect width="350" height="230" rx="12" fill="#f0f4f8"/>
    <rect width="7" height="230" fill="#c0392b"/>
    <line x1="95" y1="105" x2="265" y2="105" stroke="#999" stroke-width="2"/>
    <line x1="95" y1="105" x2="95" y2="10" stroke="#999" stroke-width="2"/>
    <circle cx="190" cy="52" r="34" fill="#e6eef8" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="125" cy="85" r="6" fill="#8a96a3"/>
    <circle cx="140" cy="28" r="6" fill="#8a96a3"/>
    <circle cx="250" cy="35" r="6" fill="#8a96a3"/>
    <circle cx="245" cy="88" r="6" fill="#8a96a3"/>
    <circle cx="115" cy="45" r="6" fill="#8a96a3"/>
    <circle cx="172" cy="40" r="6" fill="#4a90d9"/>
    <circle cx="208" cy="62" r="6" fill="#4a90d9"/>
    <circle cx="182" cy="72" r="6" fill="#4a90d9"/>
    <circle cx="190" cy="52" r="8" fill="#c0392b"/>
    <text x="175" y="136" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Vectoriel</text>
    <text x="175" y="164" text-anchor="middle" font-size="18">embeddings : les plus</text>
    <text x="175" y="187" text-anchor="middle" font-size="18">proches voisins, pour l'IA</text>
    <text x="175" y="215" text-anchor="middle" font-size="17" fill="#555">Qdrant, Milvus, pgvector (PostgreSQL)</text>
  </g>

  <!-- ===== 6. Multi-modèle ===== -->
  <g transform="translate(750,250)">
    <rect width="350" height="230" rx="12" fill="#f0f4f8"/>
    <rect width="7" height="230" fill="#00684a"/>
    <rect x="70" y="10" width="210" height="96" rx="14" fill="#ffffff" stroke="#00684a" stroke-width="3"/>
    <!-- document -->
    <path d="M90,30 h32 l10,10 v42 h-42 z" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <line x1="97" y1="50" x2="125" y2="50" stroke="#13aa52" stroke-width="2"/>
    <line x1="97" y1="62" x2="125" y2="62" stroke="#13aa52" stroke-width="2"/>
    <!-- graphe -->
    <line x1="160" y1="70" x2="180" y2="36" stroke="#8e44ad" stroke-width="3"/>
    <line x1="180" y1="36" x2="200" y2="70" stroke="#8e44ad" stroke-width="3"/>
    <circle cx="160" cy="70" r="8" fill="#8e44ad"/>
    <circle cx="180" cy="36" r="8" fill="#8e44ad"/>
    <circle cx="200" cy="70" r="8" fill="#8e44ad"/>
    <!-- clé-valeur -->
    <rect x="224" y="38" width="16" height="16" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <rect x="244" y="38" width="22" height="16" fill="#8a96a3"/>
    <rect x="224" y="62" width="16" height="16" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <rect x="244" y="62" width="22" height="16" fill="#8a96a3"/>
    <text x="175" y="136" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Multi-modèle</text>
    <text x="175" y="164" text-anchor="middle" font-size="18">plusieurs modèles</text>
    <text x="175" y="187" text-anchor="middle" font-size="18">dans un même moteur</text>
    <text x="175" y="215" text-anchor="middle" font-size="17" fill="#555">ArangoDB</text>
  </g>
</svg>
