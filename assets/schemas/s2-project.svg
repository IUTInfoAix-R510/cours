<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 180" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">$project sur le document du Salon. En entrée : _id Salon, etage 0, moyenne 20.75, nb 4. En sortie : piece Salon, renommé depuis _id ; etage 0, recopié ; moyenne 20.8, calculée par $round ; nb 4, recopié. Le champ _id, exclu, disparaît.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="150.0" y="20" font-size="19" fill="#555" text-anchor="middle">en entrée : un document de <tspan font-family="monospace">$group</tspan></text>
  <text x="1010.0" y="20" font-size="19" fill="#555" text-anchor="middle">en sortie : 4 champs, plus d'<tspan font-family="monospace">_id</tspan></text>
  <rect x="2" y="29" width="296" height="144" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <rect x="860" y="29" width="298" height="144" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="20" y="57" font-family="monospace" font-size="19" fill="#333">_id: "Salon"</text>
  <text x="878" y="57" font-family="monospace" font-size="19" fill="#333">piece: "Salon"</text>
  <line x1="304" y1="55" x2="849" y2="55" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="580" y="46" font-size="19" fill="#333" text-anchor="middle">renommé : <tspan font-family="monospace" fill="#00684a" font-weight="bold">piece: "$_id"</tspan>, et <tspan font-family="monospace" fill="#00684a" font-weight="bold">_id: 0</tspan></text>
  <text x="20" y="91" font-family="monospace" font-size="19" fill="#333">etage: 0</text>
  <text x="878" y="91" font-family="monospace" font-size="19" fill="#333">etage: 0</text>
  <line x1="304" y1="89" x2="849" y2="89" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="580" y="80" font-size="19" fill="#333" text-anchor="middle">recopié : <tspan font-family="monospace" fill="#00684a" font-weight="bold">etage: "$etage"</tspan></text>
  <text x="20" y="125" font-family="monospace" font-size="19" fill="#333">moyenne: 20.75</text>
  <text x="878" y="125" font-family="monospace" font-size="19" fill="#333">moyenne: 20.8</text>
  <line x1="304" y1="123" x2="849" y2="123" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="580" y="114" font-size="19" fill="#333" text-anchor="middle">calculé : <tspan font-family="monospace" fill="#00684a" font-weight="bold">$round</tspan>, à 1 décimale</text>
  <text x="20" y="159" font-family="monospace" font-size="19" fill="#333">nb: 4</text>
  <text x="878" y="159" font-family="monospace" font-size="19" fill="#333">nb: 4</text>
  <line x1="304" y1="157" x2="849" y2="157" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="580" y="148" font-size="19" fill="#333" text-anchor="middle">recopié : <tspan font-family="monospace" fill="#00684a" font-weight="bold">nb: "$nb"</tspan></text>
</svg>
