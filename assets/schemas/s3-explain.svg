<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 272" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Anatomie d'explain("executionStats") pour find({ borough: "Bronx" }) avec l'index { borough: 1 } : queryPlanner.winningPlan est l'arbre FETCH ← IXSCAN, qui se lit de bas en haut (l'IXSCAN parcourt l'index, le FETCH lit les documents) ; executionStats indique nReturned: 2338, totalKeysExamined: 2338 et totalDocsExamined: 2338 ; trois questions à se poser : un COLLSCAN (pas d'index utilisé), un SORT (tri en mémoire), totalDocsExamined supérieur à nReturned (documents lus pour rien) ; le cas idéal est totalDocsExamined = 0, une requête couverte</title>

  <text x="2" y="26" font-family="monospace" font-size="17" fill="#333">db.restaurants.find({ borough: "Bronx" }).explain(<tspan fill="#00684a" font-weight="bold">"executionStats"</tspan>)</text>
  <text x="1158" y="26" font-size="17" fill="#555" text-anchor="end">avec l'index <tspan font-family="monospace" fill="#333">{ borough: 1 }</tspan></text>

  <!-- queryPlanner.winningPlan -->
  <rect x="2" y="44" width="360" height="226" rx="10" fill="#f0f4f8" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="18" y="72" font-family="monospace" font-size="17" font-weight="bold" fill="#333">queryPlanner.winningPlan</text>
  <rect x="22" y="88" width="104" height="34" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="74" y="111" font-family="monospace" font-size="17" font-weight="bold" fill="#00684a" text-anchor="middle">FETCH</text>
  <text x="142" y="111" font-size="16" fill="#333">lit les documents</text>
  <line x1="74" y1="166" x2="74" y2="134" stroke="#555" stroke-width="2.2"/>
  <path d="M67,136 L74,124 L81,136 z" fill="#555"/>
  <rect x="22" y="168" width="104" height="34" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="74" y="191" font-family="monospace" font-size="17" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="142" y="183" font-size="16" fill="#333">parcourt l'index</text>
  <text x="142" y="205" font-family="monospace" font-size="16" fill="#555">{ borough: 1 }</text>
  <text x="18" y="252" font-size="16" fill="#555">se lit de bas en haut, comme un pipeline</text>

  <!-- executionStats -->
  <rect x="372" y="44" width="420" height="226" rx="10" fill="#f0f4f8" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="388" y="72" font-family="monospace" font-size="17" font-weight="bold" fill="#333">executionStats</text>
  <rect x="388" y="86" width="388" height="112" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <g font-family="monospace" font-size="17" fill="#333">
    <text x="402" y="116">nReturned: 2338</text>
    <text x="402" y="148">totalKeysExamined: 2338</text>
    <text x="402" y="180">totalDocsExamined: 2338</text>
  </g>
  <g font-size="15" fill="#777" text-anchor="end">
    <text x="764" y="116">renvoyés</text>
    <text x="764" y="148">clés lues</text>
    <text x="764" y="180">documents lus</text>
  </g>
  <text x="388" y="228" font-size="16" font-weight="bold" fill="#00684a">2338 = 2338 = 2338 : rien n'est lu pour rien,</text>
  <text x="388" y="252" font-size="16" fill="#333">mais chaque document est encore lu (FETCH)</text>

  <!-- Questions à se poser -->
  <rect x="802" y="44" width="356" height="226" rx="10" fill="#fff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="818" y="72" font-size="18" font-weight="bold" fill="#333">Les questions à se poser</text>
  <text x="818" y="104" font-family="monospace" font-size="16" font-weight="bold" fill="#c0392b">COLLSCAN ?</text>
  <text x="932" y="104" font-size="16" fill="#333">pas d'index utilisé</text>
  <text x="818" y="134" font-family="monospace" font-size="16" font-weight="bold" fill="#c0392b">SORT ?</text>
  <text x="932" y="134" font-size="16" fill="#333">tri en mémoire</text>
  <text x="818" y="164" font-family="monospace" font-size="16" font-weight="bold" fill="#c0392b">totalDocsExamined &gt; nReturned ?</text>
  <text x="836" y="186" font-size="16" fill="#333">documents lus pour rien</text>
  <line x1="818" y1="204" x2="1142" y2="204" stroke="#b8c4cf" stroke-width="1.5"/>
  <text x="818" y="230" font-family="monospace" font-size="16" font-weight="bold" fill="#00684a">totalDocsExamined = 0</text>
  <text x="836" y="252" font-size="16" fill="#333">cas idéal : requête couverte</text>
</svg>
