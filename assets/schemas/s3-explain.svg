<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 286" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Extraits de db.restaurants.find({ borough: "Bronx" }).explain("executionStats"). Sans index, winningPlan n'a qu'une étape, COLLSCAN, qui parcourt toute la collection ; nReturned 2338, totalKeysExamined 0, totalDocsExamined 25359 : 23 021 documents lus pour rien. Avec l'index { borough: 1 }, winningPlan a pour étape FETCH, qui lit les documents pointés, et pour entrée (inputStage) IXSCAN sur l'index borough_1, exécutée en premier : le plan se lit de l'intérieur vers l'extérieur. nReturned 2338, totalKeysExamined 2338, totalDocsExamined 2338 : aucun document lu pour rien.</title>

  <!-- sans index -->
  <rect x="2" y="2" width="440" height="282" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="16" y="32" font-size="20" font-weight="bold" fill="#c0392b">Sans index</text>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="16" y="70">winningPlan: {</text>
    <text x="36" y="96">stage: <tspan font-weight="bold" fill="#c0392b">'COLLSCAN'</tspan> }</text>
    <text x="16" y="168">nReturned: 2338</text>
    <text x="16" y="194">totalKeysExamined: 0</text>
    <text x="16" y="220">totalDocsExamined: <tspan font-weight="bold" fill="#c0392b">25359</tspan></text>
  </g>
  <g font-size="18" fill="#555">
    <text x="36" y="124">toute la collection</text>
    <text x="16" y="260"><tspan font-weight="bold" fill="#c0392b">23 021</tspan> documents lus pour rien</text>
  </g>

  <!-- avec index -->
  <rect x="460" y="2" width="698" height="282" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="474" y="32" font-size="20" font-weight="bold" fill="#00684a">Avec l'index <tspan font-family="monospace">{ borough: 1 }</tspan></text>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="474" y="70">winningPlan: {</text>
    <text x="494" y="96">stage: <tspan font-weight="bold" fill="#00684a">'FETCH'</tspan>,</text>
    <text x="494" y="122">inputStage: {</text>
    <text x="514" y="148">stage: <tspan font-weight="bold" fill="#00684a">'IXSCAN'</tspan>,</text>
    <text x="514" y="174">indexName: 'borough_1' } }</text>
    <text x="474" y="210">nReturned: 2338</text>
    <text x="474" y="236">totalKeysExamined: 2338</text>
    <text x="474" y="262">totalDocsExamined: <tspan font-weight="bold" fill="#00684a">2338</tspan></text>
  </g>
  <g font-size="18" fill="#555">
    <text x="780" y="96"><tspan font-weight="bold" fill="#00684a">2.</tspan> lit les documents pointés</text>
    <text x="780" y="148"><tspan font-weight="bold" fill="#00684a">1.</tspan> parcourt l'index, en premier</text>
    <text x="780" y="262"><tspan font-weight="bold" fill="#00684a">aucun</tspan> document lu pour rien</text>
  </g>
  <path d="M770,142 V102" fill="none" stroke="#00684a" stroke-width="2"/>
  <path d="M764,110 L770,100 L776,110" fill="none" stroke="#00684a" stroke-width="2"/>
</svg>
