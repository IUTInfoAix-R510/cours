<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux démarches de conception, en deux lignes. En relationnel : 1, les données (le MCD, des tables en troisième forme normale) ; 2, le schéma (les tables et leurs clés) ; 3, les requêtes, que l'application écrit avec des jointures ; 4, dénormaliser après coup, si c'est lent. Avec MongoDB : 1, les requêtes de l'application, avec leur fréquence ; 2, les relations entre les données, embarquer ou référencer ; 3, les patterns, Subset, Computed, Bucket ; et le résultat : le schéma, fait pour ces requêtes. En bas : en relationnel, un bon schéma vaut pour toutes les requêtes ; avec MongoDB, un bon schéma vaut pour une charge de travail.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- Ligne 1 : en relationnel -->
  <text x="2" y="22" font-size="21" font-weight="bold" fill="#333">En relationnel : les données d'abord</text>

  <g stroke-width="2">
    <rect x="2" y="34" width="266" height="96" rx="8" fill="#e3eefa" stroke="#4a90d9"/>
    <rect x="298" y="34" width="266" height="96" rx="8" fill="#e3eefa" stroke="#4a90d9"/>
    <rect x="594" y="34" width="266" height="96" rx="8" fill="#e3eefa" stroke="#4a90d9"/>
    <rect x="890" y="34" width="266" height="96" rx="8" fill="#e3eefa" stroke="#4a90d9"/>
  </g>
  <g fill="#2f6db0">
    <circle cx="28" cy="62" r="14"/>
    <circle cx="324" cy="62" r="14"/>
    <circle cx="620" cy="62" r="14"/>
    <circle cx="916" cy="62" r="14"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="28" y="68">1</text>
    <text x="324" y="68">2</text>
    <text x="620" y="68">3</text>
    <text x="916" y="68">4</text>
  </g>
  <g font-size="21" font-weight="bold" fill="#333">
    <text x="50" y="69">les données</text>
    <text x="346" y="69">le schéma</text>
    <text x="642" y="69">les requêtes</text>
    <text x="938" y="69">dénormaliser</text>
  </g>
  <g font-size="18" fill="#444">
    <text x="16" y="98">le MCD, des tables</text>
    <text x="16" y="120">en 3ᵉ forme normale</text>
    <text x="312" y="98">les tables</text>
    <text x="312" y="120">et leurs clés</text>
    <text x="608" y="98">écrites ensuite,</text>
    <text x="608" y="120">avec des jointures</text>
    <text x="904" y="98">après coup,</text>
    <text x="904" y="120">si c'est lent</text>
  </g>
  <g stroke="#555" stroke-width="3" marker-end="url(#fl)">
    <line x1="272" y1="82" x2="289" y2="82"/>
    <line x1="568" y1="82" x2="585" y2="82"/>
    <line x1="864" y1="82" x2="881" y2="82"/>
  </g>

  <!-- Ligne 2 : avec MongoDB -->
  <text x="2" y="172" font-size="21" font-weight="bold" fill="#00684a">Avec MongoDB : les requêtes d'abord, le schéma en résultat</text>

  <g stroke-width="2">
    <rect x="2" y="184" width="266" height="96" rx="8" fill="#fdf3e0" stroke="#e8a838"/>
    <rect x="298" y="184" width="266" height="96" rx="8" fill="#fdf3e0" stroke="#e8a838"/>
    <rect x="594" y="184" width="266" height="96" rx="8" fill="#fdf3e0" stroke="#e8a838"/>
    <rect x="890" y="184" width="266" height="96" rx="8" fill="#e6f4ee" stroke="#00684a" stroke-width="3"/>
  </g>
  <g fill="#9a6400">
    <circle cx="28" cy="212" r="14"/>
    <circle cx="324" cy="212" r="14"/>
    <circle cx="620" cy="212" r="14"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="28" y="218">1</text>
    <text x="324" y="218">2</text>
    <text x="620" y="218">3</text>
  </g>
  <g font-size="21" font-weight="bold" fill="#333">
    <text x="50" y="219">les requêtes</text>
    <text x="346" y="219">les relations</text>
    <text x="642" y="219">les patterns</text>
  </g>
  <text x="1023" y="219" font-size="21" font-weight="bold" fill="#00684a" text-anchor="middle">= le schéma</text>
  <g font-size="18" fill="#444">
    <text x="16" y="248">de l'application,</text>
    <text x="16" y="270">avec leur fréquence</text>
    <text x="312" y="248">embarquer</text>
    <text x="312" y="270">ou référencer</text>
    <text x="608" y="248">Subset, Computed,</text>
    <text x="608" y="270">Bucket…</text>
  </g>
  <g font-size="18" fill="#00684a" text-anchor="middle">
    <text x="1023" y="248">fait pour</text>
    <text x="1023" y="270">ces requêtes</text>
  </g>
  <g stroke="#555" stroke-width="3" marker-end="url(#fl)">
    <line x1="272" y1="232" x2="289" y2="232"/>
    <line x1="568" y1="232" x2="585" y2="232"/>
    <line x1="864" y1="232" x2="881" y2="232"/>
  </g>

  <!-- Conclusion -->
  <text x="2" y="318" font-size="19" fill="#444">Un bon schéma relationnel vaut pour <tspan font-weight="bold" fill="#333">toutes les requêtes</tspan> ; un bon schéma MongoDB, pour <tspan font-weight="bold" fill="#00684a">une charge de travail</tspan>.</text>
</svg>
