  <circle cx="311.0" cy="30" r="8" fill="white" stroke="#4a90d9" stroke-width="3"/>
  <text x="10" y="81" font-family="monospace" font-size="19" fill="#333">$gte: 90</text>
  <text x="218" y="81" font-family="monospace" font-size="19" fill="#888" text-anchor="end">>=</text>
  <line x1="232" y1="74" x2="548" y2="74" stroke="#d5dbe1" stroke-width="3"/>
  <line x1="311.0" y1="74" x2="541.4" y2="74" stroke="#4a90d9" stroke-width="7" marker-end="url(#fb)"/>
  <circle cx="311.0" cy="74" r="8" fill="#4a90d9" stroke="#4a90d9" stroke-width="3"/>
  <text x="10" y="125" font-family="monospace" font-size="19" fill="#333">$lt: 120</text>
  <text x="218" y="125" font-family="monospace" font-size="19" fill="#888" text-anchor="end">&lt;</text>
  <line x1="232" y1="118" x2="548" y2="118" stroke="#d5dbe1" stroke-width="3"/>
  <line x1="238.6" y1="118" x2="469.0" y2="118" stroke="#4a90d9" stroke-width="7" marker-start="url(#fb)"/>
  <circle cx="469.0" cy="118" r="8" fill="white" stroke="#4a90d9" stroke-width="3"/>
  <text x="10" y="169" font-family="monospace" font-size="19" fill="#333">$lte: 120</text>
  <text x="218" y="169" font-family="monospace" font-size="19" fill="#888" text-anchor="end">&lt;=</text>
  <line x1="232" y1="162" x2="548" y2="162" stroke="#d5dbe1" stroke-width="3"/>
  <line x1="238.6" y1="162" x2="469.0" y2="162" stroke="#4a90d9" stroke-width="7" marker-start="url(#fb)"/>
  <circle cx="469.0" cy="162" r="8" fill="#4a90d9" stroke="#4a90d9" stroke-width="3"/>
  <line x1="10" y1="192" x2="550" y2="192" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="10" y="231" font-family="monospace" font-size="19" fill="#333">$gte: 90,</text>
  <text x="10" y="256" font-family="monospace" font-size="19" fill="#333">$lt: 120</text>
  <text x="218" y="243" font-family="monospace" font-size="19" fill="#888" text-anchor="end">ET</text>
  <line x1="232" y1="236" x2="548" y2="236" stroke="#d5dbe1" stroke-width="3"/>
  <line x1="311.0" y1="236" x2="469.0" y2="236" stroke="#13aa52" stroke-width="7"/>
  <circle cx="311.0" cy="236" r="8" fill="#13aa52" stroke="#13aa52" stroke-width="3"/>
  <circle cx="469.0" cy="236" r="8" fill="white" stroke="#13aa52" stroke-width="3"/>
  <circle cx="353.1" cy="236" r="5" fill="#00684a"/>
  <text x="353.1" y="220" font-size="19" font-weight="bold" fill="#00684a" text-anchor="middle">La Haine, 98</text>
