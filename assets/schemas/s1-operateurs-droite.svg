<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Les opérateurs de comparaison sur une droite des durées. $gt: 90 (&gt;) au-delà de 90, 90 exclu ; $gte: 90 (&gt;=) 90 compris ; $lt: 120 (&lt;) en deçà de 120, 120 exclu ; $lte: 120 (&lt;=) 120 compris. En combinant $gte: 90 et $lt: 120 par un ET, il reste l'intervalle de 90 compris à 120 exclu, où se trouve La Haine, 98 minutes.</title>
  <defs>
    <marker id="fb" viewBox="0 0 10 10" refX="4" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/></marker>
  </defs>
  <line x1="469.0" y1="16" x2="469.0" y2="282" stroke="#999" stroke-width="1.2" stroke-dasharray="3 5"/>
  <line x1="353.1" y1="200" x2="353.1" y2="282" stroke="#999" stroke-width="1.2" stroke-dasharray="3 5"/>
  <line x1="311.0" y1="16" x2="311.0" y2="282" stroke="#999" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text x="10" y="37" font-family="monospace" font-size="19" fill="#333">$gt: 90</text>
  <text x="218" y="37" font-family="monospace" font-size="19" fill="#888" text-anchor="end">></text>
