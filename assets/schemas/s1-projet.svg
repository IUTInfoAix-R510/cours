<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="sans-serif">
  <title>Note de projet : note d'équipe pondérée pour chaque étudiant</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Note d'équipe -->
  <rect x="10" y="10" width="320" height="380" rx="14" fill="#fdf3e1" stroke="#e8a838" stroke-width="3"/>
  <text x="170" y="50" font-size="26" font-weight="bold" fill="#9a6a0e" text-anchor="middle">Note d'équipe</text>
  <text x="170" y="78" font-size="20" fill="#555" text-anchor="middle">sur 100</text>
  <g font-size="20" fill="#333" text-anchor="middle">
    <rect x="40" y="96" width="260" height="38" rx="19" fill="#fff" stroke="#e8a838" stroke-width="2"/>
    <text x="170" y="122">Données</text>
    <rect x="40" y="144" width="260" height="38" rx="19" fill="#fff" stroke="#e8a838" stroke-width="2"/>
    <text x="170" y="170">API REST et tests</text>
    <rect x="40" y="192" width="260" height="38" rx="19" fill="#fff" stroke="#e8a838" stroke-width="2"/>
    <text x="170" y="218">Front web</text>
    <rect x="40" y="240" width="260" height="38" rx="19" fill="#fff" stroke="#e8a838" stroke-width="2"/>
    <text x="170" y="266">Documentation</text>
  </g>
  <rect x="40" y="298" width="260" height="70" rx="12" fill="#f4ecf8" stroke="#8e44ad" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="170" y="326" font-size="20" font-weight="bold" fill="#8e44ad" text-anchor="middle">+ bonus Neo4j ≤ 10</text>
  <text x="170" y="354" font-size="18" fill="#555" text-anchor="middle">note plafonnée à 100</text>

  <!-- flèche -->
  <line x1="336" y1="200" x2="384" y2="200" stroke="#555" stroke-width="4" marker-end="url(#fl)"/>

  <!-- Pondération individuelle -->
  <rect x="390" y="10" width="470" height="380" rx="14" fill="#f4ecf8" stroke="#8e44ad" stroke-width="3"/>
  <text x="625" y="50" font-size="26" font-weight="bold" fill="#8e44ad" text-anchor="middle">Pondérée pour chaque étudiant</text>

  <!-- questions individuelles -->
  <rect x="410" y="72" width="430" height="116" rx="10" fill="#fff"/>
  <circle cx="446" cy="108" r="20" fill="#8e44ad"/>
  <text x="446" y="116" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
  <text x="480" y="104" font-size="21" font-weight="bold" fill="#333">Questions individuelles</text>
  <text x="480" y="132" font-size="19" fill="#555">S8, environ 6 min, sans jury :</text>
  <text x="480" y="157" font-size="19" fill="#555">expliquer une partie de votre code,</text>
  <text x="480" y="180" font-size="19" fill="#555">puis la modifier</text>

  <!-- contributions -->
  <rect x="410" y="198" width="430" height="92" rx="10" fill="#fff"/>
  <g stroke="#8e44ad" stroke-width="3" fill="none">
    <circle cx="438" cy="222" r="6"/>
    <circle cx="438" cy="262" r="6"/>
    <circle cx="458" cy="236" r="6"/>
    <line x1="438" y1="228" x2="438" y2="256"/>
    <path d="M458,242 C458,256 444,252 440,257"/>
  </g>
  <text x="480" y="228" font-size="21" font-weight="bold" fill="#333">Contributions</text>
  <text x="480" y="256" font-size="19" fill="#555">au moins une pull request significative,</text>
  <text x="480" y="279" font-size="19" fill="#555">la revue de celle d'un coéquipier</text>

  <!-- détecteur d'IA -->
  <rect x="410" y="300" width="430" height="72" rx="10" fill="#fff"/>
  <g stroke="#8e44ad" stroke-width="3" fill="none">
    <circle cx="442" cy="332" r="12"/>
    <line x1="451" y1="341" x2="462" y2="352"/>
  </g>
  <text x="480" y="330" font-size="21" font-weight="bold" fill="#333">Détecteur d'IA</text>
  <text x="480" y="357" font-size="19" fill="#555">appliqué au code rendu</text>

  <!-- flèche -->
  <line x1="866" y1="200" x2="914" y2="200" stroke="#555" stroke-width="4" marker-end="url(#fl)"/>

  <!-- Note de l'étudiant -->
  <rect x="920" y="110" width="190" height="180" rx="14" fill="#e6f4ee" stroke="#13aa52" stroke-width="3"/>
  <g fill="#fff" stroke="#00684a" stroke-width="3">
    <circle cx="1015" cy="148" r="14"/>
    <path d="M987,200 a28,28 0 0 1 56,0 z"/>
  </g>
  <text x="1015" y="236" font-size="21" font-weight="bold" fill="#00684a" text-anchor="middle">Votre note</text>
  <text x="1015" y="264" font-size="21" font-weight="bold" fill="#00684a" text-anchor="middle">de projet</text>
</svg>
