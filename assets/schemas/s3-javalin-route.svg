<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 290" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Comment une route Javalin lit les paramètres d'une URL. À gauche, un paramètre de chemin, sur la route des films /api/annees/{annee}/films : le motif est comparé à l'URL /api/annees/2001/films, {annee} capte le segment 2001 ; ctx.pathParam("annee") renvoie la chaîne "2001", que Integer.parseInt convertit en l'entier 2001. À droite, un paramètre de requête, sur la route fournie du TP /api/boroughs/{borough}/restaurants, appelée avec /api/boroughs/Bronx/restaurants?cuisine=Pizza : ctx.pathParam("borough") renvoie "Bronx", ctx.queryParam("cuisine") renvoie "Pizza", et null si l'URL n'a pas de ?cuisine=.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- chemin -->
  <rect x="2" y="2" width="580" height="286" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="16" y="32" font-size="19" font-weight="bold" fill="#333">Paramètre de chemin : <tspan font-family="monospace" fill="#8e44ad">{annee}</tspan></text>
  <g font-size="18" fill="#555">
    <text x="16" y="80">motif</text>
    <text x="16" y="132">URL</text>
  </g>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="80" y="80">/api/annees/</text>
    <text x="300" y="80">/films</text>
    <text x="80" y="132">/api/annees/</text>
    <text x="300" y="132">/films</text>
  </g>
  <rect x="208" y="58" width="88" height="32" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="252" y="80" font-family="monospace" font-size="18" font-weight="bold" fill="#8e44ad" text-anchor="middle">{annee}</text>
  <line x1="252" y1="90" x2="252" y2="108" stroke="#8e44ad" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="208" y="110" width="88" height="32" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="252" y="132" font-family="monospace" font-size="18" font-weight="bold" fill="#b06f00" text-anchor="middle">2001</text>
  <text x="372" y="108" font-size="18" fill="#555">capte un segment</text>

  <rect x="16" y="168" width="250" height="36" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="26" y="192" font-family="monospace" font-size="18" fill="#333">ctx.<tspan fill="#00684a" font-weight="bold">pathParam</tspan>("annee")</text>
  <line x1="270" y1="186" x2="290" y2="186" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="296" y="168" width="76" height="36" rx="7" fill="#fff" stroke="#e8a838" stroke-width="2"/>
  <text x="334" y="192" font-family="monospace" font-size="18" font-weight="bold" fill="#b06f00" text-anchor="middle">"2001"</text>
  <text x="334" y="232" font-size="18" fill="#c0392b" text-anchor="middle">chaîne</text>
  <line x1="376" y1="186" x2="394" y2="186" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="400" y="168" width="100" height="36" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="450" y="192" font-family="monospace" font-size="18" fill="#333" text-anchor="middle">parseInt</text>
  <line x1="504" y1="186" x2="512" y2="186" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="516" y="168" width="58" height="36" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="545" y="192" font-family="monospace" font-size="18" font-weight="bold" fill="#b06f00" text-anchor="middle">2001</text>
  <text x="545" y="232" font-size="18" fill="#00684a" text-anchor="middle">int</text>
  <text x="16" y="272" font-size="18" fill="#555">route des films : <tspan font-family="monospace">/api/annees/{annee}/films</tspan></text>

  <!-- requête -->
  <rect x="600" y="2" width="558" height="286" rx="10" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="614" y="32" font-size="19" font-weight="bold" fill="#333">Paramètre de requête : <tspan font-family="monospace" fill="#b06f00">?clé=valeur</tspan></text>
  <rect x="612" y="52" width="534" height="36" rx="7" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="622" y="76" font-family="monospace" font-size="18" fill="#333">/api/boroughs/<tspan fill="#8e44ad" font-weight="bold">Bronx</tspan>/restaurants<tspan fill="#b06f00" font-weight="bold">?cuisine=Pizza</tspan></text>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="614" y="132">ctx.<tspan fill="#00684a" font-weight="bold">pathParam</tspan>("borough")</text>
    <text x="614" y="172">ctx.<tspan fill="#00684a" font-weight="bold">queryParam</tspan>("cuisine")</text>
  </g>
  <text x="614" y="212" font-size="18" fill="#555">sans <tspan font-family="monospace">?cuisine=</tspan></text>
  <g font-size="18" fill="#777">
    <text x="924" y="132">→</text>
    <text x="924" y="172">→</text>
    <text x="924" y="212">→</text>
  </g>
  <g font-family="monospace" font-size="18" font-weight="bold">
    <text x="950" y="132" fill="#8e44ad">"Bronx"</text>
    <text x="950" y="172" fill="#b06f00">"Pizza"</text>
    <text x="950" y="212" fill="#c0392b">null</text>
  </g>
  <text x="614" y="272" font-size="18" fill="#555">route fournie : <tspan font-family="monospace">ApiRestaurants.java</tspan></text>
</svg>
