<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Les trois collections du TP2 : restaurants (25 359 documents) avec _id, le document imbriqué address qui contient building, street, zipcode et le tableau coord [longitude, latitude], puis borough, cuisine, le tableau de documents grades { date, grade, score } rangé de la plus récente à la plus ancienne inspection, name et restaurant_id, une chaîne ; neighborhoods (195 documents) avec _id, name et geometry, un Polygon ou un MultiPolygon GeoJSON ; boroughs (5 documents, créée pour le TP) avec _id (code FIPS), nom, comte, population (recensement 2020) et superficie_km2. Le champ borough se relie à nom par $lookup (partie 3), et address.coord se situe dans le polygone geometry avec $geoWithin (partie 5). Le score compte des points de pénalité : plus il est bas, mieux c'est.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- neighborhoods -->
  <rect x="2" y="8" width="212" height="332" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="16" y="40" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">neighborhoods</text>
  <text x="16" y="68" font-size="18" fill="#555">195 documents</text>
  <rect x="10" y="154" width="196" height="102" rx="6" fill="#e3eefa"/>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="16" y="106">_id</text>
    <text x="16" y="140">name</text>
    <text x="16" y="178">geometry: {</text>
    <text x="36" y="210">type,</text>
    <text x="36" y="242">coordinates }</text>
  </g>
  <g font-size="18" fill="#666">
    <text x="16" y="290">Polygon ou</text>
    <text x="16" y="316">MultiPolygon</text>
  </g>

  <!-- restaurants -->
  <rect x="330" y="8" width="500" height="404" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="346" y="40" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">restaurants</text>
  <text x="520" y="40" font-size="18" fill="#555">25 359 documents</text>
  <rect x="338" y="92" width="484" height="98" rx="6" fill="#e3eefa"/>
  <rect x="364" y="154" width="430" height="30" rx="6" fill="#fdf3e0"/>
  <rect x="338" y="268" width="484" height="60" rx="6" fill="#fdf3e0"/>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="346" y="78">_id</text>
    <text x="346" y="116">address: {</text>
    <text x="370" y="146">building, street, zipcode,</text>
    <text x="370" y="176">coord: [ longitude, latitude ] }</text>
    <text x="346" y="222">borough: "Bronx"</text>
    <text x="346" y="256">cuisine: "Bakery"</text>
    <text x="346" y="292">grades: [ { date, grade, score } ]</text>
    <text x="346" y="362">name</text>
    <text x="346" y="396">restaurant_id: "40356018"</text>
  </g>
  <text x="370" y="318" font-size="18" fill="#555">de la plus récente à la plus ancienne</text>
  <text x="652" y="396" font-size="18" fill="#666">une chaîne</text>

  <!-- boroughs -->
  <rect x="920" y="8" width="238" height="282" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="934" y="40" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">boroughs</text>
  <text x="1048" y="40" font-size="18" fill="#555">5 documents</text>
  <text x="934" y="68" font-size="18" fill="#555">créée pour le TP</text>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="934" y="106">_id</text>
    <text x="934" y="140">nom: "Bronx"</text>
    <text x="934" y="174">comte</text>
    <text x="934" y="208">population</text>
    <text x="934" y="272">superficie_km2</text>
  </g>
  <text x="980" y="106" font-size="18" fill="#666">code FIPS</text>
  <text x="950" y="236" font-size="18" fill="#666">recensement 2020</text>

  <!-- address.coord → geometry -->
  <circle cx="368" cy="169" r="4.5" fill="#888"/>
  <line x1="364" y1="169" x2="224" y2="169" stroke="#b8c4cf" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#fl)"/>
  <g text-anchor="middle">
    <text x="272" y="150" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">$geoWithin</text>
    <text x="272" y="196" font-size="18" fill="#555">partie 5</text>
  </g>

  <!-- borough → nom -->
  <circle cx="526" cy="216" r="4.5" fill="#888"/>
  <path d="M 530 216 L 846 216 C 880 216, 876 134, 910 134" fill="none" stroke="#b8c4cf" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#fl)"/>
  <g text-anchor="middle">
    <text x="875" y="250" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">$lookup</text>
    <text x="875" y="274" font-size="18" fill="#555">partie 3</text>
  </g>

  <!-- score -->
  <line x1="822" y1="298" x2="914" y2="330" stroke="#b8c4cf" stroke-width="1.5"/>
  <g font-size="18" fill="#555">
    <text x="920" y="338"><tspan font-family="monospace" fill="#333">score</tspan> : des points</text>
    <text x="920" y="362">de pénalité ; plus il</text>
    <text x="920" y="386">est bas, mieux c'est</text>
  </g>

  <!-- légende -->
  <g font-size="18" fill="#333">
    <rect x="10" y="356" width="24" height="20" rx="4" fill="#e3eefa"/>
    <text x="44" y="372">document imbriqué</text>
    <rect x="10" y="386" width="24" height="20" rx="4" fill="#fdf3e0"/>
    <text x="44" y="402">tableau</text>
    <line x1="10" y1="428" x2="36" y2="428" stroke="#b8c4cf" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="44" y="434">lien par valeur</text>
  </g>
</svg>
