<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 344" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Mécanisme de $lookup: { from: "realisateurs", localField: "realisateur", foreignField: "nom", as: "r" }, montré sur deux films. Pour chaque film : 1, on prend la valeur de son champ realisateur (localField) ; 2, on compare cette valeur au champ nom (foreignField) de chaque document de la collection realisateurs (from) ; 3, les documents égaux sont rangés dans un tableau r (as), ajouté au film, qui garde ses autres champs. Le Voyage de Chihiro, réalisateur "Miyazaki" : parmi Miyazaki, Varda et Jeunet, seul Miyazaki est égal, r contient { nom: "Miyazaki", pays: "Japon" }. La Haine, réalisateur "Kassovitz" : aucun nom n'est égal, r est un tableau vide. Le même travail est fait pour chaque film : r reçoit 0, 1 ou plusieurs documents, toujours dans un tableau.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#13aa52"/>
    </marker>
    <marker id="flg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8c4cf"/>
    </marker>
  </defs>

  <!-- le code -->
  <text x="2" y="24" font-family="monospace" font-size="17" fill="#333">{ <tspan fill="#00684a" font-weight="bold">$lookup</tspan>: { from: "realisateurs", localField: "<tspan fill="#4a90d9" font-weight="bold">realisateur</tspan>", foreignField: "<tspan font-weight="bold">nom</tspan>", as: "<tspan fill="#00684a" font-weight="bold">r</tspan>" } }</text>

  <!-- en-têtes des étapes -->
  <text x="120" y="62" font-size="15" fill="#555" text-anchor="middle">chaque film</text>
  <circle cx="262" cy="56" r="12" fill="#00684a"/>
  <text x="262" y="62" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="280" y="62" font-size="15" font-weight="bold" fill="#00684a">sa valeur</text>
  <circle cx="420" cy="56" r="12" fill="#00684a"/>
  <text x="420" y="62" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="438" y="62" font-size="14" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#00684a">foreignField</tspan> : dans <tspan font-family="monospace">realisateurs</tspan>, <tspan font-family="monospace" font-weight="bold">nom</tspan> égal ?</text>
  <circle cx="806" cy="56" r="12" fill="#00684a"/>
  <text x="806" y="62" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="824" y="62" font-size="15" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#00684a">r</tspan> : les documents égaux, ajoutés au film</text>

  <!-- ligne 1 : Le Voyage de Chihiro (2001, bleu) -->
  <rect x="2" y="80" width="236" height="94" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="14" y="104" font-size="16" font-weight="bold" fill="#333">Le Voyage de Chihiro</text>
  <text x="14" y="128" font-family="monospace" font-size="14" fill="#333">annee: 2001, …</text>
  <rect x="8" y="136" width="224" height="28" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="14" y="155" font-family="monospace" font-size="14" fill="#333">realisateur: <tspan fill="#4a90d9" font-weight="bold">"Miyazaki"</tspan></text>
  <line x1="232" y1="150" x2="262" y2="150" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="264" y="135" width="124" height="30" rx="7" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="326" y="156" font-family="monospace" font-size="16" font-weight="bold" fill="#4a90d9" text-anchor="middle">"Miyazaki"</text>
  <line x1="388" y1="150" x2="404" y2="150" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <rect x="406" y="74" width="360" height="106" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="416" y="82" width="292" height="28" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="426" y="101" font-family="monospace" font-size="15" fill="#333">nom: <tspan font-weight="bold" fill="#00684a">"Miyazaki"</tspan>, pays: "Japon"</text>
  <text x="738" y="103" font-size="22" font-weight="bold" fill="#00684a" text-anchor="middle">=</text>
  <rect x="416" y="114" width="292" height="28" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="426" y="133" font-family="monospace" font-size="15" fill="#777">nom: "Varda", pays: "France"</text>
  <text x="738" y="135" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">≠</text>
  <rect x="416" y="146" width="292" height="28" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="426" y="165" font-family="monospace" font-size="15" fill="#777">nom: "Jeunet", pays: "France"</text>
  <text x="738" y="167" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">≠</text>

  <path d="M754,96 C778,96 774,150 790,150" fill="none" stroke="#13aa52" stroke-width="2.4" marker-end="url(#flv)"/>

  <rect x="792" y="80" width="366" height="94" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="804" y="104" font-size="16" font-weight="bold" fill="#333">Le Voyage de Chihiro</text>
  <text x="804" y="128" font-size="14" fill="#555">ses autres champs, inchangés</text>
  <text x="804" y="155" font-family="monospace" font-size="15" fill="#333"><tspan font-weight="bold" fill="#00684a">r</tspan>: [</text>
  <rect x="846" y="136" width="270" height="28" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="856" y="155" font-family="monospace" font-size="14" fill="#333">nom: "Miyazaki", pays: "Japon"</text>
  <text x="1124" y="155" font-family="monospace" font-size="15" fill="#333">]</text>

  <!-- ligne 2 : La Haine (1995, violet) -->
  <rect x="2" y="204" width="236" height="94" rx="8" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="14" y="228" font-size="16" font-weight="bold" fill="#333">La Haine</text>
  <text x="14" y="252" font-family="monospace" font-size="14" fill="#333">annee: 1995, …</text>
  <rect x="8" y="260" width="224" height="28" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <text x="14" y="279" font-family="monospace" font-size="14" fill="#333">realisateur: <tspan fill="#8e44ad" font-weight="bold">"Kassovitz"</tspan></text>
  <line x1="232" y1="274" x2="262" y2="274" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <rect x="264" y="259" width="124" height="30" rx="7" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <text x="326" y="280" font-family="monospace" font-size="16" font-weight="bold" fill="#8e44ad" text-anchor="middle">"Kassovitz"</text>
  <line x1="388" y1="274" x2="404" y2="274" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <rect x="406" y="198" width="360" height="106" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="416" y="206" width="292" height="28" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="426" y="225" font-family="monospace" font-size="15" fill="#777">nom: "Miyazaki", pays: "Japon"</text>
  <text x="738" y="227" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">≠</text>
  <rect x="416" y="238" width="292" height="28" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="426" y="257" font-family="monospace" font-size="15" fill="#777">nom: "Varda", pays: "France"</text>
  <text x="738" y="259" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">≠</text>
  <rect x="416" y="270" width="292" height="28" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="426" y="289" font-family="monospace" font-size="15" fill="#777">nom: "Jeunet", pays: "France"</text>
  <text x="738" y="291" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">≠</text>

  <line x1="768" y1="274" x2="790" y2="274" stroke="#b8c4cf" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#flg)"/>

  <rect x="792" y="204" width="366" height="94" rx="8" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="804" y="228" font-size="16" font-weight="bold" fill="#333">La Haine</text>
  <text x="804" y="252" font-size="14" fill="#555">ses autres champs, inchangés</text>
  <text x="804" y="279" font-family="monospace" font-size="15" fill="#333"><tspan font-weight="bold" fill="#00684a">r</tspan>: [</text>
  <rect x="846" y="260" width="28" height="28" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="882" y="279" font-family="monospace" font-size="15" fill="#333">]</text>
  <text x="904" y="279" font-size="14" font-weight="bold" fill="#c0392b">vide : aucun nom égal</text>

  <!-- légende -->
  <text x="2" y="334" font-size="15" fill="#555">Même travail pour chaque film : <tspan font-family="monospace" fill="#00684a" font-weight="bold">r</tspan> reçoit 0, 1 ou plusieurs documents, <tspan font-weight="bold" fill="#333">toujours dans un tableau</tspan>.</text>
</svg>
