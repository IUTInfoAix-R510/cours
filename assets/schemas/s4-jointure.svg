  <text x="371" y="76" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">aucun index</text>
  <text x="371" y="102" font-size="18" fill="#c0392b" text-anchor="middle">parcours complet</text>
  <g stroke="#555" stroke-width="3" marker-end="url(#fl)"><line x1="133" y1="82" x2="143" y2="82"/><line x1="257" y1="82" x2="267" y2="82"/><line x1="470" y1="82" x2="482" y2="82"/></g>
