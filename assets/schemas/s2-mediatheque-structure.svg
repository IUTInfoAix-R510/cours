<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Structure des deux collections. livres : _id, titre, annee ; auteurs, tableau de documents ; categories, tableau ; serie, document imbriqué facultatif ; exemplaires, tableau de documents dont chaque élément peut contenir emprunt_actuel, document imbriqué de troisième niveau avec membre_id qui référence un membre ; avis, tableau facultatif de documents avec membre_id. membres : _id, prenom, nom, ville, inscription ; parrain_id, référence facultative vers un membre ; emprunts, tableau de documents avec exemplaire, livre_id qui référence un livre, titre, dates et date_retour facultative. Un emprunt en cours est écrit deux fois : dans le livre et dans le membre.</title>

  <!-- Collection livres -->
  <rect x="10" y="10" width="690" height="350" rx="14" fill="#f0f4f8" stroke="#00684a" stroke-width="3"/>
  <text x="30" y="46" font-size="26" font-weight="bold" fill="#00684a">livres</text>
  <text x="120" y="46" font-size="20" fill="#555">26 documents, un par livre</text>
  <!-- fonds de couleur : tableaux (orange), document imbriqué (bleu), 3e niveau (violet) -->
  <rect x="22" y="103" width="666" height="34" rx="6" fill="#fdf1dc"/>
  <rect x="22" y="141" width="666" height="34" rx="6" fill="#fdf1dc"/>
  <rect x="22" y="179" width="666" height="34" rx="6" fill="#e3eefa"/>
  <rect x="22" y="217" width="666" height="98" rx="6" fill="#fdf1dc"/>
  <rect x="58" y="250" width="626" height="62" rx="6" fill="#efe3f5"/>
  <rect x="22" y="319" width="666" height="34" rx="6" fill="#fdf1dc"/>
  <g font-family="monospace" font-size="20" fill="#222">
    <text x="34" y="88">_id, titre, annee</text>
    <text x="34" y="126">auteurs: [ { id, prenom, nom, nationalite? } ]</text>
    <text x="34" y="164">categories: [ "Science-Fiction", … ]</text>
    <text x="34" y="202">serie?: { nom, tome }</text>
    <text x="34" y="240">exemplaires: [ { code, etat, disponible,</text>
    <text x="70" y="273">emprunt_actuel?: { membre_id <tspan fill="#777">→ membres</tspan>,</text>
    <text x="70" y="301">  date_emprunt, date_retour_prevue } } ]</text>
    <text x="34" y="342">avis?: [ { membre_id <tspan fill="#777">→ membres</tspan>, note } ]</text>
  </g>

  <!-- Collection membres -->
  <rect x="730" y="10" width="420" height="350" rx="14" fill="#f0f4f8" stroke="#00684a" stroke-width="3"/>
  <text x="750" y="46" font-size="26" font-weight="bold" fill="#00684a">membres</text>
  <text x="872" y="46" font-size="20" fill="#555">14 documents</text>
  <rect x="742" y="179" width="396" height="162" rx="6" fill="#fdf1dc"/>
  <g font-family="monospace" font-size="20" fill="#222">
    <text x="754" y="88">_id, prenom, nom,</text>
    <text x="754" y="116">ville, inscription,</text>
    <text x="754" y="160">parrain_id? <tspan fill="#777">→ membres</tspan></text>
    <text x="754" y="202">emprunts: [ {</text>
    <text x="772" y="230">exemplaire,</text>
    <text x="772" y="256">livre_id <tspan fill="#777">→ livres</tspan>,</text>
    <text x="772" y="282">titre, date_emprunt,</text>
    <text x="772" y="308">date_retour_prevue,</text>
    <text x="772" y="334">date_retour? } ]</text>
  </g>

  <!-- Un emprunt en cours est écrit deux fois -->
  <path d="M 684 281 C 712 281, 712 245, 742 245" fill="none" stroke="#8e44ad" stroke-width="3" stroke-dasharray="7 5.84"/>
  <text x="580" y="392" text-anchor="middle" font-size="20" fill="#8e44ad" font-weight="bold">Un emprunt en cours est écrit deux fois : dans le livre (emprunt_actuel) et dans le membre (emprunts).</text>

  <!-- Légende -->
  <g font-size="20" fill="#333">
    <rect x="22" y="420" width="26" height="22" rx="4" fill="#e3eefa"/>
    <text x="56" y="438">document imbriqué</text>
    <rect x="240" y="420" width="26" height="22" rx="4" fill="#fdf1dc"/>
    <text x="274" y="438">tableau</text>
    <rect x="365" y="420" width="26" height="22" rx="4" fill="#efe3f5"/>
    <text x="399" y="438">document dans un tableau (3e niveau)</text>
    <text x="780" y="438" font-family="monospace" font-weight="bold">?</text>
    <text x="800" y="438">facultatif</text>
    <text x="920" y="438" fill="#777">→</text>
    <text x="946" y="438">référence (_id)</text>
  </g>
</svg>
