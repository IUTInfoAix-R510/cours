<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le quantificateur {1,3} : le motif (a)-[:SUIT]-&gt;{1,3}(b) est l'union de trois motifs de longueur fixe : (a)-&gt;(b), de longueur 1 ; (a)-&gt;( )-&gt;(b), de longueur 2 ; (a)-&gt;( )-&gt;( )-&gt;(b), de longueur 3, où chaque flèche est une relation SUIT et ( ) un nœud quelconque. Chaque motif trouvé est un chemin.</title>
