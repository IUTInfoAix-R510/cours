<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Les 4 films triés par année puis titre ont pour durée 98 (La Haine), 82 (Glaneurs), 122 (Amélie) et 125 (Chihiro). Pour Amélie, document courant, la fenêtre documents: ["unbounded", "current"] va du premier film jusqu'à elle : 98 + 82 + 122 = 302. Les durées cumulées valent 98, 180, 302 et 427. La fenêtre part toujours du premier document et s'arrête au document courant : elle s'agrandit d'un document à l'autre.</title>
  <text x="580" y="22" font-family="monospace" font-size="19" fill="#333" text-anchor="middle">window: { documents: [<tspan font-weight="bold" fill="#b06f00">"unbounded"</tspan>, <tspan font-weight="bold" fill="#00684a">"current"</tspan>] }</text>
  <g font-size="18" fill="#555">
    <text x="4" y="92">documents</text><text x="4" y="114">par annee,</text><text x="4" y="136">puis titre</text>
    <text x="4" y="206">cumul</text>
    <text x="4" y="252">calcul</text>
  </g>
  <rect x="172" y="50" width="726" height="110" rx="10" fill="none" stroke="#e8a838" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="186" y="44" font-size="18" font-weight="bold" fill="#b06f00">"unbounded" : le premier</text>
  <text x="890" y="44" font-size="18" font-weight="bold" fill="#00684a" text-anchor="end">"current" : Amélie</text>
  <rect x="180" y="64" width="230" height="84" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="194" y="96" font-size="19" font-weight="bold" fill="#333">La Haine</text>
  <text x="194" y="130" font-family="monospace" font-size="18" fill="#333">duree: 98</text>
  <rect x="220" y="180" width="150" height="40" rx="8" fill="#fff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="295" y="207" font-family="monospace" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">98</text>
  <text x="295" y="252" font-family="monospace" font-size="18" fill="#555" text-anchor="middle">98</text>
  <rect x="424" y="64" width="230" height="84" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="438" y="96" font-size="19" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="438" y="130" font-family="monospace" font-size="18" fill="#333">duree: 82</text>
  <rect x="464" y="180" width="150" height="40" rx="8" fill="#fff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="539" y="207" font-family="monospace" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">180</text>
  <text x="539" y="252" font-family="monospace" font-size="18" fill="#555" text-anchor="middle">98 + 82</text>
  <rect x="668" y="64" width="230" height="84" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="3"/>
  <text x="682" y="96" font-size="19" font-weight="bold" fill="#333">Amélie</text>
  <text x="682" y="130" font-family="monospace" font-size="18" fill="#333">duree: 122</text>
  <rect x="708" y="180" width="150" height="40" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="783" y="207" font-family="monospace" font-size="20" font-weight="bold" fill="#00684a" text-anchor="middle">302</text>
  <text x="783" y="252" font-family="monospace" font-size="18" fill="#555" text-anchor="middle">98 + 82 + 122</text>
  <rect x="912" y="64" width="230" height="84" rx="8" fill="#f7f9fb" stroke="#d0d7de" stroke-width="2"/>
  <text x="926" y="96" font-size="19" font-weight="bold" fill="#333">Chihiro</text>
  <text x="926" y="130" font-family="monospace" font-size="18" fill="#333">duree: 125</text>
  <rect x="952" y="180" width="150" height="40" rx="8" fill="#fff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="1027" y="207" font-family="monospace" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">427</text>
  <text x="1027" y="252" font-family="monospace" font-size="18" fill="#555" text-anchor="middle">98+82+122+125</text>
  <text x="580" y="290" font-size="18" fill="#555" text-anchor="middle">La fenêtre part du premier document et s'arrête au courant : elle s'agrandit d'un document à l'autre.</text>
</svg>
