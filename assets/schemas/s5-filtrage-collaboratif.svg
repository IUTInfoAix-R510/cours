  <line x1="796" y1="90" x2="892" y2="90" stroke="#555" stroke-width="2.5" marker-end="url(#fl-noir)"/>
  <text x="1025" y="280" font-size="18" font-family="monospace" fill="#555" text-anchor="middle">count(p) par autre jeu</text>
</svg>
