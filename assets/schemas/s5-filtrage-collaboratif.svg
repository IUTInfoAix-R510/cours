  <rect x="650" y="65" width="140" height="50" rx="25.0" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="720" y="96.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Comète</text>
  <rect x="640" y="185" width="160" height="50" rx="25.0" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="720" y="216.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Marée haute</text>
