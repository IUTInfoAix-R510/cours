<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le filtrage collaboratif sur l'exemple d'essai, en quatre étapes, pour le motif (:Jeu {titre: 'Archipel'})&lt;-[:AIME]-(p:Personne)-[:AIME]-&gt;(autre:Jeu) ; seules les personnes qui aiment Archipel sont dessinées. Étape 1 : partir d'Archipel. Étape 2 : qui l'aime, Ana, Bilal et Elif, par &lt;-[:AIME]-(p:Personne). Étape 3 : ce qu'ils aiment d'autre, par -[:AIME]-&gt;(autre:Jeu) : Ana aime Comète, Bilal aime Marée haute, Elif aime Marée haute ; autre ne vaut jamais Archipel, car une relation n'est jamais parcourue deux fois dans un même motif. Étape 4 : compter count(p) pour chaque autre : Marée haute 2 (Bilal et Elif), Comète 1 (Ana). Résultat : Marée haute 2, Comète 1, « ceux qui aiment Archipel aiment aussi… ».</title>
