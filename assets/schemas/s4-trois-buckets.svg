<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 298" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Trois sens du mot bucket, en trois colonnes. 1, l'étape $bucket du TP2 : elle répartit des documents en tranches de valeurs (les films de 0 à 90 minutes, de 90 à 120) ; c'est une étape de pipeline, elle ne change pas la base. 2, le pattern Bucket (cette partie) : un document par entité et par période (un épisode, un jour) contient les mesures de cette période ; c'est un modèle que l'on écrit soi-même. 3, les buckets internes d'une collection time series (partie 5) : MongoDB regroupe lui-même les mesures, sans qu'on les voie ; c'est un rangement du serveur.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="flg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>

  <!-- ===== 1 : l'étape $bucket ===== -->
  <circle cx="16" cy="16" r="12" fill="#00684a"/>
  <text x="16" y="22" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="36" y="22" font-size="17" font-weight="bold" fill="#333">l'étape <tspan font-family="monospace" fill="#00684a">$bucket</tspan> <tspan font-size="15" font-weight="normal" fill="#777">(TP2)</tspan></text>
  <text x="2" y="50" font-size="15" fill="#333">répartit des documents en tranches</text>
  <text x="2" y="70" font-size="15" fill="#333">de valeurs, le temps d'une requête</text>

  <rect x="2" y="86" width="368" height="152" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="14" y="96" width="166" height="66" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="192" y="96" width="166" height="66" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <g font-family="monospace" font-size="15" font-weight="bold" fill="#b06f00" text-anchor="middle">
    <text x="97" y="116">[0, 90[</text>
    <text x="275" y="116">[90, 120[</text>
  </g>
  <rect x="24" y="124" width="146" height="28" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="34" y="143" font-size="14" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="160" y="143" font-family="monospace" font-size="14" fill="#555" text-anchor="end">82</text>
  <rect x="202" y="124" width="146" height="28" rx="6" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="212" y="143" font-size="14" font-weight="bold" fill="#333">La Haine</text>
  <text x="338" y="143" font-family="monospace" font-size="14" fill="#555" text-anchor="end">98</text>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#fl)">
    <line x1="97" y1="166" x2="97" y2="184"/>
    <line x1="275" y1="166" x2="275" y2="184"/>
  </g>
  <rect x="14" y="194" width="166" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <rect x="192" y="194" width="166" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <g font-family="monospace" font-size="14" fill="#333" text-anchor="middle">
    <text x="97" y="215">{ _id: 0, nb: 1 }</text>
    <text x="275" y="215">{ _id: 90, nb: 1 }</text>
  </g>

  <text x="2" y="266" font-size="15" font-weight="bold" fill="#00684a">une étape de pipeline</text>
  <text x="2" y="288" font-size="15" fill="#555">elle ne change pas la base</text>

  <!-- ===== 2 : le pattern Bucket ===== -->
  <circle cx="410" cy="16" r="12" fill="#00684a"/>
  <text x="410" y="22" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="430" y="22" font-size="17" font-weight="bold" fill="#333">le pattern Bucket <tspan font-size="15" font-weight="normal" fill="#777">(cette partie)</tspan></text>
  <text x="396" y="50" font-size="15" fill="#333">un document par entité et par période</text>
  <text x="396" y="70" font-size="15" fill="#333">(un épisode, un jour) contient ses mesures</text>

  <rect x="396" y="86" width="368" height="152" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="408" y="96" width="344" height="132" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="420" y="120" font-family="monospace" font-size="15" fill="#333">_id: <tspan font-weight="bold">"E1-2026-09-08"</tspan>,</text>
  <text x="420" y="144" font-family="monospace" font-size="14" fill="#333">episode: "E1", jour: 2026-09-08,</text>
  <text x="420" y="170" font-family="monospace" font-size="14" fill="#333">mesures: [</text>
  <rect x="434" y="180" width="130" height="28" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <rect x="574" y="180" width="130" height="28" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="499" y="199">0 h 10 · <tspan font-weight="bold">35</tspan></text>
    <text x="639" y="199">7 h 30 · <tspan font-weight="bold">52</tspan></text>
  </g>
  <text x="712" y="199" font-family="monospace" font-size="14" fill="#333">]</text>

  <text x="396" y="266" font-size="15" font-weight="bold" fill="#b06f00">un modèle de données</text>
  <text x="396" y="288" font-size="15" fill="#555">que l'on écrit soi-même</text>

  <!-- ===== 3 : les buckets internes ===== -->
  <circle cx="804" cy="16" r="12" fill="#00684a"/>
  <text x="804" y="22" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="824" y="22" font-size="17" font-weight="bold" fill="#333">les buckets internes <tspan font-size="15" font-weight="normal" fill="#777">(partie 5)</tspan></text>
  <text x="790" y="50" font-size="15" fill="#333">dans une collection time series,</text>
  <text x="790" y="70" font-size="15" fill="#333">MongoDB regroupe lui-même les mesures</text>

  <rect x="790" y="86" width="368" height="152" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="802" y="110" font-size="14" fill="#555">on écrit et on lit : une mesure par document</text>
  <g stroke-width="2">
    <rect x="802" y="120" width="62" height="26" rx="6" fill="#e3eefa" stroke="#4a90d9"/>
    <rect x="872" y="120" width="62" height="26" rx="6" fill="#e3eefa" stroke="#4a90d9"/>
    <rect x="942" y="120" width="62" height="26" rx="6" fill="#e3eefa" stroke="#4a90d9"/>
    <rect x="1012" y="120" width="62" height="26" rx="6" fill="#f3e8f8" stroke="#8e44ad"/>
    <rect x="1082" y="120" width="62" height="26" rx="6" fill="#f3e8f8" stroke="#8e44ad"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="833" y="138">E1 · 40</text>
    <text x="903" y="138">E1 · 35</text>
    <text x="973" y="138">E1 · 52</text>
    <text x="1043" y="138">E4 · 18</text>
    <text x="1113" y="138">E4 · 21</text>
  </g>
  <line x1="973" y1="150" x2="973" y2="166" stroke="#777" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#flg)"/>
  <rect x="802" y="176" width="344" height="52" rx="6" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="814" y="186" width="96" height="32" rx="5" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <rect x="922" y="186" width="68" height="32" rx="5" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <g fill="#e3eefa" stroke="#4a90d9" stroke-width="1.5">
    <rect x="822" y="194" width="20" height="16" rx="2"/>
    <rect x="852" y="194" width="20" height="16" rx="2"/>
    <rect x="882" y="194" width="20" height="16" rx="2"/>
  </g>
  <g fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5">
    <rect x="930" y="194" width="20" height="16" rx="2"/>
    <rect x="960" y="194" width="20" height="16" rx="2"/>
  </g>
  <text x="1134" y="199" font-size="13" fill="#777" text-anchor="end">buckets internes,</text>
  <text x="1134" y="216" font-size="13" fill="#777" text-anchor="end">invisibles</text>

  <text x="790" y="266" font-size="15" font-weight="bold" fill="#555">un rangement du serveur</text>
  <text x="790" y="288" font-size="15" fill="#555">que l'on ne voit pas</text>
</svg>
