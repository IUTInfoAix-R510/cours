<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Trois sens du mot bucket, en trois colonnes. 1, l'étape $bucket du TP2 : elle répartit des documents en tranches de valeurs (les films de 0 à 90 minutes, de 90 à 120) ; c'est une étape de pipeline, elle ne change pas la base. 2, le pattern Bucket (cette partie) : un document par entité et par période (un épisode, un jour) contient les mesures de cette période ; c'est un modèle que l'on écrit soi-même. 3, les buckets internes d'une collection time series (partie 5) : MongoDB regroupe lui-même les mesures, sans qu'on les voie ; c'est un rangement du serveur.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="flg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>
  <circle cx="16" cy="16" r="14" fill="#00684a"/><text x="16" y="22" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="38" y="23" font-size="20" font-weight="bold" fill="#333">l'étape <tspan font-family="monospace" fill="#00684a">$bucket</tspan> <tspan font-size="18" font-weight="normal" fill="#777">(TP2)</tspan></text>
  <text x="2" y="52" font-size="18" fill="#333">répartit des documents en tranches</text>
  <text x="2" y="74" font-size="18" fill="#333">de valeurs, le temps d'une requête</text>
  <rect x="2" y="88" width="372" height="182" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="14" y="100" width="172" height="76" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="100" y="123" font-family="monospace" font-size="18" font-weight="bold" fill="#b06f00" text-anchor="middle">[0, 90[</text>
  <rect x="24" y="134" width="152" height="32" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="34" y="156" font-size="18" font-weight="bold" fill="#333">Glaneurs</text><text x="166" y="156" font-family="monospace" font-size="18" fill="#555" text-anchor="end">82</text>
  <line x1="100" y1="180" x2="100" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="14" y="210" width="172" height="44" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="100" y="238" font-family="monospace" font-size="18" fill="#333" text-anchor="middle">_id: 0, nb: 1</text>
  <rect x="196" y="100" width="172" height="76" rx="6" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text x="282" y="123" font-family="monospace" font-size="18" font-weight="bold" fill="#b06f00" text-anchor="middle">[90, 120[</text>
  <rect x="206" y="134" width="152" height="32" rx="6" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="216" y="156" font-size="18" font-weight="bold" fill="#333">La Haine</text><text x="348" y="156" font-family="monospace" font-size="18" fill="#555" text-anchor="end">98</text>
  <line x1="282" y1="180" x2="282" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="196" y="210" width="172" height="44" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="282" y="238" font-family="monospace" font-size="18" fill="#333" text-anchor="middle">_id: 90, nb: 1</text>
  <text x="2" y="300" font-size="18" font-weight="bold" fill="#00684a">une étape de pipeline</text>
  <text x="2" y="324" font-size="18" fill="#555">elle ne change pas la base</text>
  <circle cx="408" cy="16" r="14" fill="#00684a"/><text x="408" y="22" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="430" y="23" font-size="20" font-weight="bold" fill="#333">le pattern Bucket <tspan font-size="18" font-weight="normal" fill="#777">(partie 4)</tspan></text>
  <text x="394" y="52" font-size="18" fill="#333">un document par entité et période</text>
  <text x="394" y="74" font-size="18" fill="#333">(un épisode, un jour) : ses mesures</text>
  <rect x="394" y="88" width="372" height="182" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="406" y="98" width="348" height="162" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="418" y="122" font-family="monospace" font-size="18" fill="#333">_id: <tspan font-weight="bold">"E1-2026-09-08"</tspan>,</text>
  <text x="418" y="146" font-family="monospace" font-size="18" fill="#333">episode: "E1",</text>
  <text x="418" y="170" font-family="monospace" font-size="18" fill="#333">jour: 2026-09-08,</text>
  <text x="418" y="194" font-family="monospace" font-size="18" fill="#333">mesures: [</text>
  <rect x="434" y="214" width="134" height="34" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="501" y="237" font-size="18" fill="#333" text-anchor="middle">0 h 10 · <tspan font-weight="bold">35</tspan></text>
  <rect x="580" y="214" width="134" height="34" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="647" y="237" font-size="18" fill="#333" text-anchor="middle">7 h 30 · <tspan font-weight="bold">52</tspan></text>
  <text x="726" y="237" font-family="monospace" font-size="18" fill="#333">]</text>
  <text x="394" y="300" font-size="18" font-weight="bold" fill="#b06f00">un modèle de données</text>
  <text x="394" y="324" font-size="18" fill="#555">que l'on écrit soi-même</text>
  <circle cx="800" cy="16" r="14" fill="#00684a"/><text x="800" y="22" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="822" y="23" font-size="20" font-weight="bold" fill="#333">les buckets internes <tspan font-size="18" font-weight="normal" fill="#777">(partie 5)</tspan></text>
  <text x="786" y="52" font-size="18" fill="#333">dans une collection time series,</text>
  <text x="786" y="74" font-size="18" fill="#333">MongoDB regroupe lui-même</text>
  <rect x="786" y="88" width="372" height="182" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="798" y="112" font-size="18" fill="#555">une mesure par document</text>
  <rect x="798" y="122" width="86" height="30" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="841" y="144" font-size="18" fill="#333" text-anchor="middle">E1 · 40</text>
  <rect x="894" y="122" width="86" height="30" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="937" y="144" font-size="18" fill="#333" text-anchor="middle">E1 · 35</text>
  <rect x="990" y="122" width="86" height="30" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="1033" y="144" font-size="18" fill="#333" text-anchor="middle">E1 · 52</text>
  <rect x="798" y="160" width="86" height="30" rx="6" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="841" y="182" font-size="18" fill="#333" text-anchor="middle">E4 · 18</text>
  <rect x="894" y="160" width="86" height="30" rx="6" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="937" y="182" font-size="18" fill="#333" text-anchor="middle">E4 · 21</text>
  <line x1="1116" y1="140" x2="1116" y2="196" stroke="#777" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#flg)"/>
  <rect x="798" y="204" width="348" height="54" rx="6" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="810" y="214" width="100" height="34" rx="5" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <rect x="920" y="214" width="72" height="34" rx="5" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <rect x="818" y="223" width="22" height="16" rx="2" fill="#e3eefa" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="848" y="223" width="22" height="16" rx="2" fill="#e3eefa" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="878" y="223" width="22" height="16" rx="2" fill="#e3eefa" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="928" y="223" width="22" height="16" rx="2" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="958" y="223" width="22" height="16" rx="2" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="1136" y="237" font-size="18" fill="#777" text-anchor="end">invisibles</text>
  <text x="786" y="300" font-size="18" font-weight="bold" fill="#555">un rangement du serveur</text>
  <text x="786" y="324" font-size="18" fill="#555">que l'on ne voit pas</text>
</svg>
