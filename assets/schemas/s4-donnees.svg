<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 396" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Les collections de la base tp3, un réseau de vélos en libre-service dans une ville inventée. stations, 24 documents : _id (ST01 à ST24), nom, quartier, capacite, stats (departs, arrivees, minutes). velos, 300 documents : _id, type (mecanique, electrique, cargo), batterie ou caisse selon le type, derniersTrajets (les 5 derniers). avis, 981 documents : station, auteur, note de 1 à 5, texte, date. trajets, 5 556 documents de la semaine du 2 au 8 novembre 2026 : velo, depart { station, t }, arrivee { station, t }, duree. releves, 16 128 documents : station, t, velos, places, un relevé toutes les 15 minutes. occupation, 168 documents : l'historique de la semaine précédente, un document par station et par jour. Les avis, les trajets et les relevés désignent leur station par son _id ; un trajet désigne son vélo par son _id.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>
  <rect x="2" y="2" width="372" height="150" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="16" y="32" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">velos</text>
  <text x="360" y="32" font-size="18" fill="#555" text-anchor="end">300 documents</text>
  <rect x="10" y="120" width="356" height="25" rx="5" fill="#fdf3e0"/>
  <text x="16" y="61" font-family="monospace" font-size="18" fill="#333">_id</text>
  <text x="16" y="87" font-family="monospace" font-size="18" fill="#333">type<tspan font-family="sans-serif" fill="#777">  mecanique, electrique, cargo</tspan></text>
  <text x="16" y="113" font-family="monospace" font-size="18" fill="#333">batterie<tspan font-family="sans-serif" fill="#555"> ou </tspan>caisse<tspan font-family="sans-serif" fill="#777">  selon le type</tspan></text>
  <text x="16" y="139" font-family="monospace" font-size="18" fill="#333">derniersTrajets: [ … ]<tspan font-family="sans-serif" fill="#777">  5 derniers</tspan></text>
  <rect x="384" y="2" width="434" height="150" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="398" y="32" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">stations</text>
  <text x="804" y="32" font-size="18" fill="#555" text-anchor="end">24 documents</text>
  <rect x="392" y="94" width="418" height="25" rx="5" fill="#e3eefa"/>
  <text x="398" y="61" font-family="monospace" font-size="18" fill="#333">_id: "ST01" … "ST24"</text>
  <text x="398" y="87" font-family="monospace" font-size="18" fill="#333">nom, quartier, capacite</text>
  <text x="398" y="113" font-family="monospace" font-size="18" fill="#333">stats: { departs, arrivees, minutes }</text>
  <rect x="828" y="2" width="330" height="150" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="842" y="32" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">occupation</text>
  <text x="1144" y="32" font-size="18" fill="#555" text-anchor="end">168 documents</text>
  <text x="842" y="61" font-size="18" fill="#555">la semaine précédente,</text>
  <text x="842" y="87" font-size="18" fill="#555">un par station et par jour</text>
  <text x="842" y="138" font-size="18" fill="#777">détaillé en partie 4</text>
  <rect x="2" y="206" width="404" height="150" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="16" y="236" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">trajets</text>
  <text x="392" y="236" font-size="18" fill="#555" text-anchor="end">5 556 documents</text>
  <rect x="10" y="272" width="250" height="25" rx="5" fill="#e3eefa"/>
  <rect x="10" y="298" width="250" height="25" rx="5" fill="#e3eefa"/>
  <text x="16" y="265" font-family="monospace" font-size="18" fill="#333">velo</text>
  <text x="16" y="291" font-family="monospace" font-size="18" fill="#333">depart: { station, t }</text>
  <text x="16" y="317" font-family="monospace" font-size="18" fill="#333">arrivee: { station, t }</text>
  <text x="16" y="343" font-family="monospace" font-size="18" fill="#333">duree</text>
  <text x="392" y="344" font-size="18" fill="#777" text-anchor="end">du 2 au 8 novembre</text>
  <rect x="416" y="206" width="330" height="150" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="430" y="236" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">avis</text>
  <text x="732" y="236" font-size="18" fill="#555" text-anchor="end">981 documents</text>
  <text x="430" y="265" font-family="monospace" font-size="18" fill="#333">station</text>
  <text x="430" y="291" font-family="monospace" font-size="18" fill="#333">auteur</text>
  <text x="430" y="317" font-family="monospace" font-size="18" fill="#333">note<tspan font-family="sans-serif" fill="#777">  de 1 à 5</tspan></text>
  <text x="430" y="343" font-family="monospace" font-size="18" fill="#333">texte, date</text>
  <rect x="756" y="206" width="402" height="150" rx="10" fill="#f0f4f8" stroke="#00684a" stroke-width="2.5"/>
  <text x="770" y="236" font-family="monospace" font-size="22" font-weight="bold" fill="#00684a">releves</text>
  <text x="1144" y="236" font-size="18" fill="#555" text-anchor="end">16 128 documents</text>
  <text x="770" y="265" font-family="monospace" font-size="18" fill="#333">station</text>
  <text x="770" y="291" font-family="monospace" font-size="18" fill="#333">t</text>
  <text x="770" y="317" font-family="monospace" font-size="18" fill="#333">velos, places</text>
  <text x="1144" y="344" font-size="18" fill="#777" text-anchor="end">toutes les 15 minutes</text>
  <g fill="none" stroke="#999" stroke-width="3" marker-end="url(#fl)">
    <line x1="120" y1="202" x2="120" y2="160" stroke-dasharray="6 4"/>
    <path d="M330,202 C330,182 470,186 470,160" stroke-dasharray="6 4"/>
    <line x1="600" y1="202" x2="600" y2="160" stroke-dasharray="6 4"/>
    <path d="M830,202 C830,182 740,186 740,160" stroke-dasharray="6 4"/>
  </g>
  <g font-family="monospace" font-size="18" fill="#777">
    <text x="108" y="186" text-anchor="end">velo</text>
    <text x="318" y="176" text-anchor="end">depart.station</text>
    <text x="318" y="198" text-anchor="end">arrivee.station</text>
    <text x="612" y="186">station</text>
    <text x="842" y="186">station</text>
  </g>
  <g font-size="18" fill="#555">
    <rect x="2" y="370" width="26" height="20" rx="4" fill="#e3eefa"/>
    <text x="36" y="386">document imbriqué</text>
    <rect x="220" y="370" width="26" height="20" rx="4" fill="#fdf3e0"/>
    <text x="254" y="386">tableau</text>
    <line x1="350" y1="380" x2="390" y2="380" stroke="#999" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="400" y="386">désigne une station ou un vélo par son <tspan font-family="monospace">_id</tspan></text>
  </g>
</svg>
