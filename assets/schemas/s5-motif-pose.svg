<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 250" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Un motif se pose sur le graphe. À gauche, le motif dessiné comme un gabarit en pointillés : un nœud ana dont le nom est Ana, une flèche SUIT, un nœud p qui peut être n'importe quelle personne. À droite, le graphe SUIT de l'exemple d'essai : Ana suit Bilal et Camille, Bilal et Camille suivent Dario, Dario suit Elif, Elif suit Farah. Le motif s'y pose deux fois : pose 1, Ana vers Bilal, en bleu ; pose 2, Ana vers Camille, en violet ; les autres relations sont grisées. Deux lignes sont renvoyées : p = Bilal et p = Camille.</title>
  <defs><marker id="fl-bleu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/></marker><marker id="fl-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6400"/></marker><marker id="fl-vert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00684a"/></marker><marker id="fl-rouge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="fl-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker><marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="fl-noir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="0" y="0" width="420" height="248" rx="8" fill="#ffffff" stroke="#b8c4cf" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="16" y="30" font-size="20" font-weight="bold" fill="#333">Le motif, un gabarit</text>
  <rect x="20" y="89" width="150" height="62" rx="14" fill="#fff" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="95" y="116" font-size="19" font-weight="bold" font-family="monospace" fill="#333" text-anchor="middle">ana</text>
  <text x="95" y="140" font-size="18" font-family="monospace" fill="#555" text-anchor="middle">nom: 'Ana'</text>
  <rect x="265" y="89" width="130" height="62" rx="14" fill="#fff" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="330" y="116" font-size="19" font-weight="bold" font-family="monospace" fill="#333" text-anchor="middle">p</text>
  <text x="330" y="140" font-size="18" font-family="monospace" fill="#555" text-anchor="middle">:Personne</text>
  <line x1="174" y1="120" x2="258" y2="120" stroke="#555" stroke-width="3" marker-end="url(#fl-noir)"/>
  <text x="216" y="108" font-size="18" font-weight="bold" fill="#555" text-anchor="middle">SUIT</text>
  <text x="16" y="200" font-size="18" fill="#555">Neo4j cherche toutes les façons</text>
  <text x="16" y="224" font-size="18" fill="#555">de le poser sur le graphe.</text>
  <rect x="440" y="0" width="720" height="248" rx="8" fill="#f7fafd" stroke="#b8c4cf" stroke-width="2"/>
  <rect x="455" y="88" width="100" height="44" rx="22.0" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="505" y="116.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Ana</text>
  <rect x="590" y="28" width="100" height="44" rx="22.0" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="640" y="56.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Bilal</text>
  <rect x="590" y="148" width="100" height="44" rx="22.0" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="640" y="176.65" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">Camille</text>
  <rect x="735" y="88" width="100" height="44" rx="22.0" fill="#f4f6f8" stroke="#b8c4cf" stroke-width="2.5"/>
  <text x="785" y="116.65" font-size="19" font-weight="bold" fill="#999" text-anchor="middle">Dario</text>
  <rect x="880" y="88" width="100" height="44" rx="22.0" fill="#f4f6f8" stroke="#b8c4cf" stroke-width="2.5"/>
  <text x="930" y="116.65" font-size="19" font-weight="bold" fill="#999" text-anchor="middle">Elif</text>
  <rect x="1030" y="88" width="100" height="44" rx="22.0" fill="#f4f6f8" stroke="#b8c4cf" stroke-width="2.5"/>
  <text x="1080" y="116.65" font-size="19" font-weight="bold" fill="#999" text-anchor="middle">Farah</text>
  <line x1="559" y1="86" x2="583" y2="75.3333" stroke="#2f6db0" stroke-width="4" marker-end="url(#fl-bleu)"/>
  <line x1="559" y1="134" x2="583" y2="144.667" stroke="#8e44ad" stroke-width="4" marker-end="url(#fl-violet)"/>
  <line x1="694" y1="72.3448" x2="728" y2="86.4138" stroke="#9aa5b1" stroke-width="2.5" marker-end="url(#fl-gris)"/>
  <line x1="694" y1="147.655" x2="728" y2="133.586" stroke="#9aa5b1" stroke-width="2.5" marker-end="url(#fl-gris)"/>
  <line x1="839" y1="110" x2="873" y2="110" stroke="#9aa5b1" stroke-width="2.5" marker-end="url(#fl-gris)"/>
  <line x1="984" y1="110" x2="1023" y2="110" stroke="#9aa5b1" stroke-width="2.5" marker-end="url(#fl-gris)"/>
  <text x="456" y="226" font-size="19" font-weight="bold" fill="#2f6db0">pose 1 : p = Bilal</text>
  <text x="676" y="226" font-size="19" font-weight="bold" fill="#8e44ad">pose 2 : p = Camille</text>
  <text x="930" y="226" font-size="19" font-weight="bold" fill="#333">2 poses, 2 lignes</text>
</svg>
