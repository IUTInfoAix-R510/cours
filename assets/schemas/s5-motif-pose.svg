<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Un motif se pose sur le graphe. À gauche, le motif dessiné comme un gabarit en pointillés : (ana:Personne {nom: 'Ana'})-[:SUIT]-&gt;(p:Personne), un nœud ana dont le nom est Ana, une flèche SUIT, un nœud p qui peut être n'importe quelle personne. À droite, le graphe SUIT de l'exemple d'essai : Ana suit Bilal et Camille, Bilal et Camille suivent Dario, Dario suit Elif, Elif suit Farah. Le motif s'y pose deux fois : pose 1, Ana vers Bilal, en bleu ; pose 2, Ana vers Camille, en violet ; les autres relations sont grisées. Deux lignes sont renvoyées : p = Bilal et p = Camille.</title>
  <defs>
    <marker id="fk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="fb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/></marker>
    <marker id="fp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8c0c8"/></marker>
  </defs>
  <rect x="2" y="2" width="420" height="366" rx="10" fill="#ffffff" stroke="#cfd8e0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#333">Le motif : un gabarit</text>
  <path d="M148,170 L266,170" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="8 6"/><path d="M257,170 L266,170" fill="none" stroke="#555" stroke-width="3" marker-end="url(#fk)"/>
  <text x="210" y="156" font-size="16" font-weight="bold" font-family="monospace" fill="#333" text-anchor="middle">SUIT</text>
  <g>
  <circle cx="100" cy="170" r="44" fill="#ffffff" stroke="#555" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="100" y="176.3" font-size="18" font-weight="bold" font-family="monospace" fill="#8e44ad" text-anchor="middle">ana</text>
  <text x="100" y="116" font-size="15" font-weight="bold" fill="#4a90d9" text-anchor="middle" letter-spacing="0.5">:Personne</text>
  </g>
  <g>
  <circle cx="320" cy="170" r="44" fill="#ffffff" stroke="#555" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="320" y="177" font-size="20" font-weight="bold" font-family="monospace" fill="#8e44ad" text-anchor="middle">p</text>
  <text x="320" y="116" font-size="15" font-weight="bold" fill="#4a90d9" text-anchor="middle" letter-spacing="0.5">:Personne</text>
  </g>
  <text x="100" y="238" font-size="15" font-family="monospace" fill="#333" text-anchor="middle">{nom: 'Ana'}</text>
  <text x="320" y="238" font-size="15" fill="#777" text-anchor="middle">n'importe qui</text>
  <text x="20" y="296" font-size="15" font-weight="bold" font-family="monospace" fill="#333">(<tspan fill="#8e44ad">ana</tspan>:Personne {nom: 'Ana'})</text>
  <text x="20" y="320" font-size="15" font-weight="bold" font-family="monospace" fill="#333">&#160;&#160;-[:SUIT]-&gt;(<tspan fill="#8e44ad">p</tspan>:Personne)</text>
  <text x="20" y="350" font-size="14" fill="#777">en violet : les variables</text>
  <text x="450" y="32" font-size="18" font-weight="bold" fill="#333">Le graphe : le motif se pose deux fois</text>
  <path d="M692.2,111.1 L773.3,151.7" fill="none" stroke="#b8c0c8" stroke-width="2.5" marker-end="url(#fg)"/>
  <path d="M692.2,228.9 L773.3,188.3" fill="none" stroke="#b8c0c8" stroke-width="2.5" marker-end="url(#fg)"/>
  <path d="M846,170 L919,170" fill="none" stroke="#b8c0c8" stroke-width="2.5" marker-end="url(#fg)"/>
  <path d="M996,170 L1069,170" fill="none" stroke="#b8c0c8" stroke-width="2.5" marker-end="url(#fg)"/>
  <path d="M542.2,153.9 L621.5,114.2" fill="none" stroke="#4a90d9" stroke-width="4.5" marker-end="url(#fb)"/>
  <path d="M542.2,186.1 L621.5,225.8" fill="none" stroke="#8e44ad" stroke-width="4.5" marker-end="url(#fp)"/>
  <text x="560" y="110" font-size="15" font-weight="bold" fill="#2a6db5" text-anchor="end">pose 1</text>
  <text x="560" y="244" font-size="15" font-weight="bold" fill="#8e44ad" text-anchor="end">pose 2</text>
  <g>
  <circle cx="510" cy="170" r="32" fill="#eaf2fb" stroke="#2c3e50" stroke-width="3.5"/>
  <text x="510" y="175.2" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Ana</text>
  </g>
  <g>
  <circle cx="660" cy="95" r="32" fill="#eaf2fb" stroke="#4a90d9" stroke-width="3.5"/>
  <text x="660" y="100.2" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Bilal</text>
  </g>
  <g>
  <circle cx="660" cy="245" r="32" fill="#ede5f7" stroke="#8e44ad" stroke-width="3.5"/>
  <text x="660" y="249.9" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Camille</text>
  </g>
  <g>
  <circle cx="810" cy="170" r="32" fill="#f4f5f6" stroke="#b8c0c8" stroke-width="2"/>
  <text x="810" y="175.2" font-size="15" font-weight="bold" fill="#999" text-anchor="middle">Dario</text>
  </g>
  <g>
  <circle cx="960" cy="170" r="32" fill="#f4f5f6" stroke="#b8c0c8" stroke-width="2"/>
  <text x="960" y="175.2" font-size="15" font-weight="bold" fill="#999" text-anchor="middle">Elif</text>
  </g>
  <g>
  <circle cx="1110" cy="170" r="32" fill="#f4f5f6" stroke="#b8c0c8" stroke-width="2"/>
  <text x="1110" y="175.2" font-size="15" font-weight="bold" fill="#999" text-anchor="middle">Farah</text>
  </g>
  <text x="450" y="336" font-size="16" font-weight="bold" fill="#333">deux lignes :</text>
  <rect x="560" y="312" width="150" height="36" rx="8" fill="#eaf2fb" stroke="#4a90d9" stroke-width="2"/>
  <text x="635" y="336" font-size="16" font-weight="bold" font-family="monospace" fill="#333" text-anchor="middle"><tspan fill="#8e44ad">p</tspan> = Bilal</text>
  <rect x="726" y="312" width="170" height="36" rx="8" fill="#ede5f7" stroke="#8e44ad" stroke-width="2"/>
  <text x="811" y="336" font-size="16" font-weight="bold" font-family="monospace" fill="#333" text-anchor="middle"><tspan fill="#8e44ad">p</tspan> = Camille</text>
</svg>
