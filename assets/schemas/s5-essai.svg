<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">L'exemple d'essai : 10 nœuds, 17 relations. À gauche, les six nœuds :Personne {nom, ville} et les six relations SUIT : Ana (Aix) suit Bilal (Marseille) et Camille (Aix) ; Bilal et Camille suivent Dario (Toulon) ; Dario suit Elif (Marseille) ; Elif suit Farah (Aix). À droite, les quatre nœuds :Jeu {titre, joueurs} et les onze relations AIME {note}, en tableau : Archipel (4 joueurs) est aimé par Ana (note 5), Bilal (4) et Elif (3) ; Comète (2 joueurs) par Ana (3), Camille (4) et Farah (5) ; Marée haute (5 joueurs) par Bilal (5), Dario (4) et Elif (4) ; Sortilège (3 joueurs) par Camille (5) et Dario (2).</title>
