<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">L'exemple d'essai : 10 nœuds, 17 relations. Six nœuds :Personne {nom, ville} : Ana (Aix), Bilal (Marseille), Camille (Aix), Dario (Toulon), Elif (Marseille), Farah (Aix). Quatre nœuds :Jeu {titre, joueurs} : Archipel (4 joueurs), Comète (2), Marée haute (5), Sortilège (3). Six relations SUIT, en bleu : Ana suit Bilal et Camille, Bilal et Camille suivent Dario, Dario suit Elif, Elif suit Farah. Onze relations AIME, en orange, avec une note : Ana aime Archipel (5) et Comète (3) ; Bilal aime Archipel (4) et Marée haute (5) ; Camille aime Comète (4) et Sortilège (5) ; Dario aime Marée haute (4) et Sortilège (2) ; Elif aime Archipel (3) et Marée haute (4) ; Farah aime Comète (5).</title>
