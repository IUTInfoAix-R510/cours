  <text x="402" y="206" font-family="monospace" font-size="18" font-weight="bold" fill="#2f6db0">2001</text>
  <rect x="458" y="166" width="294" height="32" rx="6" fill="#e3eefa"/>
  <text x="468" y="189" font-size="18" font-weight="bold" fill="#333">Chihiro</text>
  <text x="612" y="189" font-family="monospace" font-size="18" fill="#555" text-anchor="end">125</text>
  <rect x="458" y="202" width="294" height="32" rx="6" fill="#e3eefa"/>
  <text x="468" y="225" font-size="18" font-weight="bold" fill="#333">Amélie</text>
  <text x="612" y="225" font-family="monospace" font-size="18" fill="#555" text-anchor="end">122</text>
  <line x1="760" y1="150" x2="780" y2="150" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <circle cx="798" cy="20" r="15" fill="#00684a"/><text x="798" y="26" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="818" y="26" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">output: { rang: … }</text>
  <text x="818" y="52" font-size="18" fill="#555">$rank : le rang dans le groupe</text>
  <rect x="784" y="66" width="366" height="40" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="794" y="92" font-family="monospace" font-size="18" font-weight="bold" fill="#8e44ad">1995</text>
  <rect x="850" y="70" width="294" height="32" rx="6" fill="#f3e8f8"/>
  <text x="860" y="93" font-size="18" font-weight="bold" fill="#333">La Haine</text>
  <text x="1004" y="93" font-family="monospace" font-size="18" fill="#555" text-anchor="end">98</text>
