<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 276" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">$setWindowFields en trois temps sur les 4 films. 1, partitionBy: "$annee" : trois groupes, 1995 (La Haine), 2000 (Glaneurs), 2001 (Amélie et Chihiro, dans un ordre quelconque). 2, sortBy: { duree: -1 } : en 2001, Chihiro (125 min) passe avant Amélie (122 min). 3, output: { rang: { $rank: {} } } : chaque film reçoit son rang dans son groupe, La Haine 1, Glaneurs 1, Chihiro 1, Amélie 2. En SQL : RANK() OVER (PARTITION BY annee ORDER BY duree DESC).</title>
  <defs><marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <circle cx="14" cy="20" r="15" fill="#00684a"/><text x="14" y="26" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="34" y="26" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">partitionBy: "$annee"</text>
  <text x="34" y="52" font-size="18" fill="#555">un groupe par année</text>
  <rect x="0" y="66" width="366" height="40" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="10" y="92" font-family="monospace" font-size="18" font-weight="bold" fill="#8e44ad">1995</text>
  <rect x="66" y="70" width="294" height="32" rx="6" fill="#f3e8f8"/>
  <text x="76" y="93" font-size="18" font-weight="bold" fill="#333">La Haine</text>
  <text x="220" y="93" font-family="monospace" font-size="18" fill="#555" text-anchor="end">98</text>
  <rect x="0" y="114" width="366" height="40" rx="8" fill="#fff" stroke="#b06f00" stroke-width="2"/>
  <text x="10" y="140" font-family="monospace" font-size="18" font-weight="bold" fill="#b06f00">2000</text>
  <rect x="66" y="118" width="294" height="32" rx="6" fill="#fdf3e0"/>
  <text x="76" y="141" font-size="18" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="220" y="141" font-family="monospace" font-size="18" fill="#555" text-anchor="end">82</text>
  <rect x="0" y="162" width="366" height="76" rx="8" fill="#fff" stroke="#2f6db0" stroke-width="2"/>
  <text x="10" y="206" font-family="monospace" font-size="18" font-weight="bold" fill="#2f6db0">2001</text>
  <rect x="66" y="166" width="294" height="32" rx="6" fill="#e3eefa"/>
  <text x="76" y="189" font-size="18" font-weight="bold" fill="#333">Amélie</text>
  <text x="220" y="189" font-family="monospace" font-size="18" fill="#555" text-anchor="end">122</text>
  <rect x="66" y="202" width="294" height="32" rx="6" fill="#e3eefa"/>
  <text x="76" y="225" font-size="18" font-weight="bold" fill="#333">Chihiro</text>
  <text x="220" y="225" font-family="monospace" font-size="18" fill="#555" text-anchor="end">125</text>
  <line x1="368" y1="150" x2="388" y2="150" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <circle cx="406" cy="20" r="15" fill="#00684a"/><text x="406" y="26" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="426" y="26" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">sortBy: { duree: -1 }</text>
  <text x="426" y="52" font-size="18" fill="#555">durée décroissante</text>
  <rect x="392" y="66" width="366" height="40" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="402" y="92" font-family="monospace" font-size="18" font-weight="bold" fill="#8e44ad">1995</text>
  <rect x="458" y="70" width="294" height="32" rx="6" fill="#f3e8f8"/>
  <text x="468" y="93" font-size="18" font-weight="bold" fill="#333">La Haine</text>
  <text x="612" y="93" font-family="monospace" font-size="18" fill="#555" text-anchor="end">98</text>
  <rect x="392" y="114" width="366" height="40" rx="8" fill="#fff" stroke="#b06f00" stroke-width="2"/>
  <text x="402" y="140" font-family="monospace" font-size="18" font-weight="bold" fill="#b06f00">2000</text>
  <rect x="458" y="118" width="294" height="32" rx="6" fill="#fdf3e0"/>
  <text x="468" y="141" font-size="18" font-weight="bold" fill="#333">Glaneurs</text>
  <text x="612" y="141" font-family="monospace" font-size="18" fill="#555" text-anchor="end">82</text>
