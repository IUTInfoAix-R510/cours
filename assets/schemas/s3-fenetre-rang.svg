  <text x="1140" y="96" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="end">rang: 1</text>
  <rect x="798" y="122" width="360" height="46" rx="8" fill="#ffffff" stroke="#e8a838" stroke-width="2"/>
  <text x="808" y="151" font-family="monospace" font-size="15" font-weight="bold" fill="#e8a838">2000</text>
  <rect x="858" y="128" width="292" height="34" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
