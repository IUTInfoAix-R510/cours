  <text x="1004" y="141" font-family="monospace" font-size="18" fill="#555" text-anchor="end">82</text>
  <text x="1134" y="141" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="end">rang: 1</text>
  <rect x="784" y="162" width="366" height="76" rx="8" fill="#fff" stroke="#2f6db0" stroke-width="2"/>
