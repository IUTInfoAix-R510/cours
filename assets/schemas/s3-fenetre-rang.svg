  <text x="1004" y="189" font-family="monospace" font-size="18" fill="#555" text-anchor="end">125</text>
  <text x="1134" y="189" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="end">rang: 1</text>
  <rect x="850" y="202" width="294" height="32" rx="6" fill="#e3eefa"/>
  <text x="860" y="225" font-size="18" font-weight="bold" fill="#333">Amélie</text>
  <text x="1004" y="225" font-family="monospace" font-size="18" fill="#555" text-anchor="end">122</text>
  <text x="1134" y="225" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="end">rang: 2</text>
  <text x="580" y="268" font-size="18" fill="#555" text-anchor="middle">En SQL : <tspan font-family="monospace" fill="#333">RANK() OVER (PARTITION BY annee ORDER BY duree DESC)</tspan></text>
</svg>
