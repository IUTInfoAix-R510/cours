  <text x="1042" y="150" font-family="monospace" font-size="15" fill="#555" text-anchor="end">duree: 82</text>
  <text x="1140" y="150" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="end">rang: 1</text>
  <rect x="798" y="176" width="360" height="86" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="808" y="225" font-family="monospace" font-size="15" font-weight="bold" fill="#4a90d9">2001</text>
  <rect x="858" y="182" width="292" height="34" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="870" y="204" font-size="16" font-weight="bold" fill="#333">Chihiro</text>
  <text x="1042" y="204" font-family="monospace" font-size="15" fill="#555" text-anchor="end">duree: 125</text>
  <text x="1140" y="204" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="end">rang: 1</text>
  <rect x="858" y="222" width="292" height="34" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="870" y="244" font-size="16" font-weight="bold" fill="#333">Amélie</text>
  <text x="1042" y="244" font-family="monospace" font-size="15" fill="#555" text-anchor="end">duree: 122</text>
  <text x="1140" y="244" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="end">rang: 2</text>
  <line x1="367" y1="166" x2="390" y2="166" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <line x1="765" y1="166" x2="788" y2="166" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="580" y="294" font-size="16" fill="#555" text-anchor="middle">En SQL : <tspan font-family="monospace">RANK() OVER (PARTITION BY annee ORDER BY duree DESC)</tspan></text>
