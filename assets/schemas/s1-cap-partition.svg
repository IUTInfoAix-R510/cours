<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 230" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux copies de la même base, à Paris et à Marseille, séparées par une coupure réseau (partition). À Paris, Alice dit « j'emprunte Dune » : l'écriture est acceptée, Dune y a 0 exemplaire disponible. Marseille n'a pas reçu l'emprunt et affiche toujours 1 disponible ; Bob y demande « Dune est-il disponible ? » : que doit répondre Marseille ?</title>

  <!-- Paris -->
  <rect x="170" y="60" width="230" height="110" rx="14" fill="#e6f4ee" stroke="#13aa52" stroke-width="3"/>
  <text x="285" y="95" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Paris</text>
  <text x="285" y="130" text-anchor="middle" font-size="21" fill="#333">Dune : <tspan font-weight="bold" fill="#c0392b">0</tspan> disponible</text>
  <text x="285" y="158" text-anchor="middle" font-size="18" fill="#555">(Alice vient de l'emprunter)</text>

  <!-- Marseille -->
  <rect x="760" y="60" width="230" height="110" rx="14" fill="#e6f4ee" stroke="#13aa52" stroke-width="3"/>
  <text x="875" y="95" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">Marseille</text>
  <text x="875" y="130" text-anchor="middle" font-size="21" fill="#333">Dune : <tspan font-weight="bold">1</tspan> disponible</text>
  <text x="875" y="158" text-anchor="middle" font-size="18" fill="#555">(n'a pas reçu l'emprunt)</text>

  <!-- coupure réseau -->
  <line x1="405" y1="115" x2="755" y2="115" stroke="#999" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="580" y="103" text-anchor="middle" font-size="38" fill="#c0392b">✂</text>
  <text x="580" y="150" text-anchor="middle" font-size="18" fill="#c0392b">coupure réseau (partition)</text>

  <!-- requêtes -->
  <text x="285" y="35" text-anchor="middle" font-size="19" fill="#333">Alice : « j'emprunte Dune »</text>
  <text x="875" y="35" text-anchor="middle" font-size="19" fill="#333">Bob : « Dune est-il disponible ? »</text>
  <text x="285" y="215" text-anchor="middle" font-size="18" fill="#555">écriture acceptée</text>
  <text x="875" y="215" text-anchor="middle" font-size="18" fill="#555">que doit répondre Marseille ?</text>
</svg>
