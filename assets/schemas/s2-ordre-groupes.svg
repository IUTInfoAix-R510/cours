<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 286" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux exécutions du même pipeline sortent les groupes dans deux ordres différents ; un $sort final fixe l'ordre</title>
