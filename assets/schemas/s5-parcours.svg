<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 236" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Un parcours de longueur variable, (:Personne {nom: 'Ana'})-[:SUIT]-&gt;{1,3}(p), sur le graphe SUIT de l'exemple d'essai, une colonne par distance. Départ : Ana. 1 saut : Bilal et Camille, un chemin chacun. 2 sauts : Dario, atteint par deux chemins (par Bilal et par Camille), d'où la pastille ×2. 3 sauts : Elif, atteint par deux chemins, ×2. 4 sauts : Farah, en gris, hors de {1,3}. Une ligne par chemin : Bilal, Camille, Dario, Dario, Elif, Elif.</title>
