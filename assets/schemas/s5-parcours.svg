<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Un parcours de longueur variable, étape par étape : (:Personne {nom: 'Ana'})-[:SUIT]-&gt;{1,3}(p), sur le graphe SUIT de l'exemple d'essai (Ana suit Bilal et Camille, Bilal et Camille suivent Dario, Dario suit Elif, Elif suit Farah). Étape 1, 1 saut : Bilal et Camille sont atteints, par les chemins Ana→Bilal et Ana→Camille. Étape 2, 2 sauts : Dario est atteint par deux chemins, Ana→Bilal→Dario et Ana→Camille→Dario, d'où la pastille ×2. Étape 3, 3 sauts : Elif est atteint par deux chemins, Ana→Bilal→Dario→Elif et Ana→Camille→Dario→Elif, ×2. Farah, à 4 sauts, reste gris : hors de {1,3}. Les lignes renvoyées (nom, sauts) : Bilal 1, Camille 1, Dario 2, Dario 2, Elif 3, Elif 3. Un chemin par ligne : Dario et Elif sortent deux fois.</title>
