  <text x="44" y="120" font-size="15" font-family="monospace" fill="#333">_id: 'L06', titre: 'Dune', annee: 1965, …</text>
  <rect x="40" y="132" width="500" height="28" rx="6" fill="#eaf2fb" stroke="#4a90d9" stroke-width="1.5"/>
