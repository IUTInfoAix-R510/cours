<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 656" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">La médiathèque du TP1 dans les deux modèles. À gauche, TP1, modèle document : un document de la collection livres, L06 Dune, avec trois tableaux imbriqués, auteurs [ {id, prenom, nom} ], exemplaires [ {code: 'L06-1', …}, … ] et avis [ {membre_id, note}, … ] ; un document de la collection membres, M01 Marie Dupont, avec le tableau imbriqué emprunts [ {exemplaire: 'L06-1', livre_id: 'L06', titre: 'Dune', date_emprunt, date_retour_prevue, date_retour}, … ], où le titre est recopié du livre (surligné en orange), et la référence parrain_id vers un autre membre (surlignée en orange ; chez un filleul de Marie, parrain_id vaut 'M01'). À droite, TP4, modèle graphe : 26 nœuds :Livre, 43 :Exemplaire, 14 :Membre, 18 :Auteur et 11 :Categorie. Relations : (:Exemplaire)-[:DE]-&gt;(:Livre) ; (:Livre)-[:ECRIT_PAR]-&gt;(:Auteur) ; (:Livre)-[:DANS]-&gt;(:Categorie) ; (:Categorie)-[:SOUS_CATEGORIE_DE]-&gt;(:Categorie), en boucle ; (:Livre)-[:SUITE_DE]-&gt;(:Livre), en boucle ; (:Membre)-[:EMPRUNTE {date_emprunt, date_retour_prevue, date_retour}]-&gt;(:Exemplaire), 48 emprunts ; (:Membre)-[:PARRAINE]-&gt;(:Membre), en boucle, 7 parrainages ; (:Membre)-[:A_NOTE {note}]-&gt;(:Livre), 36 avis. En bas : mêmes identifiants (L06, M13…) : un emprunt est une relation, pas une copie.</title>
  <defs>
    <marker id="fp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker>
    <marker id="fo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a838"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d7e"/></marker>
  </defs>
  <text x="20" y="34" font-size="21" font-weight="bold" fill="#00684a">TP1, modèle document</text>
  <text x="600" y="34" font-size="21" font-weight="bold" fill="#00684a">TP4, modèle graphe</text>
