  <text x="50" y="372" font-size="15" font-family="monospace" fill="#333">emprunts: [ {exemplaire: 'L06-1', livre_id: 'L06',</text>
  <rect x="160" y="380" width="128" height="26" rx="5" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="167" y="398" font-size="15" font-weight="bold" font-family="monospace" fill="#b06f00">titre: 'Dune'</text>
  <text x="298" y="398" font-size="15" font-weight="bold" fill="#b06f00">← recopié du livre</text>
  <text x="167" y="424" font-size="15" font-family="monospace" fill="#333">date_emprunt, date_retour_prevue,</text>
  <text x="167" y="448" font-size="15" font-family="monospace" fill="#333">date_retour }, … ]</text>
  <rect x="40" y="484" width="164" height="28" rx="5" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="50" y="504" font-size="15" font-weight="bold" font-family="monospace" fill="#b06f00">parrain_id: 'M…'</text>
  <text x="214" y="504" font-size="15" font-weight="bold" fill="#b06f00">← référence vers un autre membre</text>
  <text x="214" y="526" font-size="14" fill="#555">(chez un filleul de Marie : parrain_id: 'M01')</text>
  <path d="M690,394 L690,228" fill="none" stroke="#8e44ad" stroke-width="3" marker-end="url(#fp)"/>
  <text x="704" y="268" font-size="15" font-weight="bold" font-family="monospace" fill="#8e44ad">EMPRUNTE</text>
  <text x="784" y="268" font-size="15" font-weight="bold" fill="#8e44ad">· 48</text>
  <text x="704" y="290" font-size="14" font-family="monospace" fill="#333">{date_emprunt,</text>
