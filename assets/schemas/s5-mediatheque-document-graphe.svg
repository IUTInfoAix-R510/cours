  <text x="842" y="214" font-size="15" font-weight="bold" font-family="monospace" fill="#2c3e50">DE</text>
  <path d="M993.9,266.1 L1084.6,175.4" fill="none" stroke="#e8a838" stroke-width="3" marker-end="url(#fo)"/>
  <text x="1054" y="236" font-size="15" font-weight="bold" font-family="monospace" fill="#b06f00">ECRIT_PAR</text>
  <path d="M995.5,332.4 L1083.1,412.3" fill="none" stroke="#e8a838" stroke-width="3" marker-end="url(#fo)"/>
  <text x="1066" y="362" font-size="15" font-weight="bold" font-family="monospace" fill="#b06f00">DANS</text>
  <path d="M939.7,256.5 C892.4,155 1027.6,155 982.8,251.1" fill="none" stroke="#e8a838" stroke-width="3" marker-end="url(#fo)"/>
  <text x="960" y="166" font-size="15" font-weight="bold" font-family="monospace" fill="#b06f00" text-anchor="middle">SUITE_DE</text>
  <path d="M1101.4,485.9 C1060.8,572.9 1179.2,572.9 1141.1,491.3" fill="none" stroke="#5d6d7e" stroke-width="3" marker-end="url(#fg)"/>
  <text x="1080" y="548" font-size="15" font-weight="bold" font-family="monospace" fill="#5d6d7e" text-anchor="end">SOUS_CATEGORIE_DE</text>
