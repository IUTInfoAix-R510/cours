<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 226" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">$push avec $each, $sort et $slice, en trois temps, sur l'épisode E3, qui n'a pas encore de champ derniersCommentaires ($push le crée). 1, $each ajoute les trois nouveaux éléments : lou (21 septembre 8 h), sam (23 septembre 19 h 30), zoe (22 septembre 12 h 15). 2, $sort: { date: -1 } trie tout le tableau du plus récent au plus ancien : sam, zoe, lou. 3, $slice: 2 garde les 2 premiers : sam, zoe ; lou disparaît du tableau, pas de la collection commentaires.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- en-têtes -->
  <text x="2" y="22" font-size="16" font-weight="bold" fill="#555">E3, avant</text>
  <circle cx="230" cy="16" r="12" fill="#00684a"/>
  <text x="230" y="22" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="250" y="22" font-size="16" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#00684a">$each</tspan> : ajouter</text>
  <circle cx="556" cy="16" r="12" fill="#00684a"/>
  <text x="556" y="22" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="576" y="22" font-family="monospace" font-size="16" fill="#333"><tspan font-weight="bold" fill="#00684a">$sort</tspan>: { date: -1 }</text>
  <circle cx="882" cy="16" r="12" fill="#00684a"/>
  <text x="882" y="22" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="902" y="22" font-family="monospace" font-size="16" fill="#333"><tspan font-weight="bold" fill="#00684a">$slice</tspan>: 2</text>

  <!-- colonne 0 : le champ absent -->
  <rect x="2" y="36" width="180" height="132" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="92" y="64" font-family="monospace" font-size="14" fill="#333" text-anchor="middle">derniersCommentaires</text>
  <rect x="62" y="80" width="60" height="40" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="92" y="107" font-family="monospace" font-size="18" fill="#c0392b" text-anchor="middle">—</text>
  <text x="92" y="150" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">champ absent</text>

  <line x1="186" y1="102" x2="206" y2="102" stroke="#555" stroke-width="3" marker-end="url(#fl)"/>

  <!-- colonne 1 : $each ajoute -->
  <rect x="216" y="36" width="290" height="132" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <g stroke="#e8a838" stroke-width="2" fill="#fdf3e0">
    <rect x="226" y="46" width="270" height="32" rx="6"/>
    <rect x="226" y="86" width="270" height="32" rx="6"/>
    <rect x="226" y="126" width="270" height="32" rx="6"/>
  </g>
  <g font-family="monospace" font-size="16" font-weight="bold" fill="#333">
    <text x="240" y="68">lou</text>
    <text x="240" y="108">sam</text>
    <text x="240" y="148">zoe</text>
  </g>
  <g font-size="15" fill="#555" text-anchor="end">
    <text x="484" y="67">21 sept., 8 h 00</text>
    <text x="484" y="107">23 sept., 19 h 30</text>
    <text x="484" y="147">22 sept., 12 h 15</text>
  </g>

  <line x1="510" y1="102" x2="532" y2="102" stroke="#555" stroke-width="3" marker-end="url(#fl)"/>

  <!-- colonne 2 : $sort trie -->
  <rect x="542" y="36" width="290" height="132" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <g stroke="#e8a838" stroke-width="2" fill="#fdf3e0">
    <rect x="552" y="46" width="270" height="32" rx="6"/>
    <rect x="552" y="86" width="270" height="32" rx="6"/>
    <rect x="552" y="126" width="270" height="32" rx="6"/>
  </g>
  <g font-family="monospace" font-size="16" font-weight="bold" fill="#333">
    <text x="566" y="68">sam</text>
    <text x="566" y="108">zoe</text>
    <text x="566" y="148">lou</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="end">
    <text x="810" y="67">23 sept., 19 h 30</text>
    <text x="810" y="107">22 sept., 12 h 15</text>
    <text x="810" y="147">21 sept., 8 h 00</text>
  </g>

  <line x1="836" y1="102" x2="858" y2="102" stroke="#555" stroke-width="3" marker-end="url(#fl)"/>

  <!-- colonne 3 : $slice coupe -->
  <rect x="868" y="36" width="290" height="132" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <g stroke="#13aa52" stroke-width="2" fill="#e6f4ee">
    <rect x="878" y="46" width="270" height="32" rx="6"/>
    <rect x="878" y="86" width="270" height="32" rx="6"/>
  </g>
  <g font-family="monospace" font-size="16" font-weight="bold" fill="#333">
    <text x="892" y="68">sam</text>
    <text x="892" y="108">zoe</text>
  </g>
  <g font-size="15" fill="#555" text-anchor="end">
    <text x="1136" y="67">23 sept., 19 h 30</text>
    <text x="1136" y="107">22 sept., 12 h 15</text>
  </g>
  <line x1="872" y1="122" x2="1154" y2="122" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="878" y="128" width="270" height="30" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="892" y="149" font-family="monospace" font-size="16" fill="#777" text-decoration="line-through">lou</text>
  <text x="1136" y="148" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="end">retiré du tableau</text>

  <!-- légendes des colonnes -->
  <g font-size="15" fill="#555">
    <text x="216" y="194">ajoute les 3 nouveaux éléments,</text>
    <text x="216" y="214">dans l'ordre donné</text>
    <text x="542" y="194">trie tout le tableau,</text>
    <text x="542" y="214">du plus récent au plus ancien</text>
    <text x="868" y="194">garde les 2 premiers ;</text>
    <text x="868" y="214">lou quitte le tableau, pas la base</text>
  </g>
</svg>
