<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 262" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">$push avec $each, $sort et $slice, en trois temps, sur l'épisode E3, qui n'a pas encore de champ derniersCommentaires ($push le crée). 1, $each ajoute les trois nouveaux éléments, dans l'ordre donné : lou (21 septembre, 8 h), sam (23 septembre, 19 h 30), zoe (22 septembre, 12 h 15). 2, $sort: { date: -1 } trie tout le tableau du plus récent au plus ancien : sam, zoe, lou. 3, $slice: 2 garde les 2 premiers : sam et zoe ; lou quitte le tableau, pas la collection commentaires.</title>
  <defs><marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="2" y="26" font-size="19" font-weight="bold" fill="#333">E3, avant</text>
  <rect x="2" y="40" width="160" height="156" rx="8" fill="#f0f4f8" stroke="#b7c2cc" stroke-width="2"/>
  <rect x="34" y="72" width="96" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="82" y="105" font-size="20" fill="#c0392b" text-anchor="middle">—</text>
  <text x="82" y="160" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">champ</text>
  <text x="82" y="182" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">absent</text>
  <line x1="166" y1="118" x2="186" y2="118" stroke="#555" stroke-width="3" marker-end="url(#fl)"/>
  <line x1="500" y1="118" x2="518" y2="118" stroke="#555" stroke-width="3" marker-end="url(#fl)"/>
  <line x1="830" y1="118" x2="848" y2="118" stroke="#555" stroke-width="3" marker-end="url(#fl)"/>
  <circle cx="210" cy="19" r="14" fill="#00684a"/><text x="210" y="25" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="232" y="26" font-size="19" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#00684a">$each</tspan><tspan font-family="monospace"> : ajouter</tspan></text>
  <rect x="196" y="40" width="300" height="156" rx="8" fill="#f0f4f8" stroke="#b7c2cc" stroke-width="2"/>
  <rect x="208" y="50" width="276" height="40" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="222" y="77" font-family="monospace" font-size="19" font-weight="bold" fill="#333">lou</text>
  <text x="470" y="77" font-size="18" fill="#444" text-anchor="end">21 sept., 8 h 00</text>
  <rect x="208" y="98" width="276" height="40" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="222" y="125" font-family="monospace" font-size="19" font-weight="bold" fill="#333">sam</text>
  <text x="470" y="125" font-size="18" fill="#444" text-anchor="end">23 sept., 19 h 30</text>
  <rect x="208" y="146" width="276" height="40" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="222" y="173" font-family="monospace" font-size="19" font-weight="bold" fill="#333">zoe</text>
  <text x="470" y="173" font-size="18" fill="#444" text-anchor="end">22 sept., 12 h 15</text>
  <text x="196" y="226" font-size="18" fill="#444">ajoute les 3 éléments,</text>
  <text x="196" y="250" font-size="18" fill="#444">dans l'ordre donné</text>
  <circle cx="540" cy="19" r="14" fill="#00684a"/><text x="540" y="25" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="562" y="26" font-size="19" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#00684a">$sort</tspan><tspan font-family="monospace">: { date: -1 }</tspan></text>
  <rect x="526" y="40" width="300" height="156" rx="8" fill="#f0f4f8" stroke="#b7c2cc" stroke-width="2"/>
  <rect x="538" y="50" width="276" height="40" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="552" y="77" font-family="monospace" font-size="19" font-weight="bold" fill="#333">sam</text>
  <text x="800" y="77" font-size="18" font-weight="bold" fill="#444" text-anchor="end">23 sept., 19 h 30</text>
  <rect x="538" y="98" width="276" height="40" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="552" y="125" font-family="monospace" font-size="19" font-weight="bold" fill="#333">zoe</text>
  <text x="800" y="125" font-size="18" font-weight="bold" fill="#444" text-anchor="end">22 sept., 12 h 15</text>
  <rect x="538" y="146" width="276" height="40" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="552" y="173" font-family="monospace" font-size="19" font-weight="bold" fill="#333">lou</text>
  <text x="800" y="173" font-size="18" font-weight="bold" fill="#444" text-anchor="end">21 sept., 8 h 00</text>
  <text x="526" y="226" font-size="18" fill="#444">trie tout le tableau,</text>
  <text x="526" y="250" font-size="18" fill="#444">du plus récent au plus ancien</text>
  <circle cx="870" cy="19" r="14" fill="#00684a"/><text x="870" y="25" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="892" y="26" font-size="19" fill="#333"><tspan font-family="monospace" font-weight="bold" fill="#00684a">$slice</tspan><tspan font-family="monospace">: 2</tspan></text>
  <rect x="856" y="40" width="300" height="156" rx="8" fill="#f0f4f8" stroke="#b7c2cc" stroke-width="2"/>
  <rect x="868" y="50" width="276" height="40" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="882" y="77" font-family="monospace" font-size="19" font-weight="bold" fill="#333">sam</text>
  <text x="1130" y="77" font-size="18" fill="#444" text-anchor="end">23 sept., 19 h 30</text>
  <rect x="868" y="98" width="276" height="40" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="882" y="125" font-family="monospace" font-size="19" font-weight="bold" fill="#333">zoe</text>
  <text x="1130" y="125" font-size="18" fill="#444" text-anchor="end">22 sept., 12 h 15</text>
  <line x1="862" y1="142" x2="1150" y2="142" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="868" y="146" width="276" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="882" y="173" font-family="monospace" font-size="19" font-weight="bold" fill="#999" text-decoration="line-through">lou</text>
  <text x="1130" y="173" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="end">retiré du tableau</text>
  <text x="856" y="226" font-size="18" fill="#444">garde les 2 premiers :</text>
  <text x="856" y="250" font-size="18" fill="#444">lou quitte le tableau</text>
</svg>
