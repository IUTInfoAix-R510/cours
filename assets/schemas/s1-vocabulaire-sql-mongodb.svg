<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">À gauche, la table SQL films : colonnes id, titre et duree ; ligne F06 Le Dîner de cons avec duree à NULL, ligne F03 La Haine avec duree 98. À droite, la collection films : le document du Dîner de cons, à l'_id généré, n'a pas de champ duree ; le document F03 a duree: 98. Correspondances : table → collection, ligne → document, colonne → champ, clé primaire → _id.</title>

  <!-- ===== SQL : table ===== -->
  <text x="10" y="28" font-size="22" fill="#555">SQL : <tspan font-weight="bold" fill="#00684a">table films</tspan></text>

  <!-- en-tête -->
  <rect x="10" y="44" width="70" height="40" fill="#dbe9f7" stroke="#4a90d9" stroke-width="2"/>
  <text x="45" y="71" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f6db0">id</text>
  <rect x="80" y="44" width="220" height="40" fill="#f0f4f8" stroke="#999" stroke-width="2"/>
  <text x="190" y="71" text-anchor="middle" font-size="20" font-weight="bold" fill="#555">titre</text>
  <rect x="300" y="44" width="110" height="40" fill="#fff4dc" stroke="#e8a838" stroke-width="2"/>
  <text x="355" y="71" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a6400">duree</text>

  <!-- ligne du Dîner de cons (surlignée) -->
  <rect x="10" y="84" width="400" height="40" fill="#e6f4ee"/>
  <text x="45" y="111" text-anchor="middle" font-size="20">F06</text>
  <text x="190" y="111" text-anchor="middle" font-size="20">Le Dîner de cons</text>
  <text x="355" y="111" text-anchor="middle" font-size="20" font-style="italic" fill="#c0392b" font-weight="bold">NULL</text>
  <!-- ligne F03 -->
  <text x="45" y="151" text-anchor="middle" font-size="20">F03</text>
  <text x="190" y="151" text-anchor="middle" font-size="20">La Haine</text>
  <text x="355" y="151" text-anchor="middle" font-size="20">98</text>
  <!-- grille -->
  <rect x="10" y="44" width="400" height="120" fill="none" stroke="#999" stroke-width="2"/>
  <line x1="10" y1="124" x2="410" y2="124" stroke="#999" stroke-width="1.5"/>
  <line x1="80" y1="84" x2="80" y2="164" stroke="#999" stroke-width="1.5"/>
  <line x1="300" y1="84" x2="300" y2="164" stroke="#999" stroke-width="1.5"/>
  <!-- contours colorés par-dessus la grille -->
  <rect x="10" y="84" width="400" height="40" fill="none" stroke="#13aa52" stroke-width="4"/>
  <rect x="300" y="44" width="110" height="120" fill="none" stroke="#e8a838" stroke-width="3"/>
  <rect x="10" y="44" width="70" height="120" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="10" y="196" font-size="19" fill="#555">la colonne existe toujours :</text>
  <text x="10" y="222" font-size="19" fill="#555">une valeur inconnue vaut <tspan font-style="italic" fill="#c0392b" font-weight="bold">NULL</tspan></text>

  <!-- ===== Correspondances ===== -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <text x="527" y="28" fill="#00684a">table → collection</text>
    <text x="527" y="111" fill="#13aa52">ligne → document</text>
    <text x="527" y="166" fill="#9a6400">colonne → champ</text>
    <text x="527" y="221" fill="#2f6db0">clé primaire → <tspan font-family="monospace">_id</tspan></text>
  </g>
  <line x1="418" y1="104" x2="436" y2="104" stroke="#13aa52" stroke-width="3"/>
  <line x1="618" y1="104" x2="640" y2="104" stroke="#13aa52" stroke-width="3"/>

  <!-- ===== MongoDB : collection ===== -->
  <text x="650" y="28" font-size="22" fill="#555">MongoDB : <tspan font-weight="bold" fill="#00684a">collection films</tspan></text>

  <!-- document du Dîner de cons -->
  <rect x="650" y="44" width="445" height="112" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="4"/>
  <text x="664" y="76" font-family="monospace" font-size="19">{ <tspan fill="#2f6db0" font-weight="bold">_id</tspan>: ObjectId(…),</text>
  <text x="686" y="104" font-family="monospace" font-size="19">titre: "Le Dîner de cons" }</text>
  <text x="664" y="140" font-family="monospace" font-size="19" font-style="italic" fill="#c0392b" font-weight="bold">// pas de champ duree</text>

  <!-- document F03 -->
  <rect x="650" y="168" width="445" height="76" rx="10" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <text x="664" y="199" font-family="monospace" font-size="19">{ <tspan fill="#2f6db0" font-weight="bold">_id</tspan>: "F03", titre: "La Haine",</text>
  <text x="686" y="227" font-family="monospace" font-size="19"><tspan fill="#9a6400" font-weight="bold">duree</tspan>: 98 }</text>
</svg>
