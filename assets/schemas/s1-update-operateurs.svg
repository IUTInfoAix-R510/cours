<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 266" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Avant et après chaque opérateur. Les Glaneurs et la Glaneuse, $set: { langue: "français" } : aucun champ langue avant, langue: "français" après. Totoro, $inc: { diffusions: 1 } : aucun champ diffusions avant, diffusions: 1 après. Amélie, $push: { prix: "César" } : aucun champ prix avant, prix: ["César"] après. Chihiro, $pull: { genres: "fantastique" } : genres: ["animation", "fantastique"] avant, genres: ["animation"] après. La Haine, $unset: { langue: "" } : langue: "français" avant, aucun champ langue après.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <g font-size="19" font-weight="bold" fill="#00684a">
    <text x="10" y="22">film</text>
    <text x="98" y="22">opération</text>
    <text x="463" y="22">avant</text>
    <text x="906" y="22">après</text>
  </g>
  <text x="10" y="60" font-size="18" fill="#555">Glaneurs</text>
  <text x="98" y="60" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold" fill="#00684a">$set:</tspan> { langue: "français" }</text>
  <rect x="453" y="34" width="410" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="463" y="60" font-size="18" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">langue</tspan></text>
  <line x1="868" y1="53" x2="887.6" y2="53" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="898" y="34" width="242" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="904" y="60" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">langue: "français"</text>
  <text x="10" y="106" font-size="18" fill="#555">Totoro</text>
  <text x="98" y="106" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold" fill="#00684a">$inc:</tspan> { diffusions: 1 }</text>
  <rect x="453" y="80" width="410" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="463" y="106" font-size="18" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">diffusions</tspan></text>
  <line x1="868" y1="99" x2="887.6" y2="99" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="898" y="80" width="242" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="904" y="106" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">diffusions: 1</text>
  <text x="10" y="152" font-size="18" fill="#555">Amélie</text>
  <text x="98" y="152" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold" fill="#00684a">$push:</tspan> { prix: "César" }</text>
  <rect x="453" y="126" width="410" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="463" y="152" font-size="18" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">prix</tspan></text>
  <line x1="868" y1="145" x2="887.6" y2="145" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="898" y="126" width="242" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="904" y="152" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">prix: ["César"]</text>
  <text x="10" y="198" font-size="18" fill="#555">Chihiro</text>
  <text x="98" y="198" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold" fill="#00684a">$pull:</tspan> { genres: "fantastique" }</text>
  <rect x="453" y="172" width="410" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="463" y="198" font-family="monospace" font-size="18" fill="#333">genres: ["animation", "fantastique"]</text>
  <line x1="712.3" y1="192" x2="831.6" y2="192" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="868" y1="191" x2="887.6" y2="191" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="898" y="172" width="242" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="904" y="198" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">genres: ["animation"]</text>
  <text x="10" y="244" font-size="18" fill="#555">La Haine</text>
  <text x="98" y="244" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold" fill="#00684a">$unset:</tspan> { langue: "" }</text>
  <rect x="453" y="218" width="410" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="463" y="244" font-family="monospace" font-size="18" fill="#333">langue: "français"</text>
  <line x1="462.0" y1="238" x2="658.1" y2="238" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="868" y1="237" x2="887.6" y2="237" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="898" y="218" width="242" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="906" y="244" font-size="18" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">langue</tspan></text>
</svg>
