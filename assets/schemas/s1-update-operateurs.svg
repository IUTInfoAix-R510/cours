<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 266" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Avant et après chaque opérateur. La Haine, $set: { pays: "France" } : aucun champ pays avant, pays: "France" après. Totoro, $inc: { diffusions: 1 } : aucun champ diffusions avant, diffusions: 1 après. Parasite, $push: { prix: "Palme d'or" } : aucun champ prix avant, prix: ["Palme d'or"] après. Chihiro, $pull: { genres: "fantastique" } : genres: ["animation", "fantastique"] avant, genres: ["animation"] après. La Haine, $unset: { pays: "" } : pays: "France" avant, aucun champ pays après.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <g font-size="18" font-weight="bold" fill="#00684a">
    <text x="10" y="22">film</text>
    <text x="100" y="22">opération</text>
    <text x="450" y="22">avant</text>
    <text x="884" y="22">après</text>
  </g>
  <text x="10" y="60" font-size="17" fill="#555">La Haine</text>
  <text x="100" y="60" font-family="monospace" font-size="17" fill="#333"><tspan font-weight="bold" fill="#00684a">$set:</tspan> { pays: "France" }</text>
  <rect x="440" y="34" width="390" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="60" font-size="17" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">pays</tspan></text>
  <line x1="836" y1="53" x2="868" y2="53" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="874" y="34" width="240" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="884" y="60" font-family="monospace" font-size="17" font-weight="bold" fill="#00684a">pays: "France"</text>
  <text x="10" y="106" font-size="17" fill="#555">Totoro</text>
  <text x="100" y="106" font-family="monospace" font-size="17" fill="#333"><tspan font-weight="bold" fill="#00684a">$inc:</tspan> { diffusions: 1 }</text>
  <rect x="440" y="80" width="390" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="106" font-size="17" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">diffusions</tspan></text>
  <line x1="836" y1="99" x2="868" y2="99" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="874" y="80" width="240" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="884" y="106" font-family="monospace" font-size="17" font-weight="bold" fill="#00684a">diffusions: 1</text>
  <text x="10" y="152" font-size="17" fill="#555">Parasite</text>
  <text x="100" y="152" font-family="monospace" font-size="17" fill="#333"><tspan font-weight="bold" fill="#00684a">$push:</tspan> { prix: "Palme d'or" }</text>
  <rect x="440" y="126" width="390" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="152" font-size="17" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">prix</tspan></text>
  <line x1="836" y1="145" x2="868" y2="145" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="874" y="126" width="240" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="884" y="152" font-family="monospace" font-size="17" font-weight="bold" fill="#00684a">prix: ["Palme d'or"]</text>
  <text x="10" y="198" font-size="17" fill="#555">Chihiro</text>
  <text x="100" y="198" font-family="monospace" font-size="17" fill="#333"><tspan font-weight="bold" fill="#00684a">$pull:</tspan> { genres: "fantastique" }</text>
  <rect x="440" y="172" width="390" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="198" font-family="monospace" font-size="17" fill="#333">genres: ["animation", "fantastique"]</text>
  <line x1="684.4" y1="192" x2="799.0" y2="192" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="836" y1="191" x2="868" y2="191" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="874" y="172" width="240" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="884" y="198" font-family="monospace" font-size="17" font-weight="bold" fill="#00684a">genres: ["animation"]</text>
  <text x="10" y="244" font-size="17" fill="#555">La Haine</text>
  <text x="100" y="244" font-family="monospace" font-size="17" fill="#333"><tspan font-weight="bold" fill="#00684a">$unset:</tspan> { pays: "" }</text>
  <rect x="440" y="218" width="390" height="38" rx="7" fill="#f0f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450" y="244" font-family="monospace" font-size="17" fill="#333">pays: "France"</text>
  <line x1="449.0" y1="238" x2="594.3" y2="238" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="836" y1="237" x2="868" y2="237" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <rect x="874" y="218" width="240" height="38" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="884" y="244" font-size="17" font-style="italic" fill="#777">aucun champ <tspan font-family="monospace" font-style="normal">pays</tspan></text>
</svg>
