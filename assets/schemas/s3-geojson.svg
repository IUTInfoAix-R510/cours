<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 346" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Décrire un lieu en GeoJSON, sur les lieux inventés d'Aix-en-Provence. À gauche, une carte : la longitude en abscisse (x, est-ouest), la latitude en ordonnée (y, nord-sud). La zone Centre est un rectangle, de longitude 5.440 à 5.455 et de latitude 43.525 à 43.535, dont les coins sont numérotés de 1 à 4 dans l'ordre du contour. La Mairie (5.4474, 43.5297) est dedans ; la Gare (5.4458, 43.5236) juste au sud ; l'IUT (5.4401, 43.5141) plus au sud. À droite, les documents. Collection lieux : { nom: "Mairie", position: { type: "Point", coordinates: [5.4474, 43.5297] } }, la longitude d'abord. Collection zones : { nom: "Centre", contour: { type: "Polygon", coordinates: [ [ [5.440, 43.525], [5.455, 43.525], [5.455, 43.535], [5.440, 43.535], [5.440, 43.525] ] ] } } : une liste d'anneaux ; le cinquième point répète le premier, l'anneau se referme.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="96" y1="296" x2="510" y2="296" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <line x1="96" y1="297" x2="96" y2="22" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="108" y="24" font-size="18" fill="#8e44ad" font-weight="bold">latitude (y)</text>
  <text x="510" y="342" font-size="18" fill="#b06f00" font-weight="bold" text-anchor="end">longitude (x)</text>
  <g font-family="monospace" font-size="18" fill="#555">
    <text x="164" y="320" text-anchor="middle">5.440</text>
    <text x="444" y="320" text-anchor="middle">5.455</text>
    <text x="88" y="74" text-anchor="end">43.535</text>
    <text x="88" y="167" text-anchor="end">43.525</text>
  </g>
  <g stroke="#b8c4cf" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="164" y1="161" x2="164" y2="296"/>
    <line x1="444" y1="161" x2="444" y2="296"/>
    <line x1="96" y1="68" x2="164" y2="68"/>
    <line x1="96" y1="161" x2="164" y2="161"/>
  </g>

  <!-- zone Centre -->
  <rect x="164" y="68" width="280" height="93" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="184" y="94" font-size="19" font-weight="bold" fill="#00684a">Centre</text>
  <g font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="164" cy="161" r="13" fill="#13aa52"/><text x="164" y="167">1</text>
    <circle cx="444" cy="161" r="13" fill="#13aa52"/><text x="444" y="167">2</text>
    <circle cx="444" cy="68" r="13" fill="#13aa52"/><text x="444" y="74">3</text>
    <circle cx="164" cy="68" r="13" fill="#13aa52"/><text x="164" y="74">4</text>
  </g>

  <!-- lieux -->
  <circle cx="302" cy="117" r="7" fill="#c0392b"/>
  <text x="314" y="124" font-size="18" font-weight="bold" fill="#333">Mairie</text>
  <circle cx="272" cy="174" r="6" fill="#555"/>
  <text x="284" y="190" font-size="18" fill="#333">Gare</text>
  <circle cx="166" cy="262" r="6" fill="#555"/>
  <text x="178" y="268" font-size="18" fill="#333">IUT</text>

  <!-- documents -->
  <text x="570" y="36" font-size="18" fill="#555">collection <tspan font-family="monospace">lieux</tspan></text>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="570" y="64">{ nom: "Mairie",</text>
    <text x="590" y="90">position: { type: "Point",</text>
    <text x="610" y="116">coordinates: [<tspan fill="#b06f00" font-weight="bold">5.4474</tspan>, <tspan fill="#8e44ad" font-weight="bold">43.5297</tspan>] } }</text>
  </g>
  <text x="776" y="142" font-size="18" fill="#b06f00">↑ la longitude d'abord</text>

  <text x="570" y="182" font-size="18" fill="#555">collection <tspan font-family="monospace">zones</tspan></text>
  <g font-family="monospace" font-size="18" fill="#333">
    <text x="570" y="210">{ nom: "Centre",</text>
    <text x="590" y="236">contour: { type: "Polygon",</text>
    <text x="610" y="262">coordinates: [ [ <tspan fill="#00684a" font-weight="bold">①</tspan>[5.440, 43.525], <tspan fill="#00684a" font-weight="bold">②</tspan>…</text>
    <text x="630" y="288"><tspan fill="#00684a" font-weight="bold">③</tspan>… <tspan fill="#00684a" font-weight="bold">④</tspan>… <tspan fill="#c0392b" font-weight="bold">⑤</tspan>[5.440, 43.525] ] ] } }</text>
  </g>
  <text x="630" y="326" font-size="18" fill="#c0392b">⑤ = ① : le contour se referme</text>
</svg>
