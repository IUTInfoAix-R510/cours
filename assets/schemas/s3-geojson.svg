<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Décrire un lieu en GeoJSON, sur deux documents inventés d'Aix-en-Provence. À gauche, une carte : la longitude en abscisse (x, position est-ouest), la latitude en ordonnée (y, position nord-sud). Le point de la Mairie a pour longitude 5.4474 et pour latitude 43.5297. La zone Centre est un rectangle dont les coins sont numérotés de 1 à 4 dans l'ordre du contour. À droite, les documents correspondants. Collection lieux : { nom: "Mairie", position: { type: "Point", coordinates: [ 5.4474, 43.5297 ] } }, la longitude d'abord, puis la latitude. Collection zones : { nom: "Centre", contour: { type: "Polygon", coordinates: [ [ 1 [5.440, 43.525], 2 [5.455, 43.525], 3 [5.455, 43.535], 4 [5.440, 43.535], 5 [5.440, 43.525] ] ] } } : une liste d'anneaux dont le premier est le contour ; le cinquième point répète le premier, l'anneau est fermé.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- carte : axes -->
  <line x1="82" y1="240" x2="442" y2="240" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <line x1="82" y1="241.1" x2="82" y2="24" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="94" y="24" font-size="16" fill="#8e44ad" font-weight="bold">latitude (y) : nord-sud</text>
  <text x="446" y="290" font-size="16" fill="#00684a" font-weight="bold" text-anchor="end">longitude (x) : est-ouest</text>
  <g stroke="#555" stroke-width="2">
    <line x1="150" y1="240" x2="150" y2="247"/>
    <line x1="268" y1="240" x2="268" y2="247"/>
    <line x1="390" y1="240" x2="390" y2="247"/>
    <line x1="75" y1="100" x2="82" y2="100"/>
    <line x1="75" y1="142" x2="82" y2="142"/>
    <line x1="75" y1="180" x2="82" y2="180"/>
  </g>
  <g font-family="monospace" font-size="15" fill="#555">
    <text x="150" y="263" text-anchor="middle">5.440</text>
    <text x="390" y="263" text-anchor="middle">5.455</text>
    <text x="70" y="105" text-anchor="end">43.535</text>
    <text x="70" y="185" text-anchor="end">43.525</text>
  </g>
  <text x="268" y="263" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">5.4474</text>
  <text x="70" y="147" font-family="monospace" font-size="15" font-weight="bold" fill="#8e44ad" text-anchor="end">43.5297</text>

  <!-- zone Centre -->
  <rect x="150" y="100" width="240" height="80" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="160" y="121" font-size="17" font-weight="bold" fill="#333">Centre</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <circle cx="136" cy="194" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="136" y="199" fill="#4a90d9">1</text>
    <circle cx="404" cy="194" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="404" y="199" fill="#4a90d9">2</text>
    <circle cx="404" cy="86" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="404" y="91" fill="#4a90d9">3</text>
    <circle cx="136" cy="86" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="136" y="91" fill="#4a90d9">4</text>
  </g>

  <!-- point Mairie et ses projections -->
  <line x1="82" y1="142" x2="262" y2="142" stroke="#8e44ad" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="268" y1="148" x2="268" y2="240" stroke="#00684a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="268" cy="142" r="7" fill="#4a90d9" stroke="#1f5f9e" stroke-width="2"/>
  <text x="280" y="138" font-size="17" font-weight="bold" fill="#333">Mairie</text>

  <!-- document lieux -->
  <rect x="470" y="4" width="688" height="100" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="1144" y="26" font-size="14" fill="#555" text-anchor="end">collection lieux</text>
  <g font-family="monospace" font-size="16" fill="#333">
    <text x="484" y="28">{ nom: "Mairie",</text>
    <text x="503" y="52">position: { type: <tspan fill="#00684a" font-weight="bold">"Point"</tspan>,</text>
    <text x="619" y="76">coordinates: [ <tspan fill="#00684a" font-weight="bold">5.4474</tspan>, <tspan fill="#8e44ad" font-weight="bold">43.5297</tspan> ] } }</text>
  </g>
  <text x="820" y="96" font-size="14" font-weight="bold" fill="#00684a" text-anchor="end">longitude d'abord</text>
  <text x="842" y="96" font-size="14" font-weight="bold" fill="#8e44ad">puis latitude</text>

  <!-- document zones -->
  <rect x="470" y="114" width="688" height="184" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="1144" y="136" font-size="14" fill="#555" text-anchor="end">collection zones</text>
  <g font-family="monospace" font-size="16" fill="#333">
    <text x="484" y="138">{ nom: "Centre",</text>
    <text x="503" y="162">contour: { type: <tspan fill="#00684a" font-weight="bold">"Polygon"</tspan>,</text>
    <text x="522" y="186">coordinates: [ [</text>
    <text x="560" y="212">[5.440, 43.525],</text>
    <text x="768" y="212">[5.455, 43.525],</text>
    <text x="560" y="238">[5.455, 43.535],</text>
    <text x="768" y="238">[5.440, 43.535],</text>
    <text x="560" y="264">[5.440, 43.525]</text>
    <text x="522" y="288">] ] } }</text>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <circle cx="544" cy="207" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="544" y="212" fill="#4a90d9">1</text>
    <circle cx="752" cy="207" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="752" y="212" fill="#4a90d9">2</text>
    <circle cx="544" cy="233" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="544" y="238" fill="#4a90d9">3</text>
    <circle cx="752" cy="233" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="752" y="238" fill="#4a90d9">4</text>
    <circle cx="544" cy="259" r="11" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="544" y="264" fill="#4a90d9">5</text>
  </g>
  <text x="700" y="186" font-size="13" fill="#555">1<tspan baseline-shift="super" font-size="9">er</tspan> [ : la liste des bords · 2<tspan baseline-shift="super" font-size="9">e</tspan> [ : le bord, une boucle fermée</text>
  <text x="724" y="264" font-size="14" font-weight="bold" fill="#00684a">5 = 1 : le dernier point répète le premier</text>
</svg>
