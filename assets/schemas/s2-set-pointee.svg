<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux écritures de $set sur La Haine. Avant : realisation vaut { nom: Kassovitz, pays: France }. Avec $set sur realisation.prenom, le champ prenom: Mathieu s'ajoute, nom et pays restent. Avec $set sur realisation, le document imbriqué entier est remplacé : il ne reste que prenom: Mathieu, nom et pays ont disparu.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- avant -->
  <text x="120" y="92" text-anchor="middle" font-size="19" fill="#555">avant</text>
  <rect x="2" y="105" width="236" height="120" rx="10" fill="#f0f4f8" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="18" y="136" font-size="20" font-weight="bold" fill="#00684a">realisation</text>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="18" y="172">nom: "Kassovitz"</text>
    <text x="18" y="206">pays: "France"</text>
  </g>

  <!-- flèches -->
  <path d="M244,165 C282,165 282,82 320,82 L838.5,82" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <path d="M244,165 C282,165 282,240 320,240 L838.5,240" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>

  <g font-family="monospace" font-size="18" fill="#333" text-anchor="middle">
    <text x="580" y="69">{ $set: { <tspan fill="#00684a" font-weight="bold">"realisation.prenom"</tspan>: "Mathieu" } }</text>
    <text x="580" y="227">{ $set: { <tspan fill="#c0392b" font-weight="bold">realisation</tspan>: { prenom: "Mathieu" } } }</text>
  </g>
  <g font-size="19" text-anchor="middle">
    <text x="580" y="111" fill="#00684a">notation pointée : <tspan font-weight="bold">prenom</tspan> s'ajoute, le reste ne bouge pas</text>
    <text x="580" y="269" fill="#c0392b">sans notation pointée : <tspan font-weight="bold">realisation</tspan> est remplacé</text>
  </g>

  <!-- après A -->
  <rect x="850" y="4" width="308" height="146" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="866" y="33" font-size="20" font-weight="bold" fill="#00684a">realisation</text>
  <rect x="860" y="109" width="236" height="30" rx="5" fill="#13aa52" fill-opacity="0.22"/>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="866" y="66">nom: "Kassovitz"</text>
    <text x="866" y="98">pays: "France"</text>
    <text x="866" y="130">prenom: "Mathieu"</text>
  </g>

  <!-- après B -->
  <rect x="850" y="170" width="308" height="146" rx="10" fill="#fdeeee" stroke="#c0392b" stroke-width="2.5"/>
  <text x="866" y="199" font-size="20" font-weight="bold" fill="#00684a">realisation</text>
  <rect x="860" y="211" width="236" height="30" rx="5" fill="#13aa52" fill-opacity="0.22"/>
  <text x="866" y="232" font-family="monospace" font-size="19" fill="#333">prenom: "Mathieu"</text>
  <g font-family="monospace" font-size="19" fill="#c0392b" opacity="0.75">
    <text x="866" y="266">nom: "Kassovitz"</text>
    <text x="866" y="298">pays: "France"</text>
  </g>
  <line x1="862" y1="260" x2="1052" y2="260" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="862" y1="292" x2="1030" y2="292" stroke="#c0392b" stroke-width="2.5"/>
  <text x="1150" y="282" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="end">disparus</text>
</svg>
