<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Trois plans d'exécution, affichés par PROFILE, pour trouver Elif par son nom sur une base de 232 nœuds ; chaque plan se lit de bas en haut. (a) Sans label : AllNodesScan (232 lignes, 233 db hits), puis Filter p.nom = 'Elif' (232 db hits), Projection (1 db hit), ProduceResults : 466 db hits au total, en rouge. (b) Avec le label :Personne : NodeByLabelScan p:Personne (6 lignes, 7 db hits), puis Filter (6 db hits), Projection (1 db hit), ProduceResults : 14 db hits, en orange. (c) Avec la contrainte d'unicité : NodeUniqueIndexSeek UNIQUE p:Personne(nom) (2 db hits), puis Projection (1 db hit), ProduceResults : 3 db hits, en vert.</title>
  <defs><marker id="fl-bleu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/></marker><marker id="fl-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6400"/></marker><marker id="fl-vert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00684a"/></marker><marker id="fl-rouge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="fl-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker><marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="fl-noir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="0" y="24" font-size="20" font-weight="bold" fill="#c0392b">(a) sans label</text>
  <rect x="0" y="44" width="270" height="52" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="10" y="66" font-size="18" font-weight="bold" font-family="monospace" fill="#333">ProduceResults</text>
  <rect x="0" y="110" width="270" height="52" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="10" y="132" font-size="18" font-weight="bold" font-family="monospace" fill="#333">Projection</text>
  <text x="10" y="154" font-size="18" fill="#555">1 db hit</text>
  <line x1="135" y1="108" x2="135" y2="98" stroke="#555" stroke-width="2.5"/>
  <rect x="0" y="176" width="270" height="52" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="10" y="198" font-size="18" font-weight="bold" font-family="monospace" fill="#333">Filter p.nom = 'Elif'</text>
  <text x="10" y="220" font-size="18" fill="#555">232 db hits</text>
  <line x1="135" y1="174" x2="135" y2="164" stroke="#555" stroke-width="2.5"/>
  <rect x="0" y="242" width="270" height="52" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="2.5"/>
  <text x="10" y="264" font-size="18" font-weight="bold" font-family="monospace" fill="#333">AllNodesScan</text>
  <text x="10" y="286" font-size="18" fill="#555">232 lignes, 233 db hits</text>
  <line x1="135" y1="240" x2="135" y2="230" stroke="#555" stroke-width="2.5"/>
  <text x="330" y="190" font-size="46" font-weight="bold" fill="#c0392b" text-anchor="middle">466</text>
  <text x="330" y="218" font-size="18" fill="#555" text-anchor="middle">db hits</text>
  <text x="392" y="24" font-size="20" font-weight="bold" fill="#9a6400">(b) avec :Personne</text>
  <rect x="392" y="44" width="270" height="52" rx="6" fill="#fff" stroke="#9a6400" stroke-width="2"/>
  <text x="402" y="66" font-size="18" font-weight="bold" font-family="monospace" fill="#333">ProduceResults</text>
  <rect x="392" y="110" width="270" height="52" rx="6" fill="#fff" stroke="#9a6400" stroke-width="2"/>
  <text x="402" y="132" font-size="18" font-weight="bold" font-family="monospace" fill="#333">Projection</text>
  <text x="402" y="154" font-size="18" fill="#555">1 db hit</text>
  <line x1="527" y1="108" x2="527" y2="98" stroke="#555" stroke-width="2.5"/>
  <rect x="392" y="176" width="270" height="52" rx="6" fill="#fff" stroke="#9a6400" stroke-width="2"/>
  <text x="402" y="198" font-size="18" font-weight="bold" font-family="monospace" fill="#333">Filter</text>
  <text x="402" y="220" font-size="18" fill="#555">6 db hits</text>
  <line x1="527" y1="174" x2="527" y2="164" stroke="#555" stroke-width="2.5"/>
  <rect x="392" y="242" width="270" height="52" rx="6" fill="#fdf3e0" stroke="#9a6400" stroke-width="2.5"/>
  <text x="402" y="264" font-size="18" font-weight="bold" font-family="monospace" fill="#333">NodeByLabelScan</text>
  <text x="402" y="286" font-size="18" fill="#555">6 lignes, 7 db hits</text>
  <line x1="527" y1="240" x2="527" y2="230" stroke="#555" stroke-width="2.5"/>
  <text x="722" y="190" font-size="46" font-weight="bold" fill="#9a6400" text-anchor="middle">14</text>
  <text x="722" y="218" font-size="18" fill="#555" text-anchor="middle">db hits</text>
  <text x="784" y="24" font-size="20" font-weight="bold" fill="#00684a">(c) avec la contrainte</text>
  <rect x="784" y="110" width="270" height="52" rx="6" fill="#fff" stroke="#00684a" stroke-width="2"/>
  <text x="794" y="132" font-size="18" font-weight="bold" font-family="monospace" fill="#333">ProduceResults</text>
  <rect x="784" y="176" width="270" height="52" rx="6" fill="#fff" stroke="#00684a" stroke-width="2"/>
  <text x="794" y="198" font-size="18" font-weight="bold" font-family="monospace" fill="#333">Projection</text>
  <text x="794" y="220" font-size="18" fill="#555">1 db hit</text>
  <line x1="919" y1="174" x2="919" y2="164" stroke="#555" stroke-width="2.5"/>
  <rect x="784" y="242" width="270" height="52" rx="6" fill="#e6f4ee" stroke="#00684a" stroke-width="2.5"/>
  <text x="794" y="264" font-size="18" font-weight="bold" font-family="monospace" fill="#333">NodeUniqueIndexSeek</text>
  <text x="794" y="286" font-size="18" fill="#555">personne_nom, 2 db hits</text>
  <line x1="919" y1="240" x2="919" y2="230" stroke="#555" stroke-width="2.5"/>
  <text x="1114" y="190" font-size="46" font-weight="bold" fill="#00684a" text-anchor="middle">3</text>
  <text x="1114" y="218" font-size="18" fill="#555" text-anchor="middle">db hits</text>
  <text x="0" y="340" font-size="18" fill="#555">Chaque plan se lit de bas en haut : la première opération est en bas.</text>
</svg>
