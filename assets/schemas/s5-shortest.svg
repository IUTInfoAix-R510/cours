<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 506" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Les plus courts chemins de Ana à Farah sur le graphe SUIT de l'exemple d'essai. Deux chemins de 4 relations chacun, à égalité : en bleu, Ana→Bilal→Dario→Elif→Farah ; en violet, Ana→Camille→Dario→Elif→Farah ; les relations Dario→Elif et Elif→Farah sont communes aux deux. SHORTEST 1 en renvoie un seul, choisi par Neo4j : Ana → Camille → Dario → Elif → Farah. ALL SHORTEST renvoie les deux : Ana → Bilal → Dario → Elif → Farah et Ana → Camille → Dario → Elif → Farah. « Plus court » compte les relations, pas une distance ou une durée.</title>
