  <text x="36" y="398" font-size="16" font-weight="bold" font-family="monospace" fill="#8e44ad">Ana → Camille → Dario → Elif → Farah</text>
  <rect x="595" y="330" width="545" height="130" rx="10" fill="#f6f8fa" stroke="#cfd8e0" stroke-width="2"/>
