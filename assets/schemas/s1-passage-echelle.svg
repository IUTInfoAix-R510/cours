<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Passage à l'échelle. Vertical : une petite machine remplacée par une plus grosse, le relationnel s'y prête. Horizontal : trois machines, les données réparties entre elles : le livre, son auteur et ses avis ; la fiche de Dune doit joindre des lignes des trois machines, par le réseau.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00684a"/>
    </marker>
    <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Vertical -->
  <rect x="0" y="0" width="390" height="330" rx="14" fill="#f0f4f8"/>
  <text x="195" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#00684a">Vertical</text>
  <text x="195" y="64" text-anchor="middle" font-size="19" fill="#555">une machine plus grosse</text>

  <!-- petite machine -->
  <rect x="55" y="170" width="80" height="80" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
  <line x1="67" y1="196" x2="123" y2="196" stroke="#4a90d9" stroke-width="3"/>
  <line x1="67" y1="222" x2="123" y2="222" stroke="#4a90d9" stroke-width="3"/>
  <!-- flèche -->
  <line x1="150" y1="210" x2="210" y2="210" stroke="#00684a" stroke-width="4" marker-end="url(#fl)"/>
  <!-- grosse machine -->
  <rect x="225" y="88" width="120" height="162" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
  <line x1="240" y1="118" x2="330" y2="118" stroke="#4a90d9" stroke-width="3"/>
  <line x1="240" y1="146" x2="330" y2="146" stroke="#4a90d9" stroke-width="3"/>
  <line x1="240" y1="174" x2="330" y2="174" stroke="#4a90d9" stroke-width="3"/>
  <line x1="240" y1="202" x2="330" y2="202" stroke="#4a90d9" stroke-width="3"/>
  <line x1="240" y1="230" x2="330" y2="230" stroke="#4a90d9" stroke-width="3"/>

  <text x="195" y="290" text-anchor="middle" font-size="20" fill="#13aa52" font-weight="bold">✓ le relationnel s'y prête</text>
  <text x="195" y="316" text-anchor="middle" font-size="18" fill="#555">mais une machine a ses limites</text>

  <!-- Horizontal -->
  <rect x="420" y="0" width="680" height="330" rx="14" fill="#f0f4f8"/>
  <text x="760" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#00684a">Horizontal</text>
  <text x="760" y="64" text-anchor="middle" font-size="19" fill="#555">plus de machines, les données réparties entre elles</text>

  <!-- machine 1 : livres -->
  <rect x="450" y="88" width="190" height="112" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
  <text x="545" y="116" text-anchor="middle" font-size="18" fill="#555">machine 1</text>
  <rect x="470" y="128" width="150" height="30" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="545" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#00684a">livres</text>
  <rect x="470" y="158" width="150" height="28" fill="#fff4dc" stroke="#13aa52" stroke-width="2"/>
  <text x="545" y="179" text-anchor="middle" font-size="18">Dune</text>

  <!-- machine 2 : auteurs -->
  <rect x="665" y="88" width="190" height="112" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
  <text x="760" y="116" text-anchor="middle" font-size="18" fill="#555">machine 2</text>
  <rect x="685" y="128" width="150" height="30" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="760" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#00684a">auteurs</text>
  <rect x="685" y="158" width="150" height="28" fill="#fff4dc" stroke="#13aa52" stroke-width="2"/>
  <text x="760" y="179" text-anchor="middle" font-size="18">Herbert</text>

  <!-- machine 3 : avis -->
  <rect x="880" y="88" width="190" height="112" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
  <text x="975" y="116" text-anchor="middle" font-size="18" fill="#555">machine 3</text>
  <rect x="900" y="128" width="150" height="30" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="975" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#00684a">avis</text>
  <rect x="900" y="158" width="150" height="28" fill="#fff4dc" stroke="#13aa52" stroke-width="2"/>
  <text x="975" y="179" text-anchor="middle" font-size="18">note 5/5</text>

  <!-- requête : fiche de Dune -->
  <rect x="660" y="262" width="200" height="40" rx="20" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
  <text x="760" y="289" text-anchor="middle" font-size="19" font-weight="bold" fill="#c0392b">fiche de Dune</text>
  <line x1="680" y1="264" x2="580" y2="206" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#flr)"/>
  <line x1="760" y1="262" x2="760" y2="208" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#flr)"/>
  <line x1="840" y1="264" x2="940" y2="206" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#flr)"/>
  <text x="560" y="250" text-anchor="middle" font-size="18" fill="#c0392b">jointure</text>
  <text x="960" y="250" text-anchor="middle" font-size="18" fill="#c0392b">par le réseau</text>
</svg>
