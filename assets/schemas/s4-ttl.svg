<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Un index TTL sur une frise. Un brouillon d'épisode est modifié à 10 h (champ modifie). L'index { modifie: 1 } a expireAfterSeconds: 3600 : le document expire à 11 h. Le moniteur TTL, une tâche de fond, passe environ toutes les 60 secondes (traits verticaux) ; au premier passage après 11 h, il supprime le brouillon. Entre 11 h et ce passage, le document existe encore.</title>

  <!-- l'index -->
  <text x="2" y="22" font-family="monospace" font-size="20" fill="#333">db.brouillons.createIndex({ <tspan font-weight="bold" fill="#4a90d9">modifie</tspan>: 1 }, { <tspan font-weight="bold" fill="#00684a">expireAfterSeconds</tspan>: <tspan font-weight="bold" fill="#b06f00">3600</tspan> })</text>

  <!-- frise générale : de 9 h 50 à 11 h 10, 13 unités par minute -->
  <text x="580" y="50" font-size="18" fill="#555" text-anchor="middle">le délai : <tspan font-family="monospace" font-weight="bold" fill="#00684a">expireAfterSeconds</tspan> = <tspan font-weight="bold" fill="#b06f00">3600</tspan> secondes, une heure</text>
  <path d="M190,52 V64 M190,58 H970 M970,52 V64" fill="none" stroke="#555" stroke-width="1.5"/>

  <path d="M69.1,104 V116 M82.1,104 V116 M95.1,104 V116 M108.1,104 V116 M121.1,104 V116 M134.1,104 V116 M147.1,104 V116 M160.1,104 V116 M173.1,104 V116 M186.1,104 V116 M199.1,104 V116 M212.1,104 V116 M225.1,104 V116 M238.1,104 V116 M251.1,104 V116 M264.1,104 V116 M277.1,104 V116 M290.1,104 V116 M303.1,104 V116 M316.1,104 V116 M329.1,104 V116 M342.1,104 V116 M355.1,104 V116 M368.1,104 V116 M381.1,104 V116 M394.1,104 V116 M407.1,104 V116 M420.1,104 V116 M433.1,104 V116 M446.1,104 V116 M459.1,104 V116 M472.1,104 V116 M485.1,104 V116 M498.1,104 V116 M511.1,104 V116 M524.1,104 V116 M537.1,104 V116 M550.1,104 V116 M563.1,104 V116 M576.1,104 V116 M589.1,104 V116 M602.1,104 V116 M615.1,104 V116 M628.1,104 V116 M641.1,104 V116 M654.1,104 V116 M667.1,104 V116 M680.1,104 V116 M693.1,104 V116 M706.1,104 V116 M719.1,104 V116 M732.1,104 V116 M745.1,104 V116 M758.1,104 V116 M771.1,104 V116 M784.1,104 V116 M797.1,104 V116 M810.1,104 V116 M823.1,104 V116 M836.1,104 V116 M849.1,104 V116 M862.1,104 V116 M875.1,104 V116 M888.1,104 V116 M901.1,104 V116 M914.1,104 V116 M927.1,104 V116 M940.1,104 V116 M953.1,104 V116 M966.1,104 V116 M979.1,104 V116 M992.1,104 V116 M1005.1,104 V116 M1018.1,104 V116 M1031.1,104 V116 M1044.1,104 V116 M1057.1,104 V116 M1070.1,104 V116 M1083.1,104 V116 M1096.1,104 V116" fill="none" stroke="#777" stroke-width="1.2"/>
  <line x1="60" y1="110" x2="1100" y2="110" stroke="#777" stroke-width="2"/>

  <rect x="60" y="66" width="919.1" height="34" rx="5" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="72" y="90" font-size="19" font-weight="bold" fill="#333">le brouillon</text>
  <text x="204" y="90" font-family="monospace" font-size="19" fill="#333">{ <tspan font-weight="bold" fill="#4a90d9">modifie</tspan>: 10 h, ... }</text>

  <line x1="190" y1="60" x2="190" y2="120" stroke="#e8a838" stroke-width="3"/>
  <line x1="970" y1="60" x2="970" y2="120" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="190" y="144" font-size="20" font-weight="bold" fill="#b06f00" text-anchor="middle">10 h : modifié</text>
  <text x="940" y="144" font-size="20" font-weight="bold" fill="#c0392b" text-anchor="end">11 h : expire</text>

  <!-- zone agrandie -->
  <rect x="944" y="60" width="65" height="64" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M944,124 L60,168 M1009,124 L1100,168" fill="none" stroke="#b8c4cf" stroke-width="1.5"/>

  <!-- zoom : de 10 h 58 à 11 h 03, 3,4 unités par seconde -->
  <rect x="60" y="168" width="1040" height="132" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="72" y="192" font-size="18" fill="#555">agrandi : de 10 h 58 à 11 h 03</text>

  <g stroke="#555" stroke-width="2">
    <line x1="222.8" y1="224" x2="222.8" y2="268"/>
    <line x1="426.8" y1="224" x2="426.8" y2="268"/>
    <line x1="630.8" y1="224" x2="630.8" y2="268"/>
    <line x1="834.8" y1="224" x2="834.8" y2="268"/>
    <line x1="1038.8" y1="224" x2="1038.8" y2="268"/>
  </g>
  <line x1="80" y1="262" x2="1080" y2="262" stroke="#777" stroke-width="2"/>
  <g font-size="18" fill="#555" text-anchor="middle">
    <text x="222.8" y="290">passage</text>
    <text x="426.8" y="290">passage</text>
    <text x="630.8" y="290">passage</text>
    <text x="834.8" y="290">passage</text>
    <text x="1038.8" y="290">passage</text>
  </g>

  <rect x="80" y="226" width="408" height="30" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="92" y="248" font-size="19" font-weight="bold" fill="#333">le brouillon</text>
  <rect x="488" y="226" width="142.8" height="30" fill="#fdeeee" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="559.4" y="218" font-size="19" font-weight="bold" fill="#c0392b" text-anchor="middle">expiré, encore là</text>
  <line x1="488" y1="224" x2="488" y2="268" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="488" y="290" font-size="19" font-weight="bold" fill="#c0392b" text-anchor="middle">11 h</text>
  <text x="638" y="248" font-size="18" fill="#c0392b">supprimé à ce passage</text>

  <!-- légende -->
  <text x="2" y="330" font-size="18" fill="#555">Le <tspan font-weight="bold" fill="#333">moniteur TTL</tspan>, une tâche de fond, passe environ toutes les 60 s (traits verticaux) : la suppression n'est pas immédiate.</text>
</svg>
