<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 252" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Mécanisme de $bucket: { groupBy: "$duree", boundaries: [0, 90, 120], default: "long", output: { nb: { $sum: 1 } } }. Les bornes découpent l'axe des durées en deux tranches, de 0 inclus à 90 exclu et de 90 inclus à 120 exclu ; default reçoit le reste. Les Glaneurs, 82 minutes, tombent dans la tranche de 0 à 90 ; La Haine, 98, dans celle de 90 à 120 ; Amélie, 122, et Chihiro, 125, dans default. En sortie, un document par tranche : { _id: 0, nb: 1 }, { _id: 90, nb: 1 }, { _id: "long", nb: 2 } ; l'_id est la borne basse, ou la valeur de default.</title>

  <!-- films -->
  <g font-size="18">
    <rect x="680" y="4" width="132" height="34" rx="7" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2"/>
    <text x="692" y="28" font-weight="bold" fill="#333">La Haine <tspan font-family="monospace" font-weight="normal" fill="#555">98</tspan></text>
    <rect x="870" y="4" width="146" height="34" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
    <text x="882" y="28" font-weight="bold" fill="#333">Chihiro <tspan font-family="monospace" font-weight="normal" fill="#555">125</tspan></text>
    <rect x="554" y="48" width="150" height="34" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
    <text x="566" y="72" font-weight="bold" fill="#333">Glaneurs <tspan font-family="monospace" font-weight="normal" fill="#555">82</tspan></text>
    <rect x="770" y="48" width="140" height="34" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
    <text x="782" y="72" font-weight="bold" fill="#333">Amélie <tspan font-family="monospace" font-weight="normal" fill="#555">122</tspan></text>
  </g>
  <g stroke-width="2">
    <line x1="746" y1="38" x2="746" y2="114" stroke="#8e44ad"/>
    <line x1="935" y1="38" x2="935" y2="114" stroke="#4a90d9"/>
    <line x1="634" y1="82" x2="634" y2="114" stroke="#e8a838"/>
    <line x1="914" y1="82" x2="914" y2="114" stroke="#4a90d9"/>
  </g>
  <g>
    <circle cx="746" cy="118" r="6" fill="#8e44ad"/>
    <circle cx="935" cy="118" r="6" fill="#4a90d9"/>
    <circle cx="634" cy="118" r="6" fill="#e8a838"/>
    <circle cx="914" cy="118" r="6" fill="#4a90d9"/>
  </g>

  <!-- tranches -->
  <rect x="60" y="126" width="630" height="38" fill="#eef3f7" stroke="#13aa52" stroke-width="2"/>
  <rect x="690" y="126" width="210" height="38" fill="#eef3f7" stroke="#13aa52" stroke-width="2"/>
  <rect x="900" y="126" width="256" height="38" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="7 5"/>
  <g font-family="monospace" font-size="19" fill="#333" text-anchor="middle">
    <text x="375" y="152">[0, 90[</text>
    <text x="795" y="152">[90, 120[</text>
    <text x="1028" y="152"><tspan fill="#b06f00" font-weight="bold">default</tspan> : le reste</text>
  </g>
  <g font-family="monospace" font-size="19" font-weight="bold" fill="#b06f00" text-anchor="middle">
    <text x="60" y="188">0</text>
    <text x="690" y="188">90</text>
    <text x="900" y="188">120</text>
  </g>
  <text x="4" y="152" font-size="18" fill="#555">min</text>

  <!-- sortie -->
  <g font-family="monospace" font-size="19" fill="#333" text-anchor="middle">
    <rect x="270" y="206" width="210" height="40" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="375" y="232">{ _id: <tspan font-weight="bold" fill="#b06f00">0</tspan>, nb: 1 }</text>
    <rect x="670" y="206" width="210" height="40" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="775" y="232">{ _id: <tspan font-weight="bold" fill="#b06f00">90</tspan>, nb: 1 }</text>
    <rect x="898" y="206" width="258" height="40" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="1027" y="232">{ _id: <tspan font-weight="bold" fill="#b06f00">"long"</tspan>, nb: 2 }</text>
  </g>
  <text x="4" y="232" font-size="18" fill="#555">en sortie</text>
</svg>
