  <title id="t">$bucket sur la durée des films : un axe de 0 à 130 minutes porte les bornes boundaries: [0, 90, 120], et output compte les films de chaque tranche dans nb ; Les Glaneurs et la Glaneuse (82 min) tombe dans la tranche [0, 90[, La Haine (98 min) dans la tranche [90, 120[, borne basse incluse et borne haute exclue ; Amélie Poulain (122 min) et Le Voyage de Chihiro (125 min) dépassent 120 et vont dans default: "long" ; en sortie, trois documents : { _id: 0, nb: 1 }, { _id: 90, nb: 1 } et { _id: "long", nb: 2 }</title>
