  <text x="18" y="180" font-family="monospace" font-size="18" fill="#333">intervenants: [</text>
  <text x="32" y="204" font-family="monospace" font-size="18" fill="#333">{ nom, role },</text>
  <text x="32" y="228" font-family="monospace" font-size="18" fill="#333">{ nom, role } ]</text>
  <rect x="236" y="98" width="222" height="84" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <rect x="244" y="130" width="168" height="24" rx="5" fill="#f0f4f8" stroke="#999" stroke-width="1.5"/>
  <text x="248" y="122" font-family="monospace" font-size="18" fill="#333">_id: "K1",</text>
  <text x="248" y="148" font-family="monospace" font-size="18" fill="#333" font-weight="bold">episode: "E1",</text>
  <text x="248" y="174" font-family="monospace" font-size="18" fill="#333">auteur, note…</text>
  <line x1="328" y1="186" x2="328" y2="206" stroke="#999" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#fl)"/>
