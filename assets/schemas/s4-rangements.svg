  <text x="624" y="187" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">K2</text>
  <rect x="486" y="222" width="190" height="38" rx="7" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="581" y="247" font-size="18" fill="#555" text-anchor="middle">tous à part</text>
  <rect x="704" y="98" width="222" height="94" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <rect x="710" y="156" width="210" height="28" rx="5" fill="#e6f4ee" stroke="#13aa52" stroke-width="1.5"/>
  <text x="716" y="124" font-family="monospace" font-size="18" fill="#333">_id: "E1",</text>
  <text x="716" y="148" font-family="monospace" font-size="18" fill="#333">titre: "…",</text>
  <text x="716" y="177" font-family="monospace" font-size="18" fill="#333" font-weight="bold">nbCommentaires: 3</text>
  <rect x="938" y="98" width="222" height="164" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <rect x="946" y="182" width="206" height="72" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="946" y="122" font-family="monospace" font-size="18" fill="#333" letter-spacing="-1.6">_id: "E1-2026-09-08"</text>
  <text x="950" y="146" font-family="monospace" font-size="18" fill="#333">episode: "E1",</text>
  <text x="950" y="170" font-family="monospace" font-size="18" fill="#333">nb: 2, max: 52,</text>
  <text x="950" y="202" font-family="monospace" font-size="18" fill="#333">mesures: [</text>
  <text x="954" y="224" font-family="monospace" font-size="18" fill="#333">{ t, auditeurs },</text>
  <text x="954" y="246" font-family="monospace" font-size="18" fill="#333">{ t, auditeurs } ]</text>
  <text x="2" y="290" font-size="18" fill="#555">un document imbriqué</text>
  <text x="2" y="314" font-size="18" fill="#555">dans l'épisode</text>
  <text x="236" y="290" font-size="18" fill="#555">l'<tspan font-family="monospace">_id</tspan> de l'épisode,</text>
  <text x="236" y="314" font-size="18" fill="#555">rangé ailleurs</text>
  <text x="470" y="290" font-size="18" fill="#555">les 2 derniers ici,</text>
  <text x="470" y="314" font-size="18" fill="#555">tous à part</text>
  <text x="704" y="290" font-size="18" fill="#555">un compteur, calculé</text>
  <text x="704" y="314" font-size="18" fill="#555">à chaque écriture</text>
  <text x="938" y="290" font-size="18" fill="#555">un document par jour,</text>
  <text x="938" y="314" font-size="18" fill="#555">avec ses mesures</text>
</svg>
