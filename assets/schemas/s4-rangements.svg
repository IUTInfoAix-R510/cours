  <text x="482" y="52" font-size="18" font-weight="bold" fill="#00684a">pattern Subset</text>
  <rect x="704" y="2" width="222" height="60" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="716" y="28" font-size="20" font-weight="bold" fill="#333">Calcul</text>
  <text x="716" y="52" font-size="18" font-weight="bold" fill="#00684a">pattern Computed</text>
  <rect x="938" y="2" width="222" height="60" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="950" y="28" font-size="20" font-weight="bold" fill="#333">Bucket</text>
  <text x="950" y="52" font-size="18" font-weight="bold" fill="#00684a">pattern Bucket</text>
  <text x="4" y="88" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">episodes</text>
  <text x="238" y="88" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">commentaires</text>
  <text x="472" y="88" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">episodes</text>
  <text x="706" y="88" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">episodes</text>
  <text x="940" y="88" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a">ecoutes_par_jour</text>
  <rect x="2" y="98" width="222" height="162" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <rect x="10" y="158" width="206" height="94" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="14" y="124" font-family="monospace" font-size="18" fill="#333">_id: "E1",</text>
