  <rect x="478" y="132" width="206" height="74" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="1.5"/>
  <text x="482" y="124" font-family="monospace" font-size="18" fill="#333">_id: "E1",</text>
  <text x="482" y="154" font-family="monospace" font-size="18" fill="#333" letter-spacing="-1">derniersCommentaires</text>
  <rect x="500" y="164" width="76" height="32" rx="5" fill="#ffffff" stroke="#e8a838" stroke-width="1.5"/>
