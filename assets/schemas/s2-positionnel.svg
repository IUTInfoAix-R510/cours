<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 262" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le tableau seances du Voyage de Chihiro après le $push et le $pull : la séance du 29 novembre en position 0, celle du 30 novembre en position 1. Le filtre seances.date égal au 29 novembre trouve l'élément en position 0 ; dans seances.$.libres, $ vaut cette position, comme si l'on avait écrit seances.0, et les places libres passent de 40 à 38.</title>
  <defs>
    <marker id="fl-bleu" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/>
    </marker>
    <marker id="fl-vert" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00684a"/>
    </marker>
  </defs>

  <!-- étape 1 : le filtre -->
  <text x="490" y="24" font-size="22" text-anchor="middle" fill="#2f6db0"><tspan font-weight="bold">1.</tspan> le filtre <tspan font-family="monospace" font-weight="bold">"seances.date": ISODate("2026-11-29")</tspan> trouve l'élément</text>
  <line x1="490" y1="34" x2="490" y2="58" stroke="#2f6db0" stroke-width="2.5" marker-end="url(#fl-bleu)"/>

  <!-- le tableau -->
  <text x="320" y="132" font-size="22" text-anchor="end" fill="#555" font-family="monospace">seances</text>
  <g font-family="monospace" font-size="21" fill="#333">
    <rect x="345" y="68" width="290" height="116" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="3.5"/>
    <text x="364" y="100">salle: 1</text>
    <text x="364" y="133">date: 29/11</text>
    <text x="364" y="166">libres: <tspan fill="#c0392b" text-decoration="line-through">40</tspan> <tspan fill="#00684a" font-weight="bold">38</tspan></text>

    <rect x="675" y="68" width="290" height="116" rx="10" fill="#f0f4f8" stroke="#999" stroke-width="2"/>
    <text x="694" y="100">salle: 3</text>
    <text x="694" y="133">date: 30/11</text>
    <text x="694" y="166">libres: 50</text>
  </g>
  <!-- positions -->
  <g font-size="20" text-anchor="middle">
    <circle cx="610" cy="91" r="16" fill="#13aa52"/>
    <text x="610" y="98" fill="#fff" font-weight="bold">0</text>
    <circle cx="940" cy="91" r="16" fill="#fff" stroke="#999"/>
    <text x="940" y="98" fill="#555">1</text>
  </g>

  <!-- étape 2 : $ -->
  <line x1="490" y1="226" x2="490" y2="195" stroke="#00684a" stroke-width="2.5" marker-end="url(#fl-vert)"/>
  <text x="580" y="252" font-size="22" text-anchor="middle" fill="#00684a"><tspan font-weight="bold">2.</tspan> dans <tspan font-family="monospace" font-weight="bold">"seances.$.libres"</tspan>, <tspan font-family="monospace" font-weight="bold">$</tspan> vaut la position trouvée : 0, comme <tspan font-family="monospace">"seances.0"</tspan></text>
</svg>
