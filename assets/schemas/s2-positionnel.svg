<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 226" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le tableau ingredients : farine en position 0, lait en position 1, oeufs en position 2. Le filtre ingredients.nom égal à lait trouve l'élément en position 1 ; dans ingredients.$.qte, $ vaut cette position, et la quantité du lait passe de 500 à 600.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- étape 1 : le filtre -->
  <text x="610" y="22" font-size="20" text-anchor="middle" fill="#4a90d9"><tspan font-weight="bold">1.</tspan> le filtre <tspan font-family="monospace" font-weight="bold">"ingredients.nom": "lait"</tspan> trouve l'élément</text>
  <line x1="610" y1="30" x2="610" y2="60" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#fl)"/>

  <!-- le tableau -->
  <text x="140" y="114" font-size="20" text-anchor="end" fill="#555" font-family="monospace">ingredients</text>
  <g font-family="monospace" font-size="19" fill="#333">
    <rect x="160" y="66" width="260" height="84" rx="10" fill="#f0f4f8" stroke="#999" stroke-width="2"/>
    <text x="178" y="99">nom: "farine"</text>
    <text x="178" y="134">qte: 250</text>

    <rect x="480" y="66" width="260" height="84" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="3.5"/>
    <text x="498" y="99">nom: "lait"</text>
    <text x="498" y="134">qte: <tspan fill="#c0392b" text-decoration="line-through">500</tspan> <tspan fill="#00684a" font-weight="bold">600</tspan></text>

    <rect x="800" y="66" width="260" height="84" rx="10" fill="#f0f4f8" stroke="#999" stroke-width="2"/>
    <text x="818" y="99">nom: "oeufs"</text>
    <text x="818" y="134">qte: 3</text>
  </g>
  <!-- positions -->
  <g font-size="18" fill="#555" text-anchor="middle">
    <circle cx="398" cy="87" r="15" fill="#fff" stroke="#999"/>
    <text x="398" y="93">0</text>
    <circle cx="718" cy="87" r="15" fill="#13aa52"/>
    <text x="718" y="93" fill="#fff" font-weight="bold">1</text>
    <circle cx="1038" cy="87" r="15" fill="#fff" stroke="#999"/>
    <text x="1038" y="93">2</text>
  </g>

  <!-- étape 2 : $ -->
  <line x1="610" y1="192" x2="610" y2="158" stroke="#00684a" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="610" y="218" font-size="20" text-anchor="middle" fill="#00684a"><tspan font-weight="bold">2.</tspan> dans <tspan font-family="monospace" font-weight="bold">"ingredients.$.qte"</tspan>, <tspan font-family="monospace" font-weight="bold">$</tspan> vaut la position trouvée : 1</text>
</svg>
