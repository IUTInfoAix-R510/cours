<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 250" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le vocabulaire d'un graphe, sur deux nœuds de l'exemple d'essai. Le nœud Ana, de label :Personne, a les propriétés nom: 'Ana' et ville: 'Aix'. Le nœud Archipel, de label :Jeu, a les propriétés titre: 'Archipel' et joueurs: 4, un entier. Une relation va d'Ana vers Archipel : son type est AIME, son sens est donné par la flèche, et elle porte la propriété note: 5.</title>
  <defs><marker id="fl-bleu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/></marker><marker id="fl-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6400"/></marker><marker id="fl-vert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00684a"/></marker><marker id="fl-rouge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="fl-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker><marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="fl-noir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="40" y="70" width="300" height="120" rx="18" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <rect x="56" y="56" width="120" height="30" rx="15" fill="#2f6db0" stroke="#2f6db0" stroke-width="2"/>
  <text x="116" y="77" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">:Personne</text>
  <text x="66" y="125" font-size="19" font-family="monospace" fill="#333">nom: 'Ana'</text>
  <text x="66" y="158" font-size="19" font-family="monospace" fill="#333">ville: 'Aix'</text>
  <rect x="820" y="70" width="320" height="120" rx="18" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <rect x="836" y="56" width="70" height="30" rx="15" fill="#9a6400" stroke="#9a6400" stroke-width="2"/>
  <text x="871" y="77" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">:Jeu</text>
  <text x="846" y="125" font-size="19" font-family="monospace" fill="#333">titre: 'Archipel'</text>
  <text x="846" y="158" font-size="19" font-family="monospace" fill="#333">joueurs: 4</text>
  <line x1="346" y1="130" x2="812" y2="130" stroke="#9a6400" stroke-width="4" marker-end="url(#fl-orange)"/>
  <text x="580" y="118" font-size="20" font-weight="bold" font-family="monospace" fill="#9a6400" text-anchor="middle">AIME</text>
  <text x="580" y="158" font-size="19" font-family="monospace" fill="#333" text-anchor="middle">{note: 5}</text>
  <text x="190" y="30" font-size="18" font-weight="bold" font-style="italic" fill="#00684a" text-anchor="middle">nœud, et son label</text>
  <text x="190" y="222" font-size="18" font-weight="bold" font-style="italic" fill="#00684a" text-anchor="middle">propriétés : clé et valeur typée</text>
  <text x="580" y="48" font-size="18" font-weight="bold" font-style="italic" fill="#00684a" text-anchor="middle">type de relation ; la flèche donne le sens</text>
  <line x1="580" y1="56" x2="580" y2="96" stroke="#00684a" stroke-width="2" marker-end="url(#fl-vert)"/>
  <text x="580" y="222" font-size="18" font-weight="bold" font-style="italic" fill="#00684a" text-anchor="middle">propriété de la relation</text>
  <line x1="580" y1="202" x2="580" y2="168" stroke="#00684a" stroke-width="2" marker-end="url(#fl-vert)"/>
  <text x="980" y="222" font-size="18" font-weight="bold" font-style="italic" fill="#00684a" text-anchor="middle">4 est un entier, 'Aix' une chaîne</text>
</svg>
