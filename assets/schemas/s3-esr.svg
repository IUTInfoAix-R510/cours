<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 336" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">L'index composé { annee: 1, titre: 1 } sur les 4 films range ses clés par annee, puis par titre à annee égale : (1995, "La Haine"), (2000, "Les Glaneurs et la Glaneuse"), (2001, "Amélie Poulain"), (2001, "Le Voyage de Chihiro"). À gauche, une égalité, find({ annee: 2001 }).sort({ titre: 1 }) : les clés 2001 forment un seul bloc, déjà rangé par titre ; l'ordre de lecture est celui des titres, le plan est FETCH ← IXSCAN, sans tri. À droite, un intervalle, find({ annee: { $gte: 2000 } }).sort({ titre: 1 }) : deux blocs, 2000 puis 2001 ; l'ordre de lecture est Les Glaneurs, Amélie Poulain, Le Voyage de Chihiro, alors que l'ordre des titres est Amélie Poulain, Le Voyage de Chihiro, Les Glaneurs ; MongoDB doit trier en mémoire, le plan est FETCH ← SORT ← IXSCAN.</title>
  <defs><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="580" y="22" font-size="17" fill="#333" text-anchor="middle">Index <tspan font-family="monospace" font-weight="bold">{ annee: 1, titre: 1 }</tspan> : clés rangées par <tspan font-weight="bold">annee</tspan>, puis par <tspan font-weight="bold">titre</tspan> à annee égale</text>

  <!-- Égalité -->
  <rect x="2" y="36" width="570" height="298" rx="10" fill="#f0f4f8" stroke="#13aa52" stroke-width="2.5"/>
  <text x="18" y="64" font-size="18" font-weight="bold" fill="#4a90d9">Une égalité sur annee</text>
  <text x="18" y="88" font-family="monospace" font-size="15" fill="#333">find({ annee: 2001 }).sort({ titre: 1 })</text>

  <rect x="44" y="102" width="340" height="30" rx="7" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text y="123" font-family="monospace" font-size="15" fill="#999"><tspan x="56">1995</tspan><tspan x="110">"La Haine"</tspan></text>
  <rect x="44" y="140" width="340" height="30" rx="7" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text y="161" font-family="monospace" font-size="15" fill="#999"><tspan x="56">2000</tspan><tspan x="110">"Les Glaneurs et la Glaneuse"</tspan></text>
  <circle cx="24" cy="193" r="12" fill="#00684a"/>
  <text x="24" y="198" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="44" y="178" width="340" height="30" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text y="199" font-family="monospace" font-size="15"><tspan x="56" fill="#4a90d9" font-weight="bold">2001</tspan><tspan x="110" fill="#00684a">"Amélie Poulain"</tspan></text>
  <circle cx="24" cy="231" r="12" fill="#00684a"/>
  <text x="24" y="236" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="44" y="216" width="340" height="30" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text y="237" font-family="monospace" font-size="15"><tspan x="56" fill="#4a90d9" font-weight="bold">2001</tspan><tspan x="110" fill="#00684a">"Le Voyage de Chihiro"</tspan></text>
  <path d="M392,178 h6 v68 h-6" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="408" y="199" font-size="15" font-weight="bold" fill="#4a90d9">un seul bloc,</text>
  <text x="408" y="237" font-size="15" font-weight="bold" fill="#00684a">déjà trié par titre</text>

  <text x="18" y="276" font-size="15" fill="#333">ordre de lecture <tspan font-weight="bold">1, 2</tspan> = ordre des titres</text>
  <text x="18" y="314" font-size="16" fill="#555">Plan :</text>
  <rect x="70" y="295" width="68" height="28" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="104" y="314" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">FETCH</text>
  <line x1="166" y1="309" x2="146" y2="309" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="172" y="295" width="78" height="28" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="211" y="314" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="266" y="314" font-size="16" font-weight="bold" fill="#00684a">pas de tri</text>

  <!-- Intervalle -->
  <rect x="588" y="36" width="570" height="298" rx="10" fill="#f0f4f8" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="604" y="64" font-size="18" font-weight="bold" fill="#b06f00">Un intervalle sur annee</text>
  <text x="604" y="88" font-family="monospace" font-size="15" fill="#333">find({ annee: { $gte: 2000 } }).sort({ titre: 1 })</text>

  <rect x="630" y="102" width="340" height="30" rx="7" fill="#ffffff" stroke="#b8c4cf" stroke-width="2"/>
  <text y="123" font-family="monospace" font-size="15" fill="#999"><tspan x="642">1995</tspan><tspan x="696">"La Haine"</tspan></text>
  <circle cx="610" cy="155" r="12" fill="#00684a"/>
  <text x="610" y="160" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="630" y="140" width="340" height="30" rx="7" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text y="161" font-family="monospace" font-size="15"><tspan x="642" fill="#b06f00" font-weight="bold">2000</tspan><tspan x="696" fill="#00684a">"Les Glaneurs et la Glaneuse"</tspan></text>
  <circle cx="610" cy="193" r="12" fill="#00684a"/>
  <text x="610" y="198" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="630" y="178" width="340" height="30" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text y="199" font-family="monospace" font-size="15"><tspan x="642" fill="#4a90d9" font-weight="bold">2001</tspan><tspan x="696" fill="#00684a">"Amélie Poulain"</tspan></text>
  <circle cx="610" cy="231" r="12" fill="#00684a"/>
  <text x="610" y="236" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="630" y="216" width="340" height="30" rx="7" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text y="237" font-family="monospace" font-size="15"><tspan x="642" fill="#4a90d9" font-weight="bold">2001</tspan><tspan x="696" fill="#00684a">"Le Voyage de Chihiro"</tspan></text>
  <path d="M978,140 h6 v30 h-6" fill="none" stroke="#e8a838" stroke-width="2.2"/>
  <path d="M978,178 h6 v68 h-6" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="994" y="161" font-size="15" font-weight="bold" fill="#b06f00">bloc 2000</text>
  <text x="994" y="199" font-size="15" font-weight="bold" fill="#4a90d9">bloc 2001</text>
  <text x="994" y="237" font-size="15" fill="#c0392b">2 blocs, triés à part</text>

  <text x="604" y="276" font-size="15" fill="#333">ordre de lecture <tspan font-weight="bold">1, 2, 3</tspan> ; ordre des titres <tspan font-weight="bold" fill="#c0392b">2, 3, 1</tspan></text>
  <text x="604" y="314" font-size="16" fill="#555">Plan :</text>
  <rect x="656" y="295" width="68" height="28" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="690" y="314" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">FETCH</text>
  <line x1="752" y1="309" x2="732" y2="309" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="758" y="295" width="62" height="28" rx="7" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="789" y="314" font-family="monospace" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">SORT</text>
  <line x1="848" y1="309" x2="828" y2="309" stroke="#555" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="854" y="295" width="78" height="28" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="893" y="314" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="946" y="314" font-size="16" font-weight="bold" fill="#c0392b">SORT : tri en mémoire</text>
</svg>
