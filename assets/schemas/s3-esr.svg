<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">L'index composé { annee: 1, titre: 1 } range ses clés par annee, puis par titre à annee égale : (1995, La Haine), (2000, Les Glaneurs et la Glaneuse), (2001, Amélie Poulain), (2001, Le Voyage de Chihiro). À gauche, une égalité, find({ annee: 2001 }).sort({ titre: 1 }) : les clés 2001 forment un seul bloc, déjà trié par titre ; ordre de lecture 1, 2, égal à l'ordre des titres ; plan FETCH ← IXSCAN, pas de tri. À droite, un intervalle, find({ annee: { $gte: 2000 } }).sort({ titre: 1 }) : deux blocs, 2000 puis 2001, chacun trié à part ; ordre de lecture Les Glaneurs, Amélie Poulain, Le Voyage de Chihiro, alors que l'ordre des titres est 2, 3, 1 ; plan FETCH ← SORT ← IXSCAN, SORT est un tri en mémoire.</title>
  <text x="580" y="22" font-size="18" fill="#333" text-anchor="middle">Index <tspan font-family="monospace" font-weight="bold">{ annee: 1, titre: 1 }</tspan> : clés rangées par <tspan font-weight="bold">annee</tspan>, puis par <tspan font-weight="bold">titre</tspan> à <tspan font-family="monospace">annee</tspan> égale</text>
  <rect x="2" y="34" width="566" height="304" rx="10" fill="#f7f9fb" stroke="#13aa52" stroke-width="2.5"/>
  <text x="16" y="62" font-size="19" font-weight="bold" fill="#00684a">Une égalité sur <tspan font-family="monospace">annee</tspan></text>
  <text x="16" y="90" font-family="monospace" font-size="18" fill="#333">find({ annee: 2001 }).sort({ titre: 1 })</text>
  <rect x="46" y="104" width="330" height="34" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
  <text x="56" y="128" font-family="monospace" font-size="18" fill="#999"><tspan font-weight="bold">1995</tspan>  "La Haine"</text>
  <rect x="46" y="144" width="330" height="34" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
  <text x="56" y="168" font-family="monospace" font-size="18" fill="#999"><tspan font-weight="bold">2000</tspan>  "Les Glaneurs…"</text>
  <rect x="46" y="184" width="330" height="34" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="56" y="208" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold">2001</tspan>  "Amélie Poulain"</text>
  <circle cx="26" cy="201" r="14" fill="#00684a"/><text x="26" y="207" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="46" y="224" width="330" height="34" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="56" y="248" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold">2001</tspan>  "Le Voyage de Chihiro"</text>
  <circle cx="26" cy="241" r="14" fill="#00684a"/><text x="26" y="247" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <path d="M384,184 h8 V258 h-8" fill="none" stroke="#00684a" stroke-width="2"/>
  <text x="400" y="217" font-size="18" font-weight="bold" fill="#00684a">un seul bloc,</text>
  <text x="400" y="241" font-size="18" font-weight="bold" fill="#00684a">déjà trié</text>
  <text x="16" y="284" font-size="18" fill="#555">lu 1, 2 = l'ordre des titres</text>
  <text x="16" y="322" font-size="18" fill="#555">Plan :</text>
  <rect x="78" y="300" width="69" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="112" y="322" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">FETCH</text>
  <text x="159" y="323" font-size="18" fill="#555" text-anchor="middle">←</text>
  <rect x="171" y="300" width="80" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="211" y="322" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="263" y="322" font-size="18" font-weight="bold" fill="#00684a">pas de tri</text>
  <rect x="592" y="34" width="566" height="304" rx="10" fill="#f7f9fb" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="606" y="62" font-size="19" font-weight="bold" fill="#c0392b">Un intervalle sur <tspan font-family="monospace">annee</tspan></text>
  <text x="606" y="90" font-family="monospace" font-size="18" fill="#333">find({ annee: { $gte: 2000 } }).sort({ titre: 1 })</text>
  <rect x="636" y="104" width="330" height="34" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
  <text x="646" y="128" font-family="monospace" font-size="18" fill="#999"><tspan font-weight="bold">1995</tspan>  "La Haine"</text>
  <rect x="636" y="144" width="330" height="34" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="646" y="168" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold">2000</tspan>  "Les Glaneurs…"</text>
  <circle cx="616" cy="161" r="14" fill="#00684a"/><text x="616" y="167" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="636" y="184" width="330" height="34" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="646" y="208" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold">2001</tspan>  "Amélie Poulain"</text>
  <circle cx="616" cy="201" r="14" fill="#00684a"/><text x="616" y="207" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="636" y="224" width="330" height="34" rx="6" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="646" y="248" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold">2001</tspan>  "Le Voyage de Chihiro"</text>
  <circle cx="616" cy="241" r="14" fill="#00684a"/><text x="616" y="247" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <path d="M974,144 h8 V178 h-8" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="990" y="167" font-size="18" font-weight="bold" fill="#c0392b">bloc 2000</text>
  <path d="M974,184 h8 V258 h-8" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="990" y="227" font-size="18" font-weight="bold" fill="#c0392b">bloc 2001</text>
  <text x="606" y="284" font-size="18" fill="#555">lu 1, 2, 3 ; ordre des titres : 2, 3, 1</text>
  <text x="606" y="322" font-size="18" fill="#555">Plan :</text>
  <rect x="668" y="300" width="69" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="702" y="322" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">FETCH</text>
  <text x="749" y="323" font-size="18" fill="#555" text-anchor="middle">←</text>
  <rect x="761" y="300" width="58" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="322" font-family="monospace" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">SORT</text>
  <text x="831" y="323" font-size="18" fill="#555" text-anchor="middle">←</text>
  <rect x="843" y="300" width="80" height="32" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="883" y="322" font-family="monospace" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">IXSCAN</text>
  <text x="935" y="322" font-size="18" font-weight="bold" fill="#c0392b">tri en mémoire</text>
</svg>
