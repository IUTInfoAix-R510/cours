<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Pipeline d'agrégation de gauche à droite. La collection capteurs contient 5 documents : C1 Salon, C2 Salon, C3 Cuisine, C4 Salon et C5 Chambre ; C2, encadré en rouge, est un capteur d'humidité, les autres mesurent la température. L'étape $match filtre sur le type (WHERE) : C2 est écarté, il reste 4 documents. L'étape $unwind crée un document par mesure (JOIN) : 3 pour C1, 2 pour C3, 1 pour C4 et 3 pour C5, soit 9 documents. L'étape $group crée un document par pièce (GROUP BY), 3 documents dans un ordre quelconque : Cuisine étage 0, moyenne 20.5, nb 2 ; Salon étage 0, moyenne 20.75, nb 4 ; Chambre étage 1, moyenne 17.5, nb 3. L'étape $sort trie par moyenne décroissante (ORDER BY) : le résultat contient toujours 3 documents, dans l'ordre Salon, Cuisine, Chambre.</title>
