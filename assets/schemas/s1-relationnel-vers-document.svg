<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">À gauche, en SQL, trois tables : films (F01, Le Voyage de Chihiro, 2001, realisateur_id R1), realisateurs (R1, Miyazaki, Japon) et films_genres (F01 animation, F01 fantastique), reliées par des clés étrangères. À droite, le document MongoDB F01 : la table realisateurs devient le document imbriqué realisation, la table films_genres devient le tableau genres. Le document se lit en une fois, sans jointure.</title>
  <defs>
    <marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="bleu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/>
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8a838"/>
    </marker>
  </defs>

  <!-- Titres des deux moitiés -->
  <text x="270" y="28" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">SQL : trois tables</text>
  <text x="890" y="28" text-anchor="middle" font-size="24" font-weight="bold" fill="#00684a">MongoDB : un document</text>
  <line x1="560" y1="15" x2="560" y2="415" stroke="#ccc" stroke-width="2"/>

  <!-- Table films -->
  <text x="40" y="66" font-size="19" font-weight="bold" font-family="monospace">films</text>
  <rect x="40" y="74" width="500" height="70" rx="6" fill="#f0f4f8" stroke="#4a6b8a" stroke-width="2"/>
  <line x1="40" y1="106" x2="540" y2="106" stroke="#4a6b8a" stroke-width="1.5"/>
  <g font-family="monospace" font-size="17">
    <text x="50" y="97" font-weight="bold">id</text>
    <text x="95" y="97" font-weight="bold">titre</text>
    <text x="318" y="97" font-weight="bold">annee</text>
    <text x="385" y="97" font-weight="bold">realisateur_id</text>
    <text x="50" y="131">F01</text>
    <text x="95" y="131">Le Voyage de Chihiro</text>
    <text x="318" y="131">2001</text>
    <text x="385" y="131" fill="#4a90d9" font-weight="bold">R1</text>
  </g>

  <!-- Table realisateurs -->
  <text x="40" y="196" font-size="19" font-weight="bold" font-family="monospace">realisateurs</text>
  <rect x="40" y="204" width="300" height="70" rx="6" fill="#f0f4f8" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="40" y1="236" x2="340" y2="236" stroke="#4a90d9" stroke-width="1.5"/>
  <g font-family="monospace" font-size="17">
    <text x="50" y="227" font-weight="bold">id</text>
    <text x="110" y="227" font-weight="bold">nom</text>
    <text x="240" y="227" font-weight="bold">pays</text>
    <text x="50" y="261" fill="#4a90d9" font-weight="bold">R1</text>
    <text x="110" y="261">Miyazaki</text>
    <text x="240" y="261">Japon</text>
  </g>
  <!-- Clé étrangère films.realisateur_id -> realisateurs (R1) -->
  <path d="M 395 148 C 395 195, 380 214, 344 216" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fk)"/>
  <text x="410" y="190" font-size="15" fill="#555">clé étrangère</text>

  <!-- Table films_genres -->
  <text x="40" y="316" font-size="19" font-weight="bold" font-family="monospace">films_genres</text>
  <rect x="40" y="324" width="300" height="94" rx="6" fill="#f0f4f8" stroke="#e8a838" stroke-width="2.5"/>
  <line x1="40" y1="356" x2="340" y2="356" stroke="#e8a838" stroke-width="1.5"/>
  <g font-family="monospace" font-size="17">
    <text x="50" y="347" font-weight="bold">film_id</text>
    <text x="160" y="347" font-weight="bold">genre</text>
    <text x="50" y="381">F01</text>
    <text x="160" y="381">animation</text>
    <text x="50" y="407">F01</text>
    <text x="160" y="407">fantastique</text>
  </g>
  <!-- Clé étrangère films_genres.film_id -> films (F01), par la marge gauche -->
  <path d="M 38 376 C 12 376, 12 126, 36 126" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fk)"/>
  <text x="16" y="250" font-size="15" fill="#555" text-anchor="middle" transform="rotate(-90 16 250)">clé étrangère</text>

  <!-- Document MongoDB -->
  <rect x="600" y="60" width="550" height="300" rx="12" fill="#e6f4ee" stroke="#13aa52" stroke-width="3"/>
  <g font-family="monospace" font-size="18">
    <text x="620" y="96">{</text>
    <text x="640" y="128">_id: "F01",</text>
    <text x="640" y="160">titre: "Le Voyage de Chihiro",</text>
    <text x="640" y="192">annee: 2001,</text>
    <rect x="632" y="207" width="505" height="58" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
    <text x="640" y="230">realisation: { nom: "Miyazaki",</text>
    <text x="777" y="256">pays: "Japon" },</text>
    <rect x="632" y="276" width="505" height="34" rx="6" fill="#ffffff" stroke="#e8a838" stroke-width="2.5"/>
    <text x="640" y="299">genres: ["animation", "fantastique"]</text>
    <text x="620" y="340">}</text>
  </g>
  <text x="1140" y="200" text-anchor="end" font-size="15" font-weight="bold" fill="#4a90d9">document imbriqué</text>
  <text x="1140" y="328" text-anchor="end" font-size="15" font-weight="bold" fill="#c27c0e">tableau</text>

  <!-- Flèches des tables vers le document -->
  <path d="M 342 262 C 480 262, 500 236, 626 236" fill="none" stroke="#4a90d9" stroke-width="3" marker-end="url(#bleu)"/>
  <path d="M 342 395 C 480 395, 520 293, 626 293" fill="none" stroke="#e8a838" stroke-width="3" marker-end="url(#orange)"/>

  <!-- Conclusions -->
  <text x="875" y="395" text-anchor="middle" font-size="19" fill="#00684a" font-weight="bold">lu en une fois, sans jointure</text>
  <text x="875" y="420" text-anchor="middle" font-size="16" fill="#555">en SQL : SELECT … JOIN realisateurs … JOIN films_genres …</text>
</svg>
