  <text x="16" y="237" font-size="19" font-weight="bold" fill="#333">E4</text>
  <text x="62" y="237" font-size="18" fill="#333"><tspan font-weight="bold">10 sept.</tspan>, 19 h 00</text>
  <text x="326" y="237" font-size="18" fill="#333" text-anchor="end"><tspan font-weight="bold">18</tspan> auditeurs</text>
