  <path d="M342,230 C380,230 390,294 424,294" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <path d="M342,286 C380,286 390,314 424,314" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="2" y="370" font-size="18" fill="#444">Le <tspan font-weight="bold">jour UTC</tspan> de la mesure choisit le bucket : 23 h 50 le 7 et 0 h 10 le 8 ne vont pas dans le même. Mesures triées par heure.</text>
