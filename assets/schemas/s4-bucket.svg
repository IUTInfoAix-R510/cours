<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 376" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le pattern Bucket sur les écoutes. À gauche, la collection ecoutes, une mesure par document : E1 le 7 septembre à 23 h 50 (40 auditeurs), E1 le 8 à 0 h 10 (35), E1 le 8 à 7 h 30 (52), E4 le 10 à 19 h (18), E4 le 10 à 19 h 30 (21). À droite, un document par épisode et par jour UTC : E1-2026-09-07 avec 1 mesure (nb 1, max 40), E1-2026-09-08 avec 2 mesures (nb 2, max 52), E4-2026-09-10 avec 2 mesures (nb 2, max 21). Chaque bucket a un _id lisible (épisode et jour), l'épisode, le jour, le nombre de mesures nb, le maximum max, et le tableau mesures trié par heure. Les deux premières écoutes de E1 ne vont pas dans le même bucket : le jour UTC change à minuit.</title>
  <defs><marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="2" y="24" font-size="18" fill="#444"><tspan font-family="monospace" font-size="21" font-weight="bold" fill="#00684a">ecoutes</tspan>  une mesure par document</text>
  <text x="432" y="24" font-size="18" fill="#444"><tspan font-family="monospace" font-size="21" font-weight="bold" fill="#00684a">ecoutes_par_jour</tspan>  un document par épisode et par jour UTC</text>
