  <text x="446" y="330" font-family="monospace" font-size="18" fill="#333">nb: <tspan font-weight="bold">2</tspan>, max: <tspan font-weight="bold">21</tspan>, mesures: [</text>
  <rect x="740" y="306" width="150" height="36" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="815" y="330" font-size="18" fill="#333" text-anchor="middle">19 h 00 · 18</text>
  <rect x="900" y="306" width="150" height="36" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
