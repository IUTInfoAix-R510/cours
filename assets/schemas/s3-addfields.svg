<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 190" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le film Chihiro avant et après $addFields: { nb_notes: { $size: "$notes" } }. L'expression "$notes" donne la valeur du champ notes, un tableau de 2 documents ; $size donne sa taille, 2. Après l'étape, les champs du film sont toujours là, et nb_notes: 2 est ajouté à la fin.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="4" y="22" font-size="19" font-weight="bold" fill="#333">avant</text>
  <rect x="2" y="34" width="300" height="134" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="16" y="66">titre: "Chihiro",</text>
    <text x="16" y="96">annee: 2001, …,</text>
    <text x="16" y="126"><tspan fill="#2f6db0" font-weight="bold">notes</tspan>: [ {…}, {…} ]</text>
  </g>

  <text x="560" y="22" font-family="monospace" font-size="19" fill="#333" text-anchor="middle">{ <tspan fill="#00684a" font-weight="bold">$addFields</tspan>: { nb_notes: { <tspan fill="#00684a" font-weight="bold">$size</tspan>: <tspan fill="#2f6db0" font-weight="bold">"$notes"</tspan> } } }</text>
  <line x1="306" y1="119" x2="336" y2="119" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <g font-family="monospace" font-size="19" text-anchor="middle">
    <rect x="344" y="96" width="110" height="44" rx="7" fill="#fff" stroke="#4a90d9" stroke-width="2"/>
    <text x="399" y="125" fill="#2f6db0" font-weight="bold">"$notes"</text>
    <rect x="484" y="96" width="140" height="44" rx="7" fill="#fff" stroke="#b8c4cf" stroke-width="2"/>
    <text x="554" y="125" fill="#333">[ {…}, {…} ]</text>
    <rect x="654" y="96" width="120" height="44" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
    <text x="714" y="125" fill="#00684a" font-weight="bold">$size → 2</text>
  </g>
  <line x1="456" y1="118" x2="476" y2="118" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <line x1="626" y1="118" x2="646" y2="118" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <g font-size="18" fill="#555" text-anchor="middle">
    <text x="399" y="168">la valeur</text>
    <text x="554" y="168">2 documents</text>
    <text x="714" y="168">sa taille</text>
  </g>
  <line x1="776" y1="118" x2="806" y2="118" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <text x="1154" y="22" font-size="19" font-weight="bold" fill="#333" text-anchor="end">après</text>
  <rect x="814" y="34" width="344" height="154" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <g font-family="monospace" font-size="19" fill="#333">
    <text x="828" y="66">titre: "Chihiro",</text>
    <text x="828" y="96">annee: 2001, …,</text>
    <text x="828" y="126">notes: [ {…}, {…} ],</text>
  </g>
  <rect x="824" y="138" width="150" height="38" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="836" y="164" font-family="monospace" font-size="19" font-weight="bold" fill="#00684a">nb_notes: 2</text>
  <text x="984" y="164" font-size="18" fill="#555">ajouté</text>
</svg>
