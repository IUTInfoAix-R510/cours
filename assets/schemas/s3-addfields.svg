<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 222" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">$addFields: { nb_notes: { $size: "$notes" } } sur le film Chihiro. Avant : titre, annee, duree, realisateur, genres et notes, un tableau de deux notes (presse 5, public 4). L'expression "$notes" donne la valeur du champ notes, un tableau de 2 documents ; $size donne sa taille, 2. Après : les six champs sont toujours là, et nb_notes: 2 est ajouté à la fin.</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- Avant -->
  <text x="2" y="20" font-size="17" font-weight="bold" fill="#333">avant</text>
  <rect x="2" y="30" width="330" height="186" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <g font-family="monospace" font-size="14" fill="#333">
    <text x="16" y="56">titre: "Le Voyage de Chihiro",</text>
    <text x="16" y="80">annee: 2001, duree: 125,</text>
    <text x="16" y="104">realisateur: "Miyazaki",</text>
    <text x="16" y="128">genres: [ … ],</text>
    <text x="16" y="153"><tspan fill="#4a90d9" font-weight="bold">notes</tspan>: [</text>
    <text x="30" y="178">{ source: "presse", note: 5 },</text>
    <text x="30" y="202">{ source: "public", note: 4 } ]</text>
  </g>
  <rect x="10" y="137" width="80" height="23" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <line x1="90" y1="148" x2="352" y2="148" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#flb)"/>

  <!-- L'expression, évaluée pour ce film -->
  <text x="560" y="104" font-family="monospace" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">{ <tspan fill="#00684a">$size</tspan>: <tspan fill="#4a90d9">"$notes"</tspan> }</text>
  <text x="560" y="66" font-size="15" fill="#555" text-anchor="middle">l'expression, calculée pour ce film :</text>

  <rect x="356" y="131" width="120" height="34" rx="7" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="416" y="154" font-family="monospace" font-size="16" font-weight="bold" fill="#4a90d9" text-anchor="middle">"$notes"</text>
  <text x="416" y="188" font-size="14" fill="#555" text-anchor="middle">la valeur du champ</text>
  <line x1="476" y1="148" x2="496" y2="148" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <rect x="500" y="131" width="120" height="34" rx="7" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="560" y="153" font-family="monospace" font-size="15" fill="#333" text-anchor="middle">[ {…}, {…} ]</text>
  <text x="560" y="188" font-size="14" fill="#555" text-anchor="middle">2 documents</text>
  <line x1="620" y1="148" x2="640" y2="148" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <rect x="644" y="131" width="120" height="34" rx="7" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="704" y="154" font-family="monospace" font-size="16" fill="#333" text-anchor="middle"><tspan font-weight="bold" fill="#00684a">$size</tspan> → <tspan font-weight="bold">2</tspan></text>
  <text x="704" y="188" font-size="14" fill="#555" text-anchor="middle">sa taille</text>
  <line x1="764" y1="148" x2="832" y2="174" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>

  <!-- Après -->
  <text x="828" y="20" font-size="17" font-weight="bold" fill="#333">après</text>
  <rect x="828" y="30" width="330" height="186" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <g font-family="monospace" font-size="14" fill="#333">
    <text x="842" y="56">titre: "Le Voyage de Chihiro",</text>
    <text x="842" y="80">annee: 2001, duree: 125,</text>
    <text x="842" y="104">realisateur: "Miyazaki",</text>
    <text x="842" y="128">genres: [ … ],</text>
    <text x="842" y="152">notes: [ … ],</text>
  </g>
  <rect x="836" y="164" width="140" height="28" rx="6" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="846" y="183" font-family="monospace" font-size="15" font-weight="bold" fill="#00684a">nb_notes: 2</text>
  <text x="988" y="183" font-size="14" fill="#555">ajouté à la fin</text>
</svg>
