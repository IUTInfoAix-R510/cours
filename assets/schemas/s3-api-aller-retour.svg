<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 368" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">L'aller-retour d'une requête dans le projet, sur les films, en six messages entre quatre acteurs : le navigateur (le front du projet), Javalin (une URL, une fonction), Java avec le pilote MongoDB (qui fabrique la requête) et MongoDB (qui l'exécute sur la collection films). Aller : 1, le navigateur demande GET /api/annees/2001/films ; 2, la route Javalin appelle la méthode Java filmsDeLAnnee(2001) ; 3, le pilote envoie à MongoDB la requête find({ annee: 2001 }). Retour : 4, MongoDB renvoie 2 documents, Amélie et Chihiro ; 5, la méthode rend une List de Document de 2 éléments ; 6, Javalin répond avec le statut 200 et un corps JSON. Le navigateur reçoit [{"titre":"Amélie Poulain","duree":122},{"titre":"Le Voyage de Chihiro","duree":125}].</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- acteurs -->
  <rect x="10" y="2" width="220" height="62" rx="10" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="120" y="28" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Navigateur</text>
  <text x="120" y="53" font-size="18" fill="#555" text-anchor="middle">le front du projet</text>
  <rect x="340" y="2" width="220" height="62" rx="10" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="450" y="28" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Javalin</text>
  <text x="450" y="53" font-size="18" fill="#555" text-anchor="middle">une URL, une fonction</text>
  <rect x="650" y="2" width="220" height="62" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="760" y="28" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Java + pilote</text>
  <text x="760" y="53" font-size="18" fill="#555" text-anchor="middle">fabrique la requête</text>
  <rect x="940" y="2" width="218" height="62" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="1049" y="28" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">MongoDB</text>
  <text x="1049" y="53" font-size="18" fill="#555" text-anchor="middle">l'exécute sur films</text>

  <!-- lignes de vie -->
  <g stroke="#b8c4cf" stroke-width="2" stroke-dasharray="6 5">
    <line x1="120" y1="64" x2="120" y2="316"/>
    <line x1="450" y1="64" x2="450" y2="316"/>
    <line x1="760" y1="64" x2="760" y2="316"/>
    <line x1="1049" y1="64" x2="1049" y2="316"/>
  </g>

  <!-- aller -->
  <g font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="120" cy="104" r="15" fill="#00684a"/><text x="120" y="110">1</text>
    <circle cx="450" cy="148" r="15" fill="#00684a"/><text x="450" y="154">2</text>
    <circle cx="760" cy="192" r="15" fill="#00684a"/><text x="760" y="198">3</text>
    <circle cx="1049" cy="236" r="15" fill="#4a90d9"/><text x="1049" y="242">4</text>
    <circle cx="760" cy="280" r="15" fill="#4a90d9"/><text x="760" y="286">5</text>
    <circle cx="450" cy="316" r="15" fill="#4a90d9"/><text x="450" y="322">6</text>
  </g>
  <line x1="134" y1="112" x2="440" y2="112" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="140" y="102" font-family="monospace" font-size="18" fill="#333"><tspan font-weight="bold">GET</tspan> /api/annees/<tspan fill="#b06f00" font-weight="bold">2001</tspan>/films</text>
  <line x1="464" y1="156" x2="750" y2="156" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="472" y="146" font-family="monospace" font-size="18" fill="#333">filmsDeLAnnee(<tspan fill="#b06f00" font-weight="bold">2001</tspan>)</text>
  <line x1="774" y1="200" x2="1039" y2="200" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="782" y="190" font-family="monospace" font-size="18" fill="#333">find({ annee: <tspan fill="#b06f00" font-weight="bold">2001</tspan> })</text>

  <!-- retour -->
  <line x1="1035" y1="244" x2="770" y2="244" stroke="#555" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#fl)"/>
  <text x="790" y="234" font-size="18" fill="#333"><tspan font-weight="bold">2 documents</tspan></text>
  <line x1="746" y1="288" x2="460" y2="288" stroke="#555" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#fl)"/>
  <text x="472" y="278" font-size="18" fill="#333"><tspan font-family="monospace" font-weight="bold">List&lt;Document&gt;</tspan>, 2 éléments</text>
  <line x1="436" y1="316" x2="130" y2="316" stroke="#555" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#fl)"/>
  <text x="150" y="306" font-size="18" fill="#333">statut <tspan font-weight="bold">200</tspan>, corps en <tspan font-weight="bold">JSON</tspan></text>

  <g font-size="18" fill="#777" text-anchor="end">
    <text x="1156" y="160">aller</text>
    <text x="1156" y="292">retour</text>
  </g>

  <!-- ce que reçoit le navigateur -->
  <rect x="2" y="330" width="1156" height="36" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <text x="14" y="354" font-size="18" fill="#555">reçu :</text>
  <text x="70" y="354" font-family="monospace" font-size="18" fill="#333">[{"titre":"Amélie Poulain","duree":122},{"titre":"Le Voyage de Chihiro","duree":125}]</text>
</svg>
