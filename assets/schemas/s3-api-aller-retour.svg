<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 324" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">L'aller-retour d'une requête dans le projet, sur les films, en six messages entre quatre acteurs : le navigateur (le front du projet), Javalin (qui associe une URL à une fonction), Java avec le pilote MongoDB (qui fabrique et envoie la requête) et MongoDB (qui l'exécute sur la collection films). Aller : 1, le navigateur demande GET /api/annees/2001/films ; 2, la route Javalin appelle la méthode Java filmsDeLAnnee(2001) ; 3, le pilote envoie à MongoDB la requête find({ annee: 2001 }). Retour : 4, MongoDB renvoie 2 documents ; 5, la méthode rend une List de Document de 2 éléments ; 6, Javalin répond avec le statut 200 et un corps JSON. Le navigateur reçoit [{"titre":"Amélie Poulain","duree":122},{"titre":"Le Voyage de Chihiro","duree":125}].</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- les quatre acteurs -->
  <rect x="10" y="2" width="240" height="58" rx="10" fill="#f3e8f8" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="130" y="27" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Navigateur</text>
  <text x="130" y="49" font-size="14" fill="#555" text-anchor="middle">le front du projet</text>

  <rect x="310" y="2" width="240" height="58" rx="10" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="430" y="27" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Javalin</text>
  <text x="430" y="49" font-size="14" fill="#555" text-anchor="middle">associe une URL à une fonction</text>

  <rect x="610" y="2" width="240" height="58" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2.5"/>
  <text x="730" y="27" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Java + pilote</text>
  <text x="730" y="49" font-size="14" fill="#555" text-anchor="middle">fabrique et envoie la requête</text>

  <rect x="910" y="2" width="240" height="58" rx="10" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="1030" y="27" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">MongoDB</text>
  <text x="1030" y="49" font-size="14" fill="#555" text-anchor="middle">exécute sur la collection films</text>

  <!-- lignes de vie -->
  <g stroke="#b8c4cf" stroke-width="2" stroke-dasharray="6 5">
    <line x1="130" y1="60" x2="130" y2="284"/>
    <line x1="430" y1="60" x2="430" y2="284"/>
    <line x1="730" y1="60" x2="730" y2="284"/>
    <line x1="1030" y1="60" x2="1030" y2="284"/>
  </g>

  <!-- aller -->
  <line x1="135" y1="98" x2="420" y2="98" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <circle cx="152" cy="83" r="11" fill="#00684a"/>
  <text x="152" y="88" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="172" y="89" font-family="monospace" font-size="15" fill="#333"><tspan font-weight="bold">GET</tspan> /api/annees/<tspan fill="#b06f00" font-weight="bold">2001</tspan>/films</text>

  <line x1="435" y1="134" x2="720" y2="134" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <circle cx="452" cy="119" r="11" fill="#00684a"/>
  <text x="452" y="124" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="472" y="125" font-family="monospace" font-size="15" fill="#333">filmsDeLAnnee(<tspan fill="#b06f00" font-weight="bold">2001</tspan>)</text>

  <line x1="735" y1="170" x2="1020" y2="170" stroke="#555" stroke-width="2.2" marker-end="url(#fl)"/>
  <circle cx="752" cy="155" r="11" fill="#00684a"/>
  <text x="752" y="160" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="772" y="161" font-family="monospace" font-size="15" fill="#333">find({ annee: <tspan fill="#b06f00" font-weight="bold">2001</tspan> })</text>

  <!-- retour -->
  <line x1="1025" y1="206" x2="740" y2="206" stroke="#555" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#fl)"/>
  <circle cx="752" cy="189" r="11" fill="#4a90d9"/>
  <text x="752" y="194" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="772" y="195" font-size="15" fill="#333"><tspan font-weight="bold">2 documents</tspan> (Amélie, Chihiro)</text>

  <line x1="725" y1="242" x2="440" y2="242" stroke="#555" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#fl)"/>
  <circle cx="452" cy="225" r="11" fill="#4a90d9"/>
  <text x="452" y="230" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="472" y="231" font-size="15" fill="#333"><tspan font-family="monospace" font-weight="bold">List&lt;Document&gt;</tspan> de 2 éléments</text>

  <line x1="425" y1="278" x2="140" y2="278" stroke="#555" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#fl)"/>
  <circle cx="152" cy="261" r="11" fill="#4a90d9"/>
  <text x="152" y="266" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="172" y="267" font-size="15" fill="#333">statut <tspan font-weight="bold">200</tspan>, corps en <tspan font-weight="bold">JSON</tspan></text>

  <text x="1150" y="125" font-size="14" fill="#777" text-anchor="end">aller</text>
  <text x="1150" y="233" font-size="14" fill="#777" text-anchor="end">retour</text>

  <!-- ce que reçoit le navigateur -->
  <rect x="10" y="288" width="1140" height="34" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <text x="24" y="310" font-size="15" fill="#555">le navigateur reçoit :</text>
  <text x="182" y="310" font-family="monospace" font-size="14" fill="#333">[{"titre":"Amélie Poulain","duree":122},{"titre":"Le Voyage de Chihiro","duree":125}]</text>
</svg>
