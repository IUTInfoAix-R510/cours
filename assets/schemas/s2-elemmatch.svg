<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Les deux séances d'Amélie Poulain : salle 1, 0 place libre ; salle 3, 25 places libres. Avec deux conditions séparées, salle: 1 est vraie pour la première séance et libres &gt; 0 pour la seconde : Amélie Poulain est renvoyé. Avec $elemMatch, aucune séance ne vérifie les deux : Amélie Poulain est écarté.</title>
  <style>
    .c { font-size: 19px; fill: #333; font-family: monospace; }
    .t { font-size: 21px; font-weight: bold; }
    .ok { fill: #00684a; font-weight: bold; }
    .ko { fill: #c0392b; font-weight: bold; }
    .r { font-size: 19px; font-weight: bold; }
  </style>

  <text class="t" x="2" y="22" fill="#333">Les séances d'Amélie Poulain</text>

  <!-- séances -->
  <rect x="2" y="34" width="266" height="92" rx="8" fill="#f0f4f8" stroke="#00684a" stroke-width="2"/>
  <text class="c" x="18" y="70">salle: 1</text>
  <text class="c" x="18" y="106">libres: 0</text>
  <rect x="292" y="34" width="266" height="92" rx="8" fill="#f0f4f8" stroke="#00684a" stroke-width="2"/>
  <text class="c" x="308" y="70">salle: 3</text>
  <text class="c" x="308" y="106">libres: 25</text>

  <!-- conditions séparées -->
  <rect x="2" y="144" width="556" height="126" rx="10" fill="#fff8ec" stroke="#e8a838" stroke-width="2"/>
  <text class="t" x="18" y="172" fill="#b06f00">Deux conditions séparées</text>
  <text class="c" x="135" y="212" text-anchor="middle">salle: 1 <tspan class="ok">✓</tspan></text>
  <text class="c" x="425" y="212" text-anchor="middle">libres &gt; 0 <tspan class="ok">✓</tspan></text>
  <text class="r" x="18" y="254" fill="#b06f00">→ une séance par condition : film renvoyé</text>

  <!-- $elemMatch -->
  <rect x="2" y="286" width="556" height="132" rx="10" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text class="t" x="18" y="314" fill="#00684a"><tspan font-family="monospace">$elemMatch</tspan> : la même séance</text>
  <text class="c" x="135" y="354" text-anchor="middle">salle <tspan class="ok">✓</tspan>  libres <tspan class="ko">✗</tspan></text>
  <text class="c" x="425" y="354" text-anchor="middle">salle <tspan class="ko">✗</tspan>  libres <tspan class="ok">✓</tspan></text>
  <text class="r" x="18" y="398" fill="#00684a">→ aucune séance ne vérifie les deux : écarté</text>
</svg>
