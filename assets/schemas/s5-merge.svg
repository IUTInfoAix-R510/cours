<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Le piège de MERGE, sur l'exemple d'essai, en trois colonnes. Avant : le nœud Gaspard, à Nice, sans aucune relation, et le nœud Comète, qui a déjà trois fans. Au milieu, en rouge, à éviter : MERGE (:Personne {nom: 'Gaspard'})-[:AIME]-&gt;(:Jeu {titre: 'Comète'}). Gaspard n'aime pas encore Comète, le motif entier n'existe pas : MERGE crée un nouveau Gaspard et un nouveau Comète, reliés par AIME : 2 Gaspard, 2 Comète. À droite, en vert, à suivre : MATCH (g:Personne {nom: 'Gaspard'}), MATCH (j:Jeu {titre: 'Comète'}), puis MERGE (g)-[:AIME]-&gt;(j) : les deux nœuds existants sont retrouvés, une seule relation AIME est créée entre eux ; relancée, la requête ne change rien.</title>
  <defs><marker id="fl-bleu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/></marker><marker id="fl-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6400"/></marker><marker id="fl-vert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00684a"/></marker><marker id="fl-rouge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="fl-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker><marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="fl-noir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="0" y="0" width="260" height="328" rx="8" fill="#f0f4f8" stroke="#b8c4cf" stroke-width="2"/>
  <text x="14" y="30" font-size="20" font-weight="bold" fill="#333">Avant</text>
  <rect x="270" y="0" width="440" height="328" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="284" y="30" font-size="20" font-weight="bold" fill="#c0392b">À éviter</text>
  <rect x="720" y="0" width="440" height="328" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="734" y="30" font-size="20" font-weight="bold" fill="#00684a">À suivre</text>
  <rect x="20" y="92" width="140" height="56" rx="14" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="90" y="117" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Gaspard</text>
  <text x="90" y="140" font-size="18" fill="#555" text-anchor="middle">Nice</text>
  <rect x="110" y="202" width="130" height="56" rx="14" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="175" y="227" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Comète</text>
  <text x="175" y="250" font-size="18" fill="#555" text-anchor="middle">3 fans</text>
  <text x="14" y="310" font-size="18" fill="#555">Gaspard n'aime rien.</text>
  <text x="282" y="64" font-size="18" font-family="monospace" fill="#333">MERGE (:Personne {nom: 'Gaspard'})</text>
  <text x="282" y="88" font-size="18" font-family="monospace" fill="#333">  -[:AIME]-&gt;(:Jeu {titre: 'Comète'})</text>
  <rect x="295" y="134" width="130" height="52" rx="14" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="360" y="166.3" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Gaspard</text>
  <rect x="295" y="229" width="130" height="52" rx="14" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="360" y="261.3" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Comète</text>
  <rect x="525" y="134" width="130" height="52" rx="14" fill="#fdeeee" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="590" y="166.3" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Gaspard</text>
  <rect x="525" y="229" width="130" height="52" rx="14" fill="#fdeeee" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="590" y="261.3" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Comète</text>
  <line x1="590" y1="190" x2="590" y2="222" stroke="#c0392b" stroke-width="3" marker-end="url(#fl-rouge)"/>
  <text x="550" y="212" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">AIME</text>
  <text x="282" y="312" font-size="18" font-weight="bold" fill="#c0392b">tout est créé : 2 Gaspard, 2 Comète</text>
  <text x="732" y="64" font-size="18" font-family="monospace" fill="#333">MATCH (g:Personne {nom: 'Gaspard'})</text>
  <text x="732" y="88" font-size="18" font-family="monospace" fill="#333">MATCH (j:Jeu {titre: 'Comète'})</text>
  <text x="732" y="112" font-size="18" font-family="monospace" fill="#333">MERGE (g)-[:AIME]-&gt;(j)</text>
  <rect x="765" y="174" width="130" height="52" rx="14" fill="#e3eefa" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="830" y="206.3" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Gaspard</text>
  <rect x="995" y="229" width="130" height="52" rx="14" fill="#fdf3e0" stroke="#e8a838" stroke-width="2.5"/>
  <text x="1060" y="261.3" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Comète</text>
  <line x1="899" y1="216.5" x2="988" y2="237.783" stroke="#00684a" stroke-width="4" marker-end="url(#fl-vert)"/>
  <text x="943.5" y="213.141" font-size="18" font-weight="bold" fill="#00684a" text-anchor="middle">AIME</text>
  <text x="732" y="312" font-size="18" font-weight="bold" fill="#00684a">une relation ; relancée, rien</text>
</svg>
