<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 292" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deux nouvelles écoutes arrivent, une à la fois. 1, E1 le 8 septembre à 12 h, 61 auditeurs : le bucket E1-2026-09-08 existe ; la mesure est ajoutée à la fin du tableau mesures, nb passe de 2 à 3, max de 52 à 61 (61 est plus grand). 2, E4 le 11 septembre à 7 h, 9 auditeurs : le bucket E4-2026-09-11 n'existe pas ; il est créé, avec episode et jour, nb: 1, max: 9 et un tableau d'une mesure. Une même écriture « trouve le bucket ou crée-le » : c'est un upsert (TP1).</title>
  <defs>
    <marker id="fla" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a838"/></marker>
  </defs>
  <g font-size="19" font-weight="bold" fill="#333">
    <text x="34" y="22">la nouvelle écoute</text>
    <text x="290" y="22">son bucket</text>
    <text x="530" y="22">le bucket après l'écriture</text>
  </g>
  <circle cx="15" cy="94" r="14" fill="#00684a"/><text x="15" y="100" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="34" y="56" width="234" height="76" rx="8" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="46" y="86" font-size="18" font-weight="bold" fill="#333">E1 · 8 septembre, 12 h</text>
  <text x="46" y="116" font-size="18" fill="#333"><tspan font-weight="bold" fill="#b06f00">61</tspan> auditeurs</text>
  <line x1="272" y1="94" x2="282" y2="94" stroke="#e8a838" stroke-width="3" marker-end="url(#fla)"/>
  <rect x="290" y="56" width="220" height="76" rx="8" fill="#e6f4ee" stroke="#13aa52" stroke-width="2"/>
  <text x="302" y="86" font-family="monospace" font-size="18" font-weight="bold" fill="#333">"E1-2026-09-08"</text>
  <text x="302" y="116" font-size="18" font-weight="bold" fill="#00684a">existe : mis à jour</text>
  <line x1="514" y1="94" x2="522" y2="94" stroke="#e8a838" stroke-width="3" marker-end="url(#fla)"/>
  <rect x="530" y="36" width="628" height="116" rx="8" fill="#e3eefa" stroke="#4a90d9" stroke-width="2"/>
  <text x="542" y="66" font-family="monospace" font-size="18" fill="#333">_id: "E1-2026-09-08", episode: "E1", jour: 2026-09-08</text>
  <text x="542" y="98" font-family="monospace" font-size="18" fill="#333">nb: <tspan fill="#777">2</tspan> → <tspan font-weight="bold" fill="#b06f00">3</tspan>, max: <tspan fill="#777">52</tspan> → <tspan font-weight="bold" fill="#b06f00">61</tspan></text>
  <text x="1146" y="98" font-size="18" font-weight="bold" fill="#b06f00" text-anchor="end">mesure ajoutée à la fin</text>
  <text x="542" y="134" font-family="monospace" font-size="18" fill="#333">mesures: [</text>
  <rect x="656" y="112" width="120" height="32" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="716" y="134" font-size="18" fill="#333" text-anchor="middle">0 h 10 · 35</text>
  <rect x="784" y="112" width="120" height="32" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="844" y="134" font-size="18" fill="#333" text-anchor="middle">7 h 30 · 52</text>
  <rect x="912" y="112" width="104" height="32" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="964" y="134" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">12 h · 61</text>
  <text x="1024" y="134" font-family="monospace" font-size="18" fill="#333">]</text>
  <circle cx="15" cy="230" r="14" fill="#00684a"/><text x="15" y="236" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="34" y="192" width="234" height="76" rx="8" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="46" y="222" font-size="18" font-weight="bold" fill="#333">E4 · 11 septembre, 7 h</text>
  <text x="46" y="252" font-size="18" fill="#333"><tspan font-weight="bold" fill="#b06f00">9</tspan> auditeurs</text>
  <line x1="272" y1="230" x2="282" y2="230" stroke="#e8a838" stroke-width="3" marker-end="url(#fla)"/>
  <rect x="290" y="192" width="220" height="76" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="302" y="222" font-family="monospace" font-size="18" font-weight="bold" fill="#333">"E4-2026-09-11"</text>
  <text x="302" y="252" font-size="18" font-weight="bold" fill="#c0392b">n'existe pas : créé</text>
  <line x1="514" y1="230" x2="522" y2="230" stroke="#e8a838" stroke-width="3" marker-end="url(#fla)"/>
  <rect x="530" y="172" width="628" height="116" rx="8" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="542" y="202" font-family="monospace" font-size="18" fill="#333">_id: "E4-2026-09-11", episode: "E4", jour: 2026-09-11</text>
  <text x="542" y="234" font-family="monospace" font-size="18" fill="#333">nb: <tspan font-weight="bold" fill="#b06f00">1</tspan>, max: <tspan font-weight="bold" fill="#b06f00">9</tspan></text>
  <text x="1146" y="234" font-size="18" font-weight="bold" fill="#b06f00" text-anchor="end">tout le document est créé</text>
  <text x="542" y="270" font-family="monospace" font-size="18" fill="#333">mesures: [</text>
  <rect x="656" y="248" width="84" height="32" rx="6" fill="#fdf3e0" stroke="#e8a838" stroke-width="2"/>
  <text x="698" y="270" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">7 h · 9</text>
  <text x="748" y="270" font-family="monospace" font-size="18" fill="#333">]</text>
</svg>
